verify_entry: "{{ inventory_hostname == 'ru' }}"
verify_tmp: /tmp/anysda
verify_wheel: "{{ vpn2_env.VPN2_WHEEL | default('') }}"
# Каталог на машине деплоя: туда ложится файл узла с кодом и выводом проверки, deploy.sh
# печатает вывод как есть. Пусто - плей запущен без deploy.sh, вывод не копится.
verify_out: "{{ vpn2_env.VPN2_VERIFY_OUT | default('') }}"

# Проверку ведёт пакет этого деплоя: на entry он стоит в venv, на экзит
# приезжает колесом и запускается системным python прямо из него.
verify_command_entry: /opt/vpn2/venv/bin/python -B -m vpn2.cli verify
verify_command_exit: >-
  /usr/bin/env PYTHONPATH={{ verify_tmp }}/{{ verify_wheel | basename }} /usr/bin/python3 -B -m vpn2.cli verify
verify_command: "{{ verify_command_entry if verify_entry else verify_command_exit }}"

# Настройки проверки из окружения узла (vpn2_env инвентаря).
verify_env_names:
  - HOST_TAG
  - MGMT_IP
  - EXIT_TAGS
  - ENTRY_HOST
  - YT_ROUTE
  - HY2_MGMT_PORT
  - HY2_DIRECT_PORT
  - HY2_WARP_PORT
  - SSH_PROBE_TIMEOUT
  - VERIFY_SCRAPE_TIMEOUT
  - VERIFY_SCRAPE_INTERVAL
  - VERIFY_SNAPSHOT_WAIT
  - VERIFY_REPORT
  - VERIFY_TRAFFIC
# Экзит без проверки сертификата: <ТЕГ>_HY2_INSECURE=1.
verify_env_insecure: >-
  {{ (vpn2_env.EXIT_TAGS | default('')).split() | map('upper') | map('replace', '-', '_')
     | map('regex_replace', '$', '_HY2_INSECURE') | list }}
verify_env_all: "{{ verify_env_names + verify_env_insecure }}"
# Незаданная переменная на узел не едет (в vpn2_env её нет): пустая строка - тоже значение.
verify_environment: >-
  {{ vpn2_env | default({}) | dict2items | selectattr('key', 'in', verify_env_all) | items2dict }}

# Что оставляет v1.1.5 и не создаёт чистая установка; сносится после зелёной проверки.
verify_old_layout: false
verify_old_layout_entry:
  - /usr/local/sbin/anysda-apply-routes.py
  - /usr/local/sbin/vpn2-entry-addrs
  - /usr/local/lib/anysda/wg_conf.py
  - /var/anysda/ikev2-clients.conf.sha256
  - /var/anysda/ikev2-clients.state.json
  - /var/lib/vpn2-apply/ikev2.good
  - /var/lib/vpn2-apply/wg.good
  - /var/lib/vpn2-deploy/deploy.lock
  - /var/lib/vpn2-emergency/agent.json
  - /var/lib/vpn2-emergency-sender/sender.lock
verify_old_layout_exit:
  - /var/lib/vpn2-emergency/snapshot-confirmed.json
  - /var/lib/vpn2-emergency/snapshot.lock
  - /var/lib/vpn2-emergency/web-tls
