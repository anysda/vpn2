---
# Сервер IKEv2/IPsec на strongSwan со swanctl: сервер предъявляет сертификат,
# клиент входит по EAP-MSCHAPv2. Учётные записи устройств панель раскатывает в
# /etc/swanctl/conf.d/anysda-clients.conf, трафик клиентов идёт через xfrm0 в ту
# же цепочку TPROXY sing-box, что у WireGuard и OpenVPN.
- name: Каталог отметок стадий
  ansible.builtin.file:
    path: /var/anysda/.stamps
    state: directory
    mode: '0755'

# python3-vici в Ubuntu нет ни в одном компоненте: счётчики читаются через swanctl.
- name: Пакеты strongSwan
  ansible.builtin.apt:
    name: "{{ ikev2_packages }}"
    state: present
    lock_timeout: 1200
  register: ikev2_apt
  until: ikev2_apt is succeeded
  retries: 3
  delay: 10

# Второй charon рядом со starter дрался бы за 500/4500.
- name: Пакета charon-systemd нет
  ansible.builtin.apt:
    name: charon-systemd
    state: absent
    purge: true
    lock_timeout: 1200

# В файле Caddy лежит цепочка, а swanctl берёт из certs только первый сертификат:
# скрипт кладёт leaf в x509, остальное в x509ca. Его же зовёт path-юнит ротации.
- name: Раскладка сертификата Caddy в swanctl
  ansible.builtin.copy:
    src: anysda-ikev2-le-sync.sh
    dest: /usr/local/sbin/anysda-ikev2-le-sync.sh
    mode: '0755'

# starter сам swanctl.conf не читает: без start-scripts после перезагрузки
# charon поднимается пустым и IKEv2 молчит до следующего деплоя.
- name: Загрузка swanctl при старте charon
  ansible.builtin.copy:
    src: anysda-swanctl-load.conf
    dest: /etc/strongswan.d/anysda-swanctl-load.conf
    mode: '0644'

- name: Служба strongswan-starter включена
  ansible.builtin.systemd_service:
    name: strongswan-starter
    enabled: true

- name: Ресурсы charon
  ansible.builtin.include_role:
    name: resources
  vars:
    resources_units: [strongswan-starter]

# Один шаг под замком применения сертификата: режим, сертификаты, конфиг,
# рестарт charon только при смене его входов, загрузка creds, пулов и conns,
# отметки режима для панели.
- name: Сертификаты, конфиг swanctl и загрузка в charon
  ansible.builtin.command:
    argv: >-
      {{ ikev2_host + ['ikev2-server', '--entry-host', ikev2_entry_host, '--public-host', ikev2_public_host,
         '--panel-domain', ikev2_panel_domain, '--subnet', ikev2_subnet, '--dns', ikev2_dns] }}
  environment: "{{ ikev2_env }}"
  register: ikev2_step
  changed_when: "'vpn2: changed' in ikev2_step.stdout"

# DNS клиентам отдаёт AdGuard на mgmt-адресе entry, для пакетов из xfrm0 это
# форвардинг, а ufw по умолчанию routed=deny.
- name: Порты IKE и DNS клиентов в ufw
  ansible.builtin.command:
    argv: "{{ ikev2_host + ['ufw', '--only-rules', ikev2_ufw | to_json] }}"
  environment: "{{ ikev2_env }}"
  register: ikev2_step
  changed_when: "'vpn2: changed' in ikev2_step.stdout"

# Loose RPF: policy-routing IPsec иначе режется reverse-path filter.
- name: Пересылка пакетов и мягкий rp_filter
  ansible.builtin.command:
    argv: [sysctl, -w, "{{ item }}"]
  loop:
    - net.ipv4.ip_forward=1
    - net.ipv4.conf.all.rp_filter=2
    - net.ipv4.conf.default.rp_filter=2
  changed_when: false

- name: Внешний интерфейс по маршруту по умолчанию
  ansible.builtin.command:
    cmd: ip route show default
  register: ikev2_route
  changed_when: false

- name: Юнит маршрутизации xfrm0
  ansible.builtin.copy:
    src: anysda-ikev2-routing.service
    dest: /etc/systemd/system/anysda-ikev2-routing.service
    mode: '0644'

- name: Ресурсы юнита маршрутизации
  ansible.builtin.include_role:
    name: resources
  vars:
    resources_units: [anysda-ikev2-routing]

- name: Скрипт маршрутизации xfrm0
  ansible.builtin.template:
    src: anysda-ikev2-routing.sh.j2
    dest: /usr/local/sbin/anysda-ikev2-routing.sh
    mode: '0755'
  vars:
    ikev2_wan_if: "{{ (ikev2_route.stdout_lines | select('search', 'default') | first).split()[4] }}"

- name: Маршрутизация xfrm0 включена
  ansible.builtin.systemd_service:
    name: anysda-ikev2-routing
    enabled: true
    daemon_reload: true

# Рестарт = down + up, а down удаляет xfrm0 из-под живых SA.
- name: Маршрутизация xfrm0 запущена с текущими входами
  ansible.builtin.command:
    argv: >-
      {{ ikev2_host + ['restart-if-changed', 'anysda-ikev2-routing',
         '/etc/systemd/system/anysda-ikev2-routing.service', '/usr/local/sbin/anysda-ikev2-routing.sh'] }}
  environment: "{{ ikev2_env }}"
  register: ikev2_step
  changed_when: "'vpn2: changed' in ikev2_step.stdout"

- name: Цепочка TPROXY xfrm0 на месте
  ansible.builtin.command:
    argv: "{{ ikev2_host + ['routing-ensure', 'anysda-ikev2-routing', 'xfrm0', 'ANYSDA_IKEV2_TPROXY'] }}"
  environment: "{{ ikev2_env }}"
  register: ikev2_step
  changed_when: "'vpn2: changed' in ikev2_step.stdout"

# Панель живёт в контейнере без swanctl и сокета charon. Применяет её
# anysda-clients.conf этот таймер на узле: грузит конфиг в charon, рвёт SA
# устройств со сменённым или удалённым паролем и выкладывает счётчики байт в
# /etc/anysda/ikev2-status.json.
- name: Применение учётных записей панели и счётчики
  ansible.builtin.copy:
    src: anysda-ikev2-sync.py
    dest: /usr/local/sbin/anysda-ikev2-sync.py
    mode: '0755'

- name: Юнит и таймер anysda-ikev2-sync
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  loop: [anysda-ikev2-sync.service, anysda-ikev2-sync.timer]

- name: Ресурсы anysda-ikev2-sync
  ansible.builtin.include_role:
    name: resources
  vars:
    resources_units: [anysda-ikev2-sync]

- name: Таймер anysda-ikev2-sync включён
  ansible.builtin.systemd_service:
    name: anysda-ikev2-sync.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Первый проход anysda-ikev2-sync
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: systemctl start anysda-ikev2-sync.service
  changed_when: false
  failed_when: false

# Домен, для которого ждём сертификат Caddy, шаг сервера записал в отметку.
- name: Домен сертификата Caddy
  ansible.builtin.slurp:
    src: /etc/anysda/ikev2-domain
  register: ikev2_domain

- name: Слежение за сертификатом Caddy
  when: ikev2_le_domain | length > 0
  vars:
    ikev2_le_cert: "{{ ikev2_caddy_certs }}/{{ ikev2_le_domain }}/{{ ikev2_le_domain }}.crt"
    ikev2_le_key: "{{ ikev2_caddy_certs }}/{{ ikev2_le_domain }}/{{ ikev2_le_domain }}.key"
  block:
    # Drop-in до записи юнита: systemd читает его вместе с юнитом при reload.
    - name: Ресурсы anysda-ikev2-cert-sync
      ansible.builtin.include_role:
        name: resources
      vars:
        resources_units: [anysda-ikev2-cert-sync]

    # Слежение ставится и когда каталога Caddy ещё нет. Таймер страхует пропущенные
    # события, запись cert и key порознь и временный отказ charon.
    - name: Юниты anysda-ikev2-cert-sync
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: '0644'
      loop: [anysda-ikev2-cert-sync.service, anysda-ikev2-cert-sync.path]

    - name: Таймер anysda-ikev2-cert-sync
      ansible.builtin.copy:
        src: anysda-ikev2-cert-sync.timer
        dest: /etc/systemd/system/anysda-ikev2-cert-sync.timer
        mode: '0644'

    - name: Слежение и таймер включены
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop: [anysda-ikev2-cert-sync.path, anysda-ikev2-cert-sync.timer]

- name: Без домена слежение за сертификатом снято
  when: ikev2_le_domain | length == 0
  block:
    - name: Слежение и таймер выключены
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: systemctl disable --now anysda-ikev2-cert-sync.path anysda-ikev2-cert-sync.timer
      changed_when: false
      failed_when: false

    - name: Отпечаток применённого сертификата Caddy убран
      ansible.builtin.file:
        path: /etc/anysda/ikev2-cert.sha256
        state: absent

- name: Отметка стадии
  ansible.builtin.copy:
    content: ''
    dest: /var/anysda/.stamps/27-ikev2
    force: false
    mode: '0644'
