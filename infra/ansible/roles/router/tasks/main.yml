---
# sing-box на entry: трафик клиентов, заведённый в TPROXY :7898, расходится по
# наборам geoip/geosite в туннели Hysteria2 до экзитов.
- name: Команда vpn2
  ansible.builtin.stat:
    path: "{{ router_vpn2 }}"
  register: router_vpn2_stat
  failed_when: not (router_vpn2_stat.stat.executable | default(false))

- name: Каталоги роутера
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: [/etc/anysda, /etc/sing-box, /var/lib/sing-box, "{{ router_tmp }}/router"]

- name: Установщик sing-box
  ansible.builtin.copy:
    src: "{{ router_infra }}/lib/install-sing-box.sh"
    dest: "{{ router_tmp }}/router/install-sing-box.sh"
    mode: '0755'
  changed_when: false

- name: Бинарник sing-box
  ansible.builtin.command:
    argv: ["{{ router_tmp }}/router/install-sing-box.sh"]
  environment:
    PATH: "{{ router_path }}"
    VPN2_RELEASE_MANIFEST: "{{ vpn2_env.VPN2_RELEASE_MANIFEST | default('') }}"
    VPN2_DEVELOPMENT: "{{ vpn2_env.VPN2_DEVELOPMENT | default('') }}"
  register: router_binary
  changed_when: "'уже установлен' not in router_binary.stdout"

# sing-box следит за локальными наборами и перечитывает их сам.
- name: Наборы правил geoip и geosite
  ansible.builtin.command:
    argv: "{{ router_step + ['rule-sets'] }}"
  register: router_rule_sets
  changed_when: "'changed=1' in router_rule_sets.stdout"

# Клиентам VPN до адресов самого entry открыты только публичные порты. Набор
# пишется и перед каждым стартом sing-box (ExecStartPre юнита).
- name: Набор адресов entry
  ansible.builtin.command:
    argv: "{{ router_step + ['entry-addrs'] }}"
  changed_when: false

- name: Следы прежних выпусков убраны
  ansible.builtin.command:
    argv: "{{ router_step + ['legacy'] }}"
  register: router_legacy
  changed_when: "'changed=1' in router_legacy.stdout"

- name: Секреты экзитов
  ansible.builtin.copy:
    src: "{{ router_secrets }}/foreign-secrets.env"
    dest: "{{ router_tmp }}/foreign-secrets.env"
    mode: '0600'
  changed_when: false

- name: Сертификаты и ключи узлов экзитов
  ansible.builtin.copy:
    src: "{{ router_secrets }}/{{ item }}"
    dest: "{{ router_tmp }}/"
    mode: '0600'
    directory_mode: '0700'
  loop: [exit-certs, exit-hostkeys]
  when: (router_secrets ~ '/' ~ item) is ansible.builtin.directory
  changed_when: false

- name: Пулы адресов клиентов
  ansible.builtin.copy:
    src: "{{ router_infra }}/../app/shared/vpn-pools.json"
    dest: "{{ router_tmp }}/vpn-pools.json"
    mode: '0644'
  changed_when: false

# База без ручных маршрутов: config.json из неё и правил панели собирает
# apply-routes ниже.
- name: Базовый конфиг роутера
  ansible.builtin.command:
    argv: "{{ router_step + ['base-config'] }}"
  environment: "{{ router_env }}"
  register: router_base
  changed_when: "'changed=1' in router_base.stdout"

- name: Юниты роутера
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/systemd/system/
    mode: '0644'
  loop:
    - sing-box.service
    - anysda-apply-routes.service
    - anysda-apply-routes.path

- name: Библиотека ресурсов
  ansible.builtin.copy:
    src: "{{ router_infra }}/lib/{{ item }}"
    dest: "{{ router_tmp }}/"
    mode: '0644'
  loop: [entry-resources.sh, entry_resources.py]
  changed_when: false

- name: Ресурсы юнитов роутера
  ansible.builtin.command:
    argv:
      - /bin/bash
      - --norc
      - -euo
      - pipefail
      - -c
      - 'source "$0/entry-resources.sh"; entry_unit_resources "$1"; echo "changed=$ENTRY_DROPIN_CHANGED"'
      - "{{ router_tmp }}"
      - "{{ item }}"
  environment:
    ENTRY_RESOURCE_OVERRIDES: "{{ vpn2_env.ENTRY_RESOURCE_OVERRIDES | default('') }}"
  loop: [sing-box, anysda-apply-routes]
  register: router_resources
  changed_when: "'changed=1' in router_resources.stdout"

# route_localnet нужен TPROXY клиентов WireGuard и OpenVPN (--on-ip 127.0.0.1).
- name: Sysctl роутера
  ansible.builtin.copy:
    src: 99-anysda-vpn.conf
    dest: /etc/sysctl.d/99-anysda-vpn.conf
    mode: '0644'

- name: Sysctl роутера применён
  ansible.builtin.command:
    argv: [sysctl, -p, /etc/sysctl.d/99-anysda-vpn.conf]
  changed_when: false

# Пустые файлы, чтобы наблюдателю было за чем следить до первой правки в панели.
- name: Файлы ручных маршрутов панели
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "/etc/anysda/{{ item.name }}"
    force: false
    mode: '0644'
  loop:
    - {name: manual-routes.json, content: "[]\n"}
    - {name: client-prefs.json, content: "{}\n"}

- name: Роутер включён
  ansible.builtin.systemd_service:
    name: sing-box
    enabled: true
    daemon_reload: true

- name: Наблюдатель ручных маршрутов
  ansible.builtin.systemd_service:
    name: anysda-apply-routes.path
    enabled: true
    state: started

# config.json = база + ручные маршруты панели; перезапуск один, шагом ниже.
- name: Конфиг роутера с маршрутами панели
  ansible.builtin.command:
    argv: "{{ router_step + ['apply-routes', '--no-restart'] }}"
  register: router_apply
  changed_when: "'config.json собран' in router_apply.stdout"

- name: Роутер запущен с текущими входами
  ansible.builtin.command:
    argv: "{{ router_step + ['restart'] }}"
  register: router_restart
  changed_when: "'changed=1' in router_restart.stdout"

# ssh <tag> на экзиты через служебный туннель; ключ entry раскладывает base.
- name: Конфиг ssh на экзиты
  ansible.builtin.command:
    argv: "{{ router_step + ['ssh-config'] }}"
  environment: "{{ router_env }}"
  register: router_ssh
  changed_when: "'changed=1' in router_ssh.stdout"

- name: Отметка стадии
  ansible.builtin.copy:
    content: ''
    dest: /var/anysda/.stamps/20-ru-router
    force: false
    mode: '0644'
