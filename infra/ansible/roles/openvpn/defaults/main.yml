---
openvpn_infra: "{{ lookup('ansible.builtin.env', 'VPN2_INFRA') }}"
openvpn_tmp: /tmp/anysda
openvpn_host: [/opt/vpn2/venv/bin/python, -m, vpn2.cli.host]
openvpn_env:
  HOST_TAG: "{{ inventory_hostname }}"
# Лимиты юнита из общей таблицы ресурсов entry; последним аргументом - имя юнита.
openvpn_resources:
  - /bin/bash
  - --norc
  - -euo
  - pipefail
  - -c
  - 'source "$0/entry-resources.sh"; entry_unit_resources "$1"; echo "changed=$ENTRY_DROPIN_CHANGED"'
  - "{{ openvpn_tmp }}"
openvpn_resources_env:
  ENTRY_RESOURCE_OVERRIDES: "{{ lookup('ansible.builtin.env', 'ENTRY_RESOURCE_OVERRIDES') }}"

openvpn_port: "{{ lookup('ansible.builtin.env', 'OVPN_PORT') | default('1194', true) }}"
# udp, udp4, udp6, tcp, tcp4, tcp6 и те же tcp с суффиксом -server.
openvpn_proto: "{{ lookup('ansible.builtin.env', 'OVPN_PROTO') | default('udp', true) }}"
# Сеть tun0 без маски: первая подсеть пула.
openvpn_subnet: "{{ lookup('ansible.builtin.env', 'OVPN_SUBNET') | default('10.67.67.0', true) }}"
# Единственный список пулов общий с панелью.
openvpn_pools: "{{ lookup('ansible.builtin.file', openvpn_infra ~ '/../app/shared/vpn-pools.json') | from_json }}"
openvpn_subnets: "{{ openvpn_pools.ovpn.subnets }}"
# Клиенты OpenVPN резолвят через AdGuard на mgmt-адресе entry.
openvpn_dns: 10.99.0.1
# OpenVPN различает udp4/udp6 и tcp[46]-server, ufw принимает только udp и tcp.
openvpn_ufw_proto: "{{ openvpn_proto[:3] }}"
openvpn_ufw:
  - {comment: openvpn listener, rules: ["{{ openvpn_port }}/{{ openvpn_ufw_proto }}"]}
  - comment: openvpn → AdGuard DNS
    dns: {to: "{{ openvpn_dns }}", subnets: "{{ openvpn_subnets }}"}
