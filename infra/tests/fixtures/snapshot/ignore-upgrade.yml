# Допуски слепка после обновления с выпуска (сценарий 4 карточки VPN2-751);
# склеивается cat с ignore.yml, строки добавляются с причиной по прогону.

- {section: files, name: '/var/lib/vpn2-deploy/panel/files/*', field: '*', reason: копия конфигурации прежней панели для отката}
- {section: files, name: '/var/lib/vpn2-deploy/panel/previous-*.json', field: '*', reason: запись и схема прежней панели для отката}
- {section: files, name: /var/lib/anysda-vpn2/db.sqlite, field: sha256, reason: пересозданная панель пишет в базу при старте}
- {section: containers, name: anysda-vpn2, field: 'env:NUXT_PREVIOUS_NODE_HOSTS', reason: NUXT_PREVIOUS_NODE_HOSTS пуст при первой установке и заполняется со второго деплоя}
- {section: files, name: /var/lib/vpn2-deploy/installed.json, field: '*', reason: запись об установленном выпуске - её пишет установка по манифесту и при деплое деревом её нет}
- {section: files, name: '/etc/gshadow*', field: sha256, reason: группы выпуска созданы в другом порядке - строки файла идут иначе; имена и состав групп сверяет shape /etc/group}
