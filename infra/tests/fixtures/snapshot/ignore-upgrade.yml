# Допуски слепка после обновления с выпуска (сценарий 4 карточки VPN2-751);
# склеивается cat с ignore.yml, строки добавляются с причиной по прогону.

- {section: files, name: '/var/lib/vpn2-deploy/panel/files/*', field: '*', reason: копия конфигурации прежней панели для отката}
- {section: files, name: '/var/lib/vpn2-deploy/panel/previous-*.json', field: '*', reason: запись и схема прежней панели для отката}
- {section: files, name: /var/lib/anysda-vpn2/db.sqlite, field: sha256, reason: пересозданная панель пишет в базу при старте}
- {section: containers, name: anysda-vpn2, field: 'env:NUXT_PREVIOUS_NODE_HOSTS', reason: NUXT_PREVIOUS_NODE_HOSTS пуст при первой установке и заполняется со второго деплоя}
- {section: files, name: /var/lib/vpn2-deploy/installed.json, field: '*', reason: запись об установленном выпуске - её пишет установка по манифесту и при деплое деревом её нет}
- {section: files, name: /var/lib/anysda-vpn2/state/release-manifest.json, field: '*', reason: 'манифест пишет установка по манифесту, деплой деревом его не трогает'}
- {section: files, name: '/etc/gshadow*', field: sha256, reason: группы выпуска созданы в другом порядке - строки файла идут иначе; имена и состав групп сверяет shape /etc/group}
- {section: firewall, name: 'nft ip filter FORWARD', field: 'rules[]', reason: 'после перезагрузки узла выпуска службы вставляют правила в порядке своего запуска; набор правил сверяется'}
- {section: firewall, name: 'nft ip6 filter FORWARD', field: 'rules[]', reason: 'после перезагрузки узла выпуска службы вставляют правила в порядке своего запуска; набор правил сверяется'}
- {section: firewall, name: 'nft ip mangle PREROUTING', field: 'rules[]', reason: 'после перезагрузки узла выпуска службы вставляют правила в порядке своего запуска; набор правил сверяется'}
- {section: firewall, name: 'nft ip mangle POSTROUTING', field: 'rules[]', reason: 'после перезагрузки узла выпуска службы вставляют правила в порядке своего запуска; набор правил сверяется'}
- {section: units, name: fwupd-refresh.service, field: '*', reason: 'таймер Ubuntu после перезагрузки узла выпуска запускает обновление метаданных fwupd в случайный момент'}
- {section: files, name: /opt/anysda-vpn2/config.yaml, field: shape, reason: 'config.yaml выпуска со своим шаблоном: экзит без root@, нет admin.ssh_pubkey, пароли root стёрты; что паролей нет, стенд проверяет отдельно'}
- {section: firewall, name: 'nft ip filter ufw-user-input', field: 'rules[]', reason: '443 выпуск открывал на стадии 30 - после портов VPN, чистая установка открывает его на 00-bootstrap; набор правил сверяется'}
- {section: firewall, name: 'nft ip6 filter ufw6-user-input', field: 'rules[]', reason: '443 выпуск открывал на стадии 30 - после портов VPN, чистая установка открывает его на 00-bootstrap; набор правил сверяется'}
- {section: firewall, name: ufw, field: 'status[]', reason: '443 выпуск открывал на стадии 30 - после портов VPN, чистая установка открывает его на 00-bootstrap; набор правил сверяется'}
- {section: files, name: '/etc/ufw/user*.rules', field: sha256, reason: '443 выпуск открывал на стадии 30 - после портов VPN, чистая установка открывает его на 00-bootstrap; набор правил сверяют nft и ufw status'}
