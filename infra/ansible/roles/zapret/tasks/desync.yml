---
- name: Пакеты сборки nfqws2
  ansible.builtin.apt:
    name: "{{ zapret_packages }}"
    state: present
    lock_timeout: 1200
  register: zapret_apt
  until: zapret_apt is succeeded
  retries: 3
  delay: 10

- name: Исходники zapret2 и сборка nfqws2
  ansible.builtin.command:
    argv: "{{ zapret_step + ['source'] }}"
  environment: "{{ zapret_env }}"
  register: zapret_source
  changed_when: "'changed=1' in zapret_source.stdout"

# A/B-проверка: исходящий трафик этого пользователя nft метит той же меткой, что sing-box.
- name: Диагностический пользователь
  ansible.builtin.user:
    name: ytzdiag
    system: true
    create_home: false
    shell: /usr/sbin/nologin

# sysctl conntrack появляется только после modprobe; при загрузке modules-load идёт раньше systemd-sysctl.
- name: Модуль conntrack при загрузке
  ansible.builtin.copy:
    content: "nf_conntrack\n"
    dest: /etc/modules-load.d/anysda-yt-zapret.conf
    mode: '0644'

- name: Модуль conntrack загружен
  ansible.builtin.command:
    argv: [modprobe, nf_conntrack]
  changed_when: false

- name: Каталоги дополнений юнитов и списка сетей Google
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: ["{{ zapret_units }}/nftables.service.d", "{{ zapret_units }}/sing-box.service.d", /var/lib/anysda]

# nftables.service стирает ruleset при restart и reload: drop-in возвращает таблицы YouTube.
# sing-box стартует после того, как nfqws2 занял свою очередь.
- name: Файлы десинка и видеопробы
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: '0644'
  loop:
    - {src: 97-anysda-yt-zapret.conf, dest: /etc/sysctl.d/97-anysda-yt-zapret.conf}
    - {src: nftables-90-anysda-youtube.conf, dest: "{{ zapret_units }}/nftables.service.d/90-anysda-youtube.conf"}
    - {src: sing-box-90-anysda-youtube.conf, dest: "{{ zapret_units }}/sing-box.service.d/90-anysda-youtube.conf"}
    - {src: anysda-yt-nft.service, dest: "{{ zapret_units }}/anysda-yt-nft.service"}
    - {src: anysda-yt-failover.service, dest: "{{ zapret_units }}/anysda-yt-failover.service"}
    - {src: anysda-yt-failover.timer, dest: "{{ zapret_units }}/anysda-yt-failover.timer"}
    - {src: install-yt-pot.sh, dest: "{{ zapret_tmp }}/install-yt-pot.sh"}

- name: Настройка conntrack применена
  ansible.builtin.command:
    argv: [sysctl, -p, /etc/sysctl.d/97-anysda-yt-zapret.conf]
  changed_when: false

- name: Значения для шаблонов
  ansible.builtin.command:
    argv: "{{ zapret_step + ['facts'] }}"
  environment: "{{ zapret_env }}"
  register: zapret_facts
  changed_when: false

- name: Значения для шаблонов разобраны
  ansible.builtin.set_fact:
    zapret_v: "{{ zapret_facts.stdout_lines | last | from_json }}"

- name: Цепочки nft десинка
  ansible.builtin.template:
    src: nftables-yt-zapret.conf.j2
    dest: /etc/nftables-yt-zapret.conf
    mode: '0644'
    validate: /usr/sbin/nft -c -f %s

- name: Юниты и скрипты десинка
  ansible.builtin.template:
    src: "{{ item.src }}.j2"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - {src: anysda-yt-nfqws-ready, dest: /usr/local/sbin/anysda-yt-nfqws-ready, mode: '0755'}
    - {src: anysda-yt-nfqws.service, dest: "{{ zapret_units }}/anysda-yt-nfqws.service"}
    - {src: anysda-yt-check, dest: /usr/local/bin/anysda-yt-check, mode: '0755'}

# Выключение TSO/GSO бьёт по скорости всей ноды: только по youtube.offload: off.
- name: Юнит выключения офлоада
  ansible.builtin.template:
    src: anysda-yt-offload.service.j2
    dest: "{{ zapret_units }}/anysda-yt-offload.service"
    mode: '0644'
  when: zapret_v.offload == 'off'

- name: Офлоад оставлен как есть
  ansible.builtin.include_tasks: off.yml
  vars:
    zapret_off: "{{ zapret_offload_off }}"
  when: zapret_v.offload != 'off'

# Второй рубеж к правилу sing-box по SNI: UDP/443 к сетям Google режется по адресам.
- name: Блокировка QUIC к Google
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
    force: "{{ item.force | default(true) }}"
  loop:
    - {src: anysda-yt-quic-refresh.sh, dest: /usr/local/sbin/anysda-yt-quic-refresh.sh, mode: '0755'}
    - {src: anysda-yt-quic.service, dest: "{{ zapret_units }}/anysda-yt-quic.service"}
    - {src: anysda-yt-quic-refresh.service, dest: "{{ zapret_units }}/anysda-yt-quic-refresh.service"}
    - {src: anysda-yt-quic-refresh.timer, dest: "{{ zapret_units }}/anysda-yt-quic-refresh.timer"}
  when: zapret_quic == 'block'

- name: Блокировка QUIC снята
  ansible.builtin.include_tasks: off.yml
  vars:
    zapret_off: "{{ zapret_quic_off }}"
  when: zapret_quic != 'block'

- name: Предупреждение о снятой блокировке QUIC
  ansible.builtin.debug:
    msg: Видео YouTube может стартовать с задержкой, если провайдер режет QUIC.
  when: zapret_quic != 'block'

- name: Файлы прежних выпусков убраны
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: [/usr/local/sbin/gen-yt-quic-nft.py, /usr/local/bin/anysda-yt-failover]

- name: Ресурсы юнитов
  ansible.builtin.include_role:
    name: resources
  vars:
    resources_units: "{{ zapret_resource_units }}"

- name: Службы десинка включены
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop: [anysda-yt-nft.service, anysda-yt-nfqws.service]

- name: Офлоад выключен
  ansible.builtin.systemd_service:
    name: anysda-yt-offload.service
    enabled: true
    state: started
  failed_when: false
  when: zapret_v.offload == 'off'

# Каждый прогон перечитывает список сетей и перезаливает таблицу QUIC.
- name: Блокировка QUIC включена и перезалита
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    enabled: true
    state: "{{ item.state }}"
  loop:
    - {name: anysda-yt-quic.service, state: restarted}
    - {name: anysda-yt-quic-refresh.timer, state: started}
  changed_when: false
  when: zapret_quic == 'block'

- name: Цепочки и nfqws2 запущены с текущими входами
  ansible.builtin.command:
    argv: "{{ zapret_step + ['restart'] }}"
  environment: "{{ zapret_env }}"
  register: zapret_restart
  changed_when: "'changed=1' in zapret_restart.stdout"

- name: Видеопроба
  ansible.builtin.include_tasks: probe.yml

- name: Таймер видеопробы запущен
  ansible.builtin.systemd_service:
    name: anysda-yt-failover.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Видеопроба перемерена после смены её кода
  ansible.builtin.command:
    argv: "{{ zapret_step + ['remeasure'] }}"
  changed_when: false

# Провал не останавливает установку: сторож меняет маршрут только по измеренным загрузкам видео.
- name: Тот же хост по помеченному пути и мимо него
  ansible.builtin.command:
    argv: [/usr/local/bin/anysda-yt-check]
  register: zapret_check
  changed_when: false
  failed_when: false

- name: Итог A/B-проверки
  ansible.builtin.debug:
    msg: "{{ zapret_check.stdout_lines }}"

- name: Отметка стадии
  ansible.builtin.copy:
    content: ''
    dest: /var/anysda/.stamps/19-yt-zapret
    force: false
    mode: '0644'
