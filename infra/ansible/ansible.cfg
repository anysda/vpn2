[defaults]
inventory = inventory.py
roles_path = roles
strategy_plugins = strategy
strategy = mitogen_linear
forks = 10
gathering = explicit
host_key_checking = True
interpreter_python = /usr/bin/python3
stdout_callback = default
retry_files_enabled = False
deprecation_warnings = False
# Срок входа на узел целиком: ssh за это время повторяет подключение (ConnectionAttempts ниже).
timeout = 90

[ssh_connection]
pipelining = True
# Путь до экзита пропадает на десятки секунд: подключение повторяется 9 раз по ConnectTimeout=10
# из inventory.py. Отказ в ключе хоста или во входе не повторяется.
ssh_args = -o ConnectionAttempts=9
