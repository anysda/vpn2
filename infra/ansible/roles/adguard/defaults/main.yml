---
adguard_infra: "{{ vpn2_env.VPN2_INFRA | default('') }}"
adguard_tmp: /tmp/anysda
adguard_vpn2: /opt/vpn2/venv/bin/vpn2
adguard_step: ["{{ adguard_vpn2 }}", adguard]

# Окружение шагов - все переменные узла, кроме пароля входа на entry.
adguard_env: "{{ vpn2_env | dict2items | rejectattr('key', 'eq', 'SSH_PASS') | items2dict }}"
