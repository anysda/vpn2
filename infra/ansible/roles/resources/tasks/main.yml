---
# Лимиты памяти и приоритеты юнитов drop-in zz-vpn2-resources.conf. Роль зовут
# через include_role со списком resources_units; итог читается из resources_step.
- name: Ресурсы юнитов
  ansible.builtin.command:
    argv: "{{ resources_host + ['resources'] + resources_units }}"
  register: resources_step
  changed_when: "'vpn2: changed' in resources_step.stdout"
