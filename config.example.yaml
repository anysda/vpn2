# anysda-vpn2 — конфигурация инфраструктуры
#
# 1. Запусти интерактивный мастер: ./setup.sh
#    (или скопируй этот файл и заполни вручную: cp config.example.yaml config.yaml)
# 2. ./deploy.sh check
# 3. ./deploy.sh all
#
# chmod 600 — файл содержит пароли в открытом виде.

# Входная нода — WireGuard + OpenVPN серверы, sing-box роутер, веб-панель,
# AdGuard. Авторизация через root + пароль (sshpass).
entry:
  host: 1.2.3.4
  password: <root-password>

# Выходные ноды — Hysteria2 серверы. Минимум 1, рекомендуется 2+.
exits:
  - tag: us              # короткий тег: us / gb / nl / de / us2 / ...
    host: 5.6.7.8
    password: <root-password>

  - tag: gb
    host: 9.10.11.12
    password: <root-password>
    hy2_direct_port: 4443   # опционально — задай если хостер фильтрует UDP:443
                            # (verify_and_rotate_ports сделает это сам, но можно
                            # сразу прописать чтобы не пересобирать)

# Учётка администратора (веб-панель + AdGuard UI).
# password опционально: если пусто — будет сгенерирован 18-символьный пароль
# при первом деплое и записан в /etc/anysda/admin-password.txt на RU ноде.
admin:
  user: anysda
  # password: my-secret

# Домен для веб-панели (опционально).
# Если задан — Caddy получит Let's Encrypt сертификат, панель доступна по
# HTTPS. A-запись домена должна указывать на IP entry-ноды.
# Hysteria2-туннели НЕ зависят от домена и остаются на self-signed TLS (IP).
# panel:
#   domain: vpn.example.com

# Telegram-бот (опционально).
# Если задан — стейдж 35-telegram развернёт бот; иначе skip.
# telegram:
#   bot_token: <telegram-bot-token>
#   chat_id: <telegram-chat-id>

# Кастомные порты (опционально). Дефолты подходят для большинства настроек.
# ports:
#   hy2_direct: 443                                 # Hysteria2 прямой (entry → exit) — UDP/QUIC, 443 ок
#   hy2_warp: 8443                                  # Hysteria2 через Cloudflare WARP
#   mgmt: 51900                                     # WG-mesh между нодами (служебный)

# Бэкапы (опционально, по умолчанию ВКЛЮЧЕНЫ с backend=local).
# Архив включает: db.sqlite (через sqlite3 .backup), /etc/anysda/* (секреты
# панели и бота), WG server private key (/etc/wireguard/wg0.conf), OpenVPN
# CA + PKI (/etc/openvpn/pki/, server.conf, ccd/, crl.pem) + manifest.json
# с SHA-256 каждого компонента. Архив шифруется age (symmetric passphrase)
# на entry ДО записи на диск/выгрузки в S3 — plaintext .tar.gz никогда не
# покидает mktemp-dir и не остаётся в файловой системе.
#
# passphrase — единственный секрет. Потерял = бэкапы нечитаемы.
# Если оставить пустым — setup.sh сгенерит крепкий и распечатает один раз;
# далее лежит в config.yaml (chmod 600), как и admin.password / root-пароли
# нод. На компрометацию оркестратора — ротировать passphrase И re-encrypt
# существующие бэкапы (см. README §Backup & Disaster Recovery).
backup:
  enabled: true                # отключить — backup: { enabled: false }
  backend: local               # local | s3
  passphrase: ""               # age symmetric passphrase; пусто → setup.sh auto-gen
  retention: 10                # keep last N; «последний успешный» защищён от удаления
  schedule: daily              # off | daily — daily ставит systemd-timer на 02:00
                               # по локальной TZ entry-ноды (timedatectl)
  local:
    dir: /var/backups/anysda-vpn2

  # S3 — только если backend: s3. aws-cli ставится 26-backup, поддерживает любой
  # S3-совместимый endpoint: AWS, MinIO, Backblaze B2, Cloudflare R2, Yandex
  # Object Storage, Cloud.ru и т.д. Креды кладёт setup.sh, доставляет 26-backup
  # в /etc/anysda/backup.env (chmod 600), systemd читает через EnvironmentFile.
  # s3:
  #   endpoint: https://s3.eu-central-1.amazonaws.com
  #   bucket:   my-anysda-backups
  #   region:   eu-central-1     # ОБЯЗАТЕЛЕН для cloud.ru (ru-central-1),
  #                              # yandex (ru-central1), selectel (ru-1) и др.
  #                              # AWS — региона из endpoint (eu-central-1 и т.п.)
  #   access_key: ""
  #   secret_key: ""
