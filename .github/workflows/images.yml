name: images

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: panel
            context: app
          - name: tgbot
            context: telegram
          # Аварийный фронт: агент, статика панели и /instructions.
          - name: emergency
            context: .
            file: infra/emergency/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Тег sha-<ветка>-<коммит>: dev и main на одном коммите не перетирают
      # друг друга. У тега v* ветки нет, там хватает номера версии.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-{{branch}}-,enable=${{ github.ref_type == 'branch' }}

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: |
            VPN2_VERSION=${{ steps.meta.outputs.version }}
            VPN2_REVISION=${{ github.sha }}
          platforms: linux/amd64
          load: true
          tags: smoke/${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}

      # Образ, который не стартует, в реестр не уезжает: нода стянет его при деплое.
      - name: smoke panel
        if: matrix.name == 'panel'
        run: |
          trap 'docker rm -f smoke >/dev/null' EXIT
          docker run -d --name smoke -e PORT=31821 -p 127.0.0.1:31821:31821 \
            --tmpfs /var/lib/anysda-vpn2:uid=10001,gid=10001,mode=0700 \
            -e NUXT_DATABASE_URL=file:/var/lib/anysda-vpn2/db.sqlite smoke/panel \
            sh -ec 'node scripts/migrate.mjs; exec node .output/server/index.mjs'
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:31821/api/version && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: smoke tgbot
        if: matrix.name == 'tgbot'
        run: >
          docker run --rm --entrypoint python smoke/tgbot -c
          "import ast, telegram, aiohttp, qrcode; ast.parse(open('bot.py').read())"

      # Аварийку деплой ставит без запуска контейнера: пакет и статику
      # копирует из остановленного контейнера и запускает хостовым python.
      - name: smoke emergency
        if: matrix.name == 'emergency'
        run: |
          work=$(mktemp -d)
          trap 'docker rm -f smoke >/dev/null; kill "$server" 2>/dev/null; rm -rf "$work"' EXIT
          docker create --name smoke --network none smoke/emergency >/dev/null
          docker cp smoke:/opt/vpn2-emergency/. "$work/"
          test -f "$work/install-hy2.sh"
          python3 -c 'import json, sys; json.load(open(sys.argv[1]))["revision"]' "$work/image.json"
          PYTHONPATH="$work" python3 -B -c '
          import sys
          from vpn2_emergency import web
          web.make_server(sys.argv[1], exit_id="smoke", public_ip="127.0.0.1",
                          address=("127.0.0.1", 31822), cert_dir=sys.argv[1]).serve_forever()
          ' "$work/state" &
          server=$!
          for _ in $(seq 1 30); do
            if curl -fsSk https://127.0.0.1:31822/instructions -o "$work/instructions.html"; then
              grep -q 'Временное подключение Hysteria2' "$work/instructions.html" && exit 0
            fi
            sleep 1
          done
          exit 1

      - name: push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: |
            VPN2_VERSION=${{ steps.meta.outputs.version }}
            VPN2_REVISION=${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Digest в аннотации: логи прогона без токена закрыты, а аннотации
      # публичны — по ним сверяют то, что нода стянула, с тем, что собрали.
      - name: digest
        run: echo "::notice title=${{ matrix.name }}:${{ steps.meta.outputs.version }}::${{ steps.push.outputs.digest }}"

      - name: save digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_NAME: ${{ matrix.name }}
        run: printf '%s\n' "$IMAGE_DIGEST" > "$IMAGE_NAME.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: ${{ matrix.name }}.txt

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags: rollback plan compares migrations with the previous release.
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: release manifest
        run: python3 infra/lib/build-release.py --digests digests --output release-manifest.json
      - name: validate source contract
        run: python3 infra/lib/release.py --manifest release-manifest.json check .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release-manifest.json
          retention-days: 90
