---
# Ядерный WireGuard на wg0. Панель переписывает wg0.conf пирами включённых
# клиентов и применяет его `wg syncconf`.
- name: Каталог WireGuard
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    mode: '0700'

- name: Пакет wireguard-tools
  ansible.builtin.apt:
    name: [wireguard-tools]
    state: present
    lock_timeout: 1200
  register: wireguard_apt
  until: wireguard_apt is succeeded
  retries: 3
  delay: 10

- name: Модуль ядра wireguard
  ansible.builtin.command:
    cmd: modprobe wireguard
  changed_when: false
  failed_when: false

# Действующий приватный ключ не ротируется.
- name: Ключи сервера и начальный wg0.conf
  ansible.builtin.command:
    argv: "{{ wireguard_host + ['wg-identity', '--port', wireguard_port, '--address', wireguard_address] }}"
  environment: "{{ wireguard_env }}"
  register: wireguard_step
  changed_when: "'vpn2: changed' in wireguard_step.stdout"

# Ядро форвардит v6 только при all.forwarding=1; разрешённое держит ip6tables FORWARD.
- name: Пересылка пакетов между интерфейсами
  ansible.builtin.copy:
    content: "net.ipv4.ip_forward=1\nnet.ipv4.conf.all.forwarding=1\nnet.ipv6.conf.all.forwarding=1\n"
    dest: /etc/sysctl.d/98-wg-forward.conf
    mode: '0644'
  register: wireguard_sysctl

- name: Пересылка пакетов применена  # noqa: no-handler
  ansible.builtin.command: sysctl -p /etc/sysctl.d/98-wg-forward.conf
  when: wireguard_sysctl is changed
  changed_when: true

- name: Порт WireGuard и DNS клиентов в ufw
  ansible.builtin.command:
    argv: "{{ wireguard_host + ['ufw', '--only-rules', wireguard_ufw | to_json] }}"
  environment: "{{ wireguard_env }}"
  register: wireguard_step
  changed_when: "'vpn2: changed' in wireguard_step.stdout"

- name: Служба wg-quick@wg0 включена
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    enabled: true

# Рестарт wg-quick рвёт туннель всем клиентам: при прежних адресах - `wg syncconf`.
- name: Конфиг wg0 применён
  ansible.builtin.command:
    argv: "{{ wireguard_host + ['wg-apply'] }}"
  environment: "{{ wireguard_env }}"
  register: wireguard_step
  changed_when: "'vpn2: changed' in wireguard_step.stdout"

- name: Маршрутизация wg0
  ansible.builtin.include_tasks: routing.yml
  vars:
    wireguard_routing: {unit: anysda-wg-routing, iface: wg0, chain: ANYSDA_WG_TPROXY, mss: "{{ wireguard_mss }}",
                        after: wg-quick@wg0.service, routes: "{{ wireguard_subnets }}", v6_reject: true}
