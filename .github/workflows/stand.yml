name: stand

# Семь заданий идут параллельно (матрица Ubuntu 24.04 и 26.04).
# deploy: чистая установка деревом ветки, 99-verify с настоящим трафиком
#   WireGuard/OpenVPN/IKEv2; дальше на своём стенде одна из двух частей:
#   again - слепок против эталона и повторный деплой (слепок тот же с допусками
#   ignore-again.yml); restore - restore эталонного архива бэкапа.
# upgrade: выпуск UPGRADE_FROM, поставленный по манифесту (на dev диски узлов
#   после установки живут в кэше, ВМ грузятся с них), обновление деревом ветки, слепок
#   как у чистой установки с допусками ignore-upgrade.yml. С прошлого выпуска,
#   на ветке выпуска - с 1.1.5.
# Бот с поддельным токеном (панель жива, бот на паузе) - после обновления, на
#   ветке выпуска - в again: там короче задание.
# udp-cut: на своём стенде обрыв UDP entry → экзит.
# Запускается на dev, на ветке выпуска и вручную, не на каждый PR. Коммит выпуска
# проверяется на lane/release вместе с checks, dev этот прогон не повторяет.
on:
  push:
    branches: [dev, lane/release]
  workflow_dispatch:
    inputs:
      stop_openvpn:
        description: 'Отрицательный контроль: остановить OpenVPN на entry перед проверкой'
        type: boolean
        default: false
      break_tcp_fallback:
        description: 'Отрицательный контроль: при обрыве UDP резать и запасной TCP до экзита'
        type: boolean
        default: false
      snapshot_reason:
        description: 'Пересъёмка эталона слепка: причина'
        type: string
        default: ''
      snapshot_corrupt:
        description: 'Положительный контроль: испортить файл на entry перед слепком'
        type: boolean
        default: false
      backup_fixture:
        description: 'Снять эталонный архив бэкапа в артефакт'
        type: boolean
        default: false
      restore_foreign:
        description: 'Отрицательный контроль: restore с чужим паролем обязан упасть'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: stand-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reuse:
    name: стенд коммита уже пройден
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      run: ${{ steps.reuse.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/reuse.py stand

  deploy:
    name: "стенд развёртывание Ubuntu ${{ matrix.os }}, ${{ matrix.part == 'again' && 'повторный деплой' || 'restore' }}"
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ['24.04', '26.04']
        part: [again, restore]
    env:
      STAND_OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Образ и ядро ВМ между ранами: с Ubuntu - только при новой сборке образа.
      - name: ключ образа ВМ
        id: image
        run: echo "key=stand-image-$(infra/tests/ci-stand.sh image-key)" >> "$GITHUB_OUTPUT"

      - name: image cache
        id: image-cache
        uses: actions/cache/restore@v6
        with:
          path: /var/tmp/vpn2-image-cache
          key: ${{ steps.image.outputs.key }}

      # Пакеты ВМ - через прокси apt на раннере; его каталог живёт между ранами.
      # До up: прокси поднимается до запуска ВМ, их прогрев идёт через него.
      - name: apt cache
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: /var/tmp/vpn2-apt-cache
          key: stand-apt-${{ matrix.os }}-${{ hashFiles('deploy.sh', 'infra/deploy.sh', 'infra/versions.yml', 'infra/lib/*.sh', 'infra/ansible/**/*.yml') }}
          restore-keys: stand-apt-${{ matrix.os }}-

      # qemu и прокси apt на раннер - из набора .deb, не с зеркал: ci-stand.sh
      # видит их на месте и свой apt-get не зовёт.
      - name: qemu и прокси apt
        timeout-minutes: 5
        uses: ./.github/actions/apt-install
        with:
          packages: qemu-system-x86 qemu-utils cloud-image-utils apt-cacher-ng

      # STAND_OS sudo сам не передаёт.
      - name: up (фоном)
        run: sudo --preserve-env=STAND_OS infra/tests/ci-stand.sh up-bg

      # Полный деплой сам кончается 99-verify всех узлов. Он идёт фоном, пока собирается образ панели:
      # образ нужен ему после 00-bootstrap, ci-stand.sh его ждёт. Venv сверки слепков - тоже фоном.
      - name: deploy (фоном)
        run: |
          if [ "${{ matrix.part }}" = again ]; then
            { python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q ./infra/vpn2
              echo $? > "$RUNNER_TEMP/venv.rc"; } > "$RUNNER_TEMP/venv.log" 2>&1 &
          fi
          { sudo infra/tests/ci-stand.sh up-wait > "$RUNNER_TEMP/up.log" 2>&1; echo $? > "$RUNNER_TEMP/up.rc"
            [ "$(cat "$RUNNER_TEMP/up.rc")" = 0 ] && sudo infra/tests/ci-stand.sh deploy vpn2-stand/panel:${{ github.sha }}
            echo $? > "$RUNNER_TEMP/deploy.rc"; } > "$RUNNER_TEMP/deploy.log" 2>&1 &

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      # Панель из этого же коммита: кэш gha ветке виден только свой и main.
      - name: panel image
        uses: docker/build-push-action@v7
        with:
          context: app
          platforms: linux/amd64
          load: true
          tags: vpn2-stand/panel:${{ github.sha }}
          cache-from: |
            type=gha,scope=panel-stand
            type=gha,scope=checks-panel
            type=registry,ref=ghcr.io/${{ github.repository }}/panel:buildcache-dev
            type=gha,scope=panel
          cache-to: type=gha,mode=max,scope=panel-stand

      - name: up
        id: up
        run: |
          until [ -s "$RUNNER_TEMP/up.rc" ]; do sleep 0.5; done
          cat "$RUNNER_TEMP/up.log"
          exit "$(cat "$RUNNER_TEMP/up.rc")"

      # Сразу после up: образ и ядро уже проверены по суммам.
      - name: image cache save
        if: ${{ steps.image-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /var/tmp/vpn2-image-cache
          key: ${{ steps.image.outputs.key }}

      - name: deploy
        run: |
          tail -n +1 -f "$RUNNER_TEMP/deploy.log" & shown=$!
          until [ -s "$RUNNER_TEMP/deploy.rc" ]; do sleep 0.5; done
          sleep 1; kill "$shown"
          exit "$(cat "$RUNNER_TEMP/deploy.rc")"

      # ansible с entry достаёт все узлы стенда.
      - name: ansible ping
        if: matrix.part == 'again'
        run: sudo infra/tests/ci-stand.sh ansible-ping

      # Отрицательный контроль: 99-verify при остановленном OpenVPN обязан упасть.
      - name: verify
        if: ${{ matrix.part == 'again' && inputs.stop_openvpn && !cancelled() && steps.up.outcome == 'success' }}
        run: sudo infra/tests/ci-stand.sh verify --stop-openvpn

      # Положительный контроль: сверка слепка с эталоном после этого обязана упасть.
      - name: snapshot corrupt
        if: ${{ matrix.part == 'again' && inputs.snapshot_corrupt }}
        run: sudo infra/tests/ci-stand.sh snapshot-corrupt

      # Слепки в stand-report: collect проверяет их на пароль стенда, а
      # артефакт отчёта их отдаёт.
      - name: snapshot
        if: matrix.part == 'again'
        run: sudo infra/tests/ci-stand.sh snapshot stand-report

      - name: venv
        if: matrix.part == 'again'
        timeout-minutes: 3
        run: |
          until [ -s "$RUNNER_TEMP/venv.rc" ]; do sleep 0.2; done
          cat "$RUNNER_TEMP/venv.log"
          exit "$(cat "$RUNNER_TEMP/venv.rc")"

      # Оба узла сверяются всегда: красный шаг - если разошёлся хоть один
      # или эталона нет.
      - name: snapshot diff
        if: ${{ matrix.part == 'again' && inputs.snapshot_reason == '' }}
        run: |
          rc=0
          for node in entry exit; do
            ref=infra/tests/fixtures/snapshot/ubuntu-$STAND_OS-$node.json.gz
            if [[ ! -f $ref ]]; then
              echo "эталона нет: $ref"
              rc=1
              continue
            fi
            "$RUNNER_TEMP/venv/bin/python" infra/tests/snapshot.py diff --ignore infra/tests/fixtures/snapshot/ignore.yml \
              "$ref" "stand-report/snapshot-$node.json" || rc=1
          done
          exit "$rc"

      # Пересъёмка: сверки нет, слепки уходят артефактом под именами эталонов.
      # В репу CI их не коммитит. stand-report принадлежит root, поэтому
      # сжатое кладётся в свой каталог.
      - name: snapshot reference
        if: ${{ matrix.part == 'again' && inputs.snapshot_reason != '' }}
        env:
          SNAPSHOT_REASON: ${{ inputs.snapshot_reason }}
        run: |
          echo "Пересъёмка эталона слепка Ubuntu $STAND_OS, причина: $SNAPSHOT_REASON"
          mkdir snapshot-ref
          for node in entry exit; do
            gzip -n -c "stand-report/snapshot-$node.json" > "snapshot-ref/ubuntu-$STAND_OS-$node.json.gz"
          done

      - uses: actions/upload-artifact@v7
        if: ${{ matrix.part == 'again' && inputs.snapshot_reason != '' }}
        with:
          name: snapshot-ubuntu-${{ matrix.os }}
          path: snapshot-ref/
          if-no-files-found: error

      # Сценарий 2 карточки: слепок до и после повторного ./deploy.sh одинаков.
      - name: повторный деплой
        if: matrix.part == 'again'
        run: sudo infra/tests/ci-stand.sh deploy-again stand-report

      - name: "повторный деплой: слепок тот же"
        if: matrix.part == 'again'
        run: |
          rc=0
          cat infra/tests/fixtures/snapshot/ignore.yml infra/tests/fixtures/snapshot/ignore-again.yml > "$RUNNER_TEMP/ignore-again.yml"
          for node in entry exit; do
            "$RUNNER_TEMP/venv/bin/python" infra/tests/snapshot.py diff --ignore "$RUNNER_TEMP/ignore-again.yml" \
              "stand-report/snapshot-$node.json" "stand-report/snapshot-again-$node.json" || rc=1
          done
          exit "$rc"

      # Сценарий 5 карточки: после слепков, токен бота их не трогает. Здесь - на
      # ветке выпуска, иначе в задании обновления, оно там короче.
      - name: бот с поддельным токеном
        if: ${{ matrix.part == 'again' && github.ref == 'refs/heads/lane/release' }}
        run: sudo infra/tests/ci-stand.sh bot-fake-token

      # Сценарий 3 карточки: restore эталонного архива и сверка с эталоном.
      - name: restore эталонного архива
        if: ${{ matrix.part == 'restore' && !inputs.backup_fixture }}
        run: sudo infra/tests/ci-stand.sh restore-check ${{ inputs.restore_foreign && '--foreign-pass' || '' }}

      - name: эталонный архив бэкапа
        if: ${{ matrix.part == 'restore' && inputs.backup_fixture }}
        run: sudo infra/tests/ci-stand.sh backup-fixture backup-fixture && sudo chown -R "$USER" backup-fixture

      - uses: actions/upload-artifact@v7
        if: ${{ matrix.part == 'restore' && inputs.backup_fixture }}
        with:
          name: backup-fixture-ubuntu-${{ matrix.os }}
          path: backup-fixture/
          if-no-files-found: error

      - name: collect
        if: always()
        run: sudo infra/tests/ci-stand.sh collect stand-report && sudo chown -R "$USER" stand-report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-report-${{ matrix.part == 'restore' && 'restore-' || '' }}ubuntu-${{ matrix.os }}
          path: stand-report/
          if-no-files-found: warn

      - name: down
        if: always()
        run: sudo infra/tests/ci-stand.sh down

      - name: apt cache save
        if: ${{ always() && matrix.part == 'again' && steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /var/tmp/vpn2-apt-cache
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

  upgrade:
    name: стенд обновление с выпуска ${{ matrix.from }} Ubuntu ${{ matrix.os }}
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ['24.04', '26.04']
        from: ${{ fromJSON(github.ref == 'refs/heads/lane/release' && '["1.1.5"]' || '["1.2.0"]') }}
    env:
      STAND_OS: ${{ matrix.os }}
      UPGRADE_FROM: ${{ matrix.from }}
    steps:
      # fetch-depth 0: нужен тег выпуска (archive и список удалённых файлов).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Образ и ядро ВМ между ранами: с Ubuntu - только при новой сборке образа.
      - name: ключ образа ВМ
        id: image
        run: |
          echo "key=stand-image-$(infra/tests/ci-stand.sh image-key)" >> "$GITHUB_OUTPUT"
          echo "release=stand-release-$(infra/tests/ci-stand.sh release-key "$UPGRADE_FROM")" >> "$GITHUB_OUTPUT"

      - name: image cache
        id: image-cache
        uses: actions/cache/restore@v6
        with:
          path: /var/tmp/vpn2-image-cache
          key: ${{ steps.image.outputs.key }}

      # Установленный выпуск: есть в кэше - ВМ грузятся с его дисков.
      - name: release cache
        id: release-cache
        uses: actions/cache/restore@v6
        with:
          path: /var/tmp/vpn2-release-cache
          key: ${{ steps.image.outputs.release }}

      # Пакеты ВМ - через прокси apt на раннере; его каталог живёт между ранами.
      # До up: прокси поднимается до запуска ВМ, их прогрев идёт через него.
      - name: apt cache
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: /var/tmp/vpn2-apt-cache
          key: stand-apt-${{ matrix.os }}-${{ hashFiles('deploy.sh', 'infra/deploy.sh', 'infra/versions.yml', 'infra/lib/*.sh', 'infra/ansible/**/*.yml') }}
          restore-keys: stand-apt-${{ matrix.os }}-

      # qemu и прокси apt на раннер - из набора .deb, не с зеркал: ci-stand.sh
      # видит их на месте и свой apt-get не зовёт.
      - name: qemu и прокси apt
        timeout-minutes: 5
        uses: ./.github/actions/apt-install
        with:
          packages: qemu-system-x86 qemu-utils cloud-image-utils apt-cacher-ng

      # ВМ грузятся, пока собирается образ панели. STAND_OS sudo сам не передаёт.
      - name: up (фоном)
        run: sudo --preserve-env=STAND_OS infra/tests/ci-stand.sh up-bg ${{ steps.release-cache.outputs.cache-hit == 'true' && '--release' || '' }}

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      # Панель из этого же коммита. Кэш gha ветке виден только свой и main,
      # поэтому dev - через реестр (пишет images.yml): первая сборка ветки тёплая.
      - name: panel image
        uses: docker/build-push-action@v7
        with:
          context: app
          platforms: linux/amd64
          load: true
          tags: vpn2-stand/panel:${{ github.sha }}
          cache-from: |
            type=gha,scope=panel-stand
            type=gha,scope=checks-panel
            type=registry,ref=ghcr.io/${{ github.repository }}/panel:buildcache-dev
            type=gha,scope=panel
          cache-to: type=gha,mode=max,scope=panel-stand

      - name: up
        id: up
        run: sudo infra/tests/ci-stand.sh up-wait

      # Сразу после up: образ и ядро уже проверены по суммам.
      - name: image cache save
        if: ${{ steps.image-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /var/tmp/vpn2-image-cache
          key: ${{ steps.image.outputs.key }}

      # Манифест выпуска: образы по digest, как их собрал релиз.
      - name: манифест выпуска
        if: steps.release-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$UPGRADE_FROM" -p release-manifest.json -D "$RUNNER_TEMP"

      # Сценарий 4 карточки: чистая установка выпуска, поверх - дерево ветки.
      - name: установка выпуска
        if: steps.release-cache.outputs.cache-hit != 'true'
        run: sudo infra/tests/ci-stand.sh deploy-release "$UPGRADE_FROM" "$RUNNER_TEMP/release-manifest.json"

      # Диски выпуска - в кэш ветки пуша (dev, lane/release: кэш ветки другим
      # веткам не виден); ВМ грузятся с них, как в прогоне с попаданием.
      - name: выпуск в кэш
        if: steps.release-cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        run: sudo infra/tests/ci-stand.sh release-save && sudo --preserve-env=STAND_OS infra/tests/ci-stand.sh up-bg --release

      - name: release cache save
        if: steps.release-cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: /var/tmp/vpn2-release-cache
          key: ${{ steps.image.outputs.release }}

      - name: up с дисков выпуска
        if: steps.release-cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        run: sudo infra/tests/ci-stand.sh up-wait

      - name: обновление до ветки
        run: sudo infra/tests/ci-stand.sh deploy-upgrade vpn2-stand/panel:${{ github.sha }} "$UPGRADE_FROM"

      # Слепки в stand-report: collect проверяет их на пароль стенда, а
      # артефакт отчёта их отдаёт.
      - name: snapshot
        run: sudo infra/tests/ci-stand.sh snapshot stand-report

      - name: venv
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q ./infra/vpn2

      # Слепок после обновления равен эталону чистой установки; оба узла
      # сверяются всегда, красный шаг - если разошёлся хоть один.
      - name: "обновление: слепок как у чистой установки"
        run: |
          rc=0
          cat infra/tests/fixtures/snapshot/ignore.yml infra/tests/fixtures/snapshot/ignore-upgrade.yml > "$RUNNER_TEMP/ignore-upgrade.yml"
          for node in entry exit; do
            "$RUNNER_TEMP/venv/bin/python" infra/tests/snapshot.py diff --ignore "$RUNNER_TEMP/ignore-upgrade.yml" \
              "infra/tests/fixtures/snapshot/ubuntu-${{ matrix.os }}-$node.json.gz" "stand-report/snapshot-$node.json" || rc=1
          done
          exit "$rc"

      # Сценарий 5 карточки на обновлённой ветке; на ветке выпуска - в again.
      - name: бот с поддельным токеном
        if: github.ref != 'refs/heads/lane/release'
        run: sudo infra/tests/ci-stand.sh bot-fake-token

      - name: collect
        if: always()
        run: sudo infra/tests/ci-stand.sh collect stand-report && sudo chown -R "$USER" stand-report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-report-upgrade-${{ matrix.from }}-ubuntu-${{ matrix.os }}
          path: stand-report/
          if-no-files-found: warn

      - name: down
        if: always()
        run: sudo infra/tests/ci-stand.sh down

      - name: apt cache save
        if: ${{ always() && steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /var/tmp/vpn2-apt-cache
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

  # Обрыв UDP entry → экзит: трафик уходит на запасной TCP без перезапуска
  # sing-box и возвращается на Hysteria2. Стенд только из нужных стадий.
  udp-cut:
    name: стенд обрыв UDP
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Образ и ядро ВМ между ранами: с Ubuntu - только при новой сборке образа.
      - name: ключ образа ВМ
        id: image
        run: echo "key=stand-image-$(infra/tests/ci-stand.sh image-key)" >> "$GITHUB_OUTPUT"

      - name: image cache
        id: image-cache
        uses: actions/cache/restore@v6
        with:
          path: /var/tmp/vpn2-image-cache
          key: ${{ steps.image.outputs.key }}

      # Пакеты ВМ - через прокси apt на раннере; его каталог живёт между ранами.
      # Узлы обрыва - Ubuntu 26.04: кэш общий с развёртыванием 26.04.
      - name: apt cache
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: /var/tmp/vpn2-apt-cache
          key: stand-apt-26.04-${{ hashFiles('deploy.sh', 'infra/deploy.sh', 'infra/versions.yml', 'infra/lib/*.sh', 'infra/ansible/**/*.yml') }}
          restore-keys: stand-apt-26.04-

      # qemu и прокси apt на раннер - из набора .deb, не с зеркал: ci-stand.sh
      # видит их на месте и свой apt-get не зовёт.
      - name: qemu и прокси apt
        timeout-minutes: 5
        uses: ./.github/actions/apt-install
        with:
          packages: qemu-system-x86 qemu-utils cloud-image-utils apt-cacher-ng

      - name: up
        id: up
        run: sudo infra/tests/ci-stand.sh up

      # Сразу после up: образ и ядро уже проверены по суммам.
      - name: image cache save
        if: ${{ steps.image-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /var/tmp/vpn2-image-cache
          key: ${{ steps.image.outputs.key }}

      - name: deploy
        run: sudo infra/tests/ci-stand.sh deploy-udp

      - name: udp-cut
        run: sudo infra/tests/ci-stand.sh udp-cut ${{ inputs.break_tcp_fallback && '--break-tcp-fallback' || '' }}

      - name: collect
        if: always()
        run: sudo infra/tests/ci-stand.sh collect stand-report && sudo chown -R "$USER" stand-report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: udp-cut-report
          path: stand-report/
          if-no-files-found: warn

      - name: down
        if: always()
        run: sudo infra/tests/ci-stand.sh down

      - name: apt cache save
        if: ${{ always() && steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /var/tmp/vpn2-apt-cache
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
