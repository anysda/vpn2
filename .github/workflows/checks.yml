name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S error
      - name: мёртвые переменные и функции
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -i SC2034,SC2317,SC2329
      - name: проверка загрузки AWS CLI
        run: python3 infra/tests/test_aws_cli.py
      - name: зависимости Debian и Ubuntu
        run: bash infra/tests/debian-compat.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: мастер на Python из Debian 12
        run: bash infra/tests/setup-compat.sh

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ruff
        run: git ls-files -z '*.py' | xargs -0 pipx run --spec ruff==0.13.3 ruff check --isolated --select E9,F,ARG,ERA
      - name: vulture
        run: git ls-files -z '*.py' | xargs -0 pipx run --spec vulture==2.14 vulture --min-confidence 0
      - name: config2env на config.example.yaml
        run: |
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          cp config.example.yaml "$d/config.yaml"
          sed -i 's/^  passphrase: ""/  passphrase: ci pass/' "$d/config.yaml"
          python3 infra/lib/config2env.py "$d"
          test -s "$d/infra/envs/all.env"

  infra:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sing-box: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: зависимости инфраструктуры
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq strongswan-pki libstrongswan-standard-plugins wireguard-tools openvpn apache2-utils nftables iptables iproute2 qrencode zbar-tools
          python3 -m pip install PyYAML==6.0.3
      - name: регрессии инфраструктуры без sing-box
        if: ${{ !matrix.sing-box }}
        run: python3 infra/tests/run_parallel.py
      - name: регрессии развёртывания и маршрутов sing-box
        if: matrix.sing-box
        run: |
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          version=$(sed -n "s/^readonly SB_VER='\([^']*\)'/\1/p" infra/lib/install-sing-box.sh)
          test -n "$version"
          curl -fsSL --retry 3 -o "$d/sing-box.tar.gz" \
            "https://github.com/SagerNet/sing-box/releases/download/v${version}/sing-box-${version}-linux-amd64.tar.gz"
          checksum=$(sed -n "s/^readonly SB_SHA256_AMD64='\([^']*\)'/\1/p" infra/lib/install-sing-box.sh)
          printf '%s  %s\n' "$checksum" "$d/sing-box.tar.gz" | sha256sum --check --status
          tar -xzf "$d/sing-box.tar.gz" -C "$d"
          export SING_BOX_BIN="$d/sing-box-${version}-linux-amd64/sing-box"
          export RUN_NETNS_TESTS=1
          "$SING_BOX_BIN" version
          python3 infra/tests/run_parallel.py

  telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: telegram/requirements.txt
      - name: регрессии Telegram-бота
        run: |
          python3 -m pip install -r telegram/requirements.txt
          python3 -m unittest discover -s telegram/tests -v

  # Сохраняем прежний общий статус python: он зелёный только после всех
  # наборов, в том числе обеих веток матрицы infra (важно для required checks).
  python:
    needs: [python-lint, infra, telegram]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: все проверки Python прошли
        env:
          LINT_RESULT: ${{ needs.python-lint.result }}
          INFRA_RESULT: ${{ needs.infra.result }}
          BOT_RESULT: ${{ needs.telegram.result }}
        run: test "$LINT_RESULT,$INFRA_RESULT,$BOT_RESULT" = success,success,success

  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SQLite WAL и полный цикл backup/restore
        run: |
          docker run --rm -e VPN2_BACKUP_TEST=1 -v "$PWD:/src:ro" debian:13 sh -ec '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends python3 sqlite3 age expect curl git wireguard-tools openssl
            python3 /src/infra/tests/backup-restore.py /src
            python3 /src/infra/tests/backup-clone-path.py /src
          '

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: статическая аварийная панель и инструкция
        run: pnpm emergency:build
      # Плагин nuxt в knip читает .vue через vue/compiler-sfc; под pnpm vue не
      # лежит в корне node_modules, без NODE_PATH knip молча считает все
      # компоненты и composables мёртвыми.
      - name: knip
        env:
          NODE_PATH: ${{ github.workspace }}/app/node_modules/.pnpm/node_modules
        run: |
          pnpm dlx knip@6.39.0
          pnpm dlx knip@6.39.0 --production --exclude dependencies,unlisted,binaries

  backup-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: перенос ключей VPN на чистый хост и совместимость старых архивов
        run: |
          docker build -t vpn2-backup-test infra/tests
          docker run --rm -v "$PWD:/repo:ro" vpn2-backup-test

  panel-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Job always exists (including required checks); only its work is skipped.
      - name: изменения зависимостей панели
        id: paths
        run: |
          selected=$(python3 ../infra/lib/e2e_paths.py --github)
          echo "run=$selected" >> "$GITHUB_OUTPUT"
      - name: e2e не требуется
        if: steps.paths.outputs.run == 'false'
        run: echo 'panel-e2e skipped — no panel dependencies changed'
      - uses: pnpm/action-setup@v4
        if: steps.paths.outputs.run == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.paths.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.paths.outputs.run == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.paths.outputs.run == 'true'
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - name: сборка панели один раз для всех шардов
        if: steps.paths.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: vpn2-panel:e2e
          cache-from: type=gha,scope=checks-panel
          cache-to: type=gha,mode=max,scope=checks-panel
      - name: загрузка браузерного образа
        if: steps.paths.outputs.run == 'true'
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          docker pull "mcr.microsoft.com/playwright:v${version}-noble"
      - name: сквозные тесты на собранном образе при смене сети хоста
        if: steps.paths.outputs.run == 'true'
        env:
          E2E_IP: sudo -n ip
          E2E_SKIP_BUILD: '1'
          E2E_SHARDS: '4'
        run: python3 e2e/with-network-churn.py pnpm e2e:local
      - name: отчёт и трейсы
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 14
