---
- name: Ресурсы юнита наблюдателя
  ansible.builtin.command:
    argv:
      - /bin/bash
      - --norc
      - -euo
      - pipefail
      - -c
      - 'source "$0/entry-resources.sh"; entry_unit_resources "$1"; echo "changed=$ENTRY_DROPIN_CHANGED"'
      - "{{ emergency_tmp }}"
      - vpn2-emergency
  environment: "{{ emergency_env }}"
  register: emergency_resources
  changed_when: "'changed=1' in emergency_resources.stdout"

- name: Наблюдатель включён
  ansible.builtin.systemd_service:
    name: vpn2-emergency.service
    enabled: true
    daemon_reload: "{{ emergency_unit is changed }}"

# Перезапуск только при смене входов службы: пакета, юнита с его drop-in,
# состава аварийки. Идущую аварию повторный деплой без правок не трогает.
- name: Наблюдатель идёт с текущими входами
  ansible.builtin.command:
    argv: "{{ emergency_bash + [emergency_restart_step, emergency_tmp, 'vpn2-emergency', emergency_package_mark, emergency_etc ~ '/agent.json'] }}"
  environment: "{{ emergency_env }}"
  register: emergency_agent_run
  changed_when: "'changed=1' in emergency_agent_run.stdout"

# Entry заранее передаёт экзитам список клиентов.
- name: Передача списка клиентов
  when: emergency_entry
  block:
    - name: Юнит передачи списка клиентов
      ansible.builtin.template:
        src: vpn2-emergency-snapshot.service.j2
        dest: "{{ emergency_units }}/vpn2-emergency-snapshot.service"
        mode: '0644'
      register: emergency_snapshot_unit

    - name: Ресурсы юнита передачи
      ansible.builtin.command:
        argv:
          - /bin/bash
          - --norc
          - -euo
          - pipefail
          - -c
          - 'source "$0/entry-resources.sh"; entry_unit_resources "$1"; echo "changed=$ENTRY_DROPIN_CHANGED"'
          - "{{ emergency_tmp }}"
          - vpn2-emergency-snapshot
      environment: "{{ emergency_env }}"
      register: emergency_snapshot_resources
      changed_when: "'changed=1' in emergency_snapshot_resources.stdout"

    - name: Передача включена
      ansible.builtin.systemd_service:
        name: vpn2-emergency-snapshot.service
        enabled: true
        daemon_reload: "{{ emergency_snapshot_unit is changed }}"

    - name: Передача идёт с текущими входами
      ansible.builtin.command:
        argv: "{{ emergency_bash + [emergency_restart_step, emergency_tmp, 'vpn2-emergency-snapshot', emergency_package_mark] }}"
      environment: "{{ emergency_env }}"
      register: emergency_snapshot_run
      changed_when: "'changed=1' in emergency_snapshot_run.stdout"

# Копии пакета прежних выпусков рядом с аварийкой: службы уже идут из venv.
- name: Копии пакета прежних выпусков убраны
  ansible.builtin.file:
    path: "{{ emergency_home }}/{{ item }}"
    state: absent
  loop: [vpn2, vpn2_emergency]

# Docker нужен экзиту только на время деплоя, дальше его поднимает docker.socket
# по запросу. Службу запустил шаг статики этого же прогона, поэтому её
# остановка изменением не считается.
- name: Docker экзита остановлен до следующего деплоя
  ansible.builtin.command:
    argv: "{{ emergency_bash + [emergency_docker_idle] }}"
  vars:
    emergency_docker_idle: |
      systemctl disable --now docker.service containerd.service >/dev/null 2>&1
      systemctl enable --now docker.socket >/dev/null 2>&1
  when: not emergency_entry
  changed_when: false

# Слово image говорит проверке узла, что здесь ждут release.json и запасной
# Hysteria2; пустую отметку оставляла стадия до образа.
- name: Отметка стадии
  ansible.builtin.copy:
    content: "image {{ emergency_image }}\n"
    dest: /var/anysda/.stamps/23-emergency
    mode: '0644'
