name: stand

# Деплой dev на стенд из двух ВМ внутри раннера и 99-verify с настоящим
# трафиком WireGuard/OpenVPN/IKEv2; рядом на своём стенде - обрыв UDP
# entry → экзит. Две задачи идут параллельно, прогон - до 5 минут.
# Запускается на dev и вручную, не на каждый PR.
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      stop_openvpn:
        description: 'Отрицательный контроль: остановить OpenVPN на entry перед проверкой'
        type: boolean
        default: false
      break_tcp_fallback:
        description: 'Отрицательный контроль: при обрыве UDP резать и запасной TCP до экзита'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stand-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: стенд развёртывание
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Пакеты ВМ - через прокси apt на раннере; его каталог живёт между ранами.
      # До up: прокси поднимается до запуска ВМ, их прогрев идёт через него.
      - name: apt cache
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: /var/tmp/vpn2-apt-cache
          key: stand-apt-${{ hashFiles('deploy.sh', 'infra/scripts/*.sh', 'infra/lib/*.sh') }}
          restore-keys: stand-apt-

      # ВМ грузятся, пока собирается образ панели.
      - name: up (фоном)
        run: sudo infra/tools/ci-stand.sh up-bg

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      # Панель из этого же коммита. Кэш gha ветке виден только свой и main,
      # поэтому dev - через реестр (пишет images.yml): первая сборка ветки тёплая.
      - name: panel image
        uses: docker/build-push-action@v7
        with:
          context: app
          platforms: linux/amd64
          load: true
          tags: vpn2-stand/panel:${{ github.sha }}
          cache-from: |
            type=gha,scope=panel-stand
            type=gha,scope=checks-panel
            type=registry,ref=ghcr.io/${{ github.repository }}/panel:buildcache-dev
            type=gha,scope=panel
          cache-to: type=gha,mode=max,scope=panel-stand

      - name: up
        id: up
        run: sudo infra/tools/ci-stand.sh up-wait

      # Полный деплой сам кончается 99-verify всех узлов.
      - name: deploy
        run: sudo infra/tools/ci-stand.sh deploy vpn2-stand/panel:${{ github.sha }}

      # Отрицательный контроль: 99-verify при остановленном OpenVPN обязан упасть.
      - name: verify
        if: ${{ inputs.stop_openvpn && !cancelled() && steps.up.outcome == 'success' }}
        run: sudo infra/tools/ci-stand.sh verify --stop-openvpn

      - name: collect
        if: always()
        run: sudo infra/tools/ci-stand.sh collect stand-report && sudo chown -R "$USER" stand-report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-report
          path: stand-report/
          if-no-files-found: warn

      - name: down
        if: always()
        run: sudo infra/tools/ci-stand.sh down

      - name: apt cache save
        if: ${{ always() && steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /var/tmp/vpn2-apt-cache
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

  # Обрыв UDP entry → экзит: трафик уходит на запасной TCP без перезапуска
  # sing-box и возвращается на Hysteria2. Стенд только из нужных стадий.
  udp-cut:
    name: стенд обрыв UDP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Пакеты ВМ - через прокси apt на раннере; его каталог живёт между ранами.
      - name: apt cache
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: /var/tmp/vpn2-apt-cache
          key: stand-apt-${{ hashFiles('deploy.sh', 'infra/scripts/*.sh', 'infra/lib/*.sh') }}
          restore-keys: stand-apt-

      - name: up
        id: up
        run: sudo infra/tools/ci-stand.sh up

      - name: deploy
        run: sudo infra/tools/ci-stand.sh deploy-udp

      - name: udp-cut
        run: sudo infra/tools/ci-stand.sh udp-cut ${{ inputs.break_tcp_fallback && '--break-tcp-fallback' || '' }}

      - name: collect
        if: always()
        run: sudo infra/tools/ci-stand.sh collect stand-report && sudo chown -R "$USER" stand-report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: udp-cut-report
          path: stand-report/
          if-no-files-found: warn

      - name: down
        if: always()
        run: sudo infra/tools/ci-stand.sh down

      - name: apt cache save
        if: ${{ always() && steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /var/tmp/vpn2-apt-cache
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
