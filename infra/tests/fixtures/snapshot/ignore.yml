# Поля слепка хоста, которые законно различаются между двумя чистыми установками.
# Запись: section, name (маска fnmatch, * проходит через /), field (имя поля или "*"), reason.
# Наличие, права и владелец файла сверяются всегда, если field не "*".
# Правило, не закрывшее ни одной записи, сверка печатает предупреждением - его пора убрать.

# Секреты и ключи, которые установка создаёт случайными
- {section: files, name: '/etc/anysda/*-password.txt', field: sha256, reason: случайный пароль создаётся при установке}
- {section: files, name: '/etc/anysda/*-secret.txt', field: sha256, reason: случайный секрет создаётся при установке}
- {section: files, name: '/etc/anysda/hy2-*', field: sha256, reason: пароли и сертификат Hysteria2 создаются при установке}
- {section: files, name: '/etc/anysda/reality.*', field: sha256, reason: ключи Reality создаются при установке}
- {section: files, name: '/etc/anysda/wgcf-*', field: sha256, reason: учётная запись WARP регистрируется при установке}
- {section: files, name: '/etc/openvpn/server/pki/*', field: sha256, reason: удостоверяющий центр OpenVPN создаётся при установке}
- {section: files, name: '/etc/strongswan/pki/*', field: sha256, reason: удостоверяющий центр IKEv2 создаётся при установке}
- {section: files, name: '/etc/swanctl/private/*', field: sha256, reason: ключ сервера IKEv2 создаётся при установке}
- {section: files, name: '/etc/swanctl/x509*/*', field: sha256, reason: сертификаты IKEv2 создаются при установке}
- {section: files, name: '/etc/wireguard/keys/*', field: sha256, reason: ключи WireGuard создаются при установке}
- {section: files, name: '/etc/sing-box/tls.*', field: sha256, reason: самоподписанный сертификат экзита создаётся при установке}
- {section: files, name: '/etc/sing-box/exit-certs/*', field: sha256, reason: сертификат и ключ Reality экзита создаются при установке}
- {section: files, name: '/etc/shadow*', field: sha256, reason: соль хэша пароля root случайная}
- {section: files, name: '/etc/vpn2/emergency/agent.json', field: sha256, reason: ключи аварийного канала создаются при установке}
- {section: files, name: '/var/lib/vpn2-emergency*/*', field: sha256, reason: ключи и состояние аварийного канала создаются при установке}
- {section: files, name: '/opt/anysda-vpn2/config.yaml', field: sha256, reason: установка дописывает в конфиг созданный ключ оркестратора; остальное сверяет shape}
- {section: files, name: '/var/lib/anysda-vpn2/state/known_hosts', field: sha256, reason: ключи узлов стенда случайные}
- {section: files, name: '/opt/anysda-vpn2/infra/envs/*.env', field: sha256, reason: окружение узла содержит созданные секреты; остальное сверяет shape}
- {section: files, name: '/opt/anysda-vpn2/infra/secrets/*', field: sha256, reason: каталог созданных при установке секретов}
- {section: files, name: /opt/vpn2-emergency/release.json, field: sha256, reason: запись выпуска аварийки с digest её образа - он свой у каждой сборки}
- {section: files, name: /var/anysda/.stamps/23-emergency, field: sha256, reason: отметка стадии аварийки хранит digest её образа - он свой у каждой сборки}
- {section: files, name: '/opt/anysda-vpn2/infra/secrets/rendered/nl.env', field: '*', reason: окружение скриптовой стадии экзита - таких стадий больше нет; после обновления с выпуска файл остаётся от прежнего деплоя}
- {section: files, name: '/opt/anysda-vpn2/infra/secrets/rendered/ru.env', field: '*', reason: окружение скриптовой стадии entry - таких стадий больше нет; после обновления с выпуска файл остаётся от прежнего деплоя}

# Конфиги, в которые вписаны созданные секреты
- {section: files, name: '/etc/vpn2/compose/compose.yaml', field: sha256, reason: окружение служб содержит созданные секреты и digest образов сборки}
- {section: files, name: '/etc/anysda/anysda-config.yaml', field: sha256, reason: содержит созданные пароли и ключи; остальное сверяет shape}
- {section: files, name: '/etc/anysda/failover-watchdog.env', field: sha256, reason: содержит созданный секрет Clash API; остальное сверяет shape}
- {section: files, name: '/etc/sing-box/config*.json', field: sha256, reason: содержит созданные ключи и пароли; остальное сверяет shape}
- {section: files, name: '/etc/wireguard/wg0.conf', field: sha256, reason: содержит созданный приватный ключ; остальное сверяет shape}
- {section: files, name: '/var/lib/anysda/applied/*.sha256', field: sha256, reason: хэш применённого конфига с секретами}
- {section: files, name: '/var/lib/vpn2-apply/*.good', field: sha256, reason: копия применённого конфига с секретами; остальное сверяет shape}

- {section: files, name: '/opt/AdGuardHome*/AdGuardHome.yaml', field: sha256, reason: содержит хэш пароля со случайной солью; остальное сверяет shape}

# Номера пользователей и образ системы - не продукт
- {section: files, name: '/etc/passwd*', field: sha256, reason: номера пользователей выдаёт счётчик системы; имена с домом и оболочкой сверяет shape}
- {section: files, name: '/etc/group*', field: sha256, reason: номера групп выдаёт счётчик системы; имена и состав сверяет shape}
- {section: files, name: '/etc/vpn2-control/callers.json', field: sha256, reason: uid вызывающих зависят от счётчика системы; имена сверяет shape}
- {section: files, name: '/etc/ssl/certs/*', field: '*', reason: набор корневых сертификатов меняет обновление ca-certificates образа}
- {section: files, name: '/etc/ld.so.cache', field: sha256, reason: кэш линковщика пересобирает любое обновление пакетов образа}

# Состояние, которое службы пишут во время работы
- {section: files, name: '/etc/openvpn/server/status-server.log', field: sha256, reason: OpenVPN переписывает файл статуса каждую минуту}
- {section: files, name: '/etc/anysda/ikev2-status.json', field: sha256, reason: статус IKEv2 с меткой времени}
- {section: files, name: '/etc/vpn2/tls/state.json', field: sha256, reason: состояние сертификата с датой выпуска}
- {section: files, name: '/var/lib/anysda/verify-report.json', field: sha256, reason: отчёт verify с меткой времени; его строки сверяет раздел verify}
- {section: files, name: '/var/lib/anysda-failover-watchdog/lanes.json', field: sha256, reason: замеры линий сторожа с меткой времени}
- {section: files, name: '/var/lib/anysda-failover-watchdog/restart.json', field: sha256, reason: время последнего перезапуска sing-box сторожем}
- {section: files, name: '/var/lib/anysda-*/state.json', field: sha256, reason: состояние сторожа с меткой времени переписывает его таймер - WARP и YouTube}
- {section: files, name: '/var/lib/anysda-vpn2/db.sqlite-*', field: sha256, reason: журнал записи SQLite работающей панели}
- {section: files, name: '/var/lib/vpn2-deploy/operation.json', field: sha256, reason: журнал операции деплоя с меткой времени}
- {section: files, name: '/var/lib/vpn2-deploy/panel/operation.json', field: sha256, reason: журнал операции панели с меткой времени}
- {section: files, name: '/var/lib/vpn2-deploy/backups/*', field: '*', reason: каталог копии назван меткой времени в наносекундах - он и его содержимое каждый раз новые}
- {section: files, name: '/var/lib/vpn2-deploy/panel/backups/*', field: '*', reason: каталог копии назван меткой времени в наносекундах - он и его содержимое каждый раз новые}

# Не файлы
- {section: ports, name: 'udp *:3[2-9][0-9][0-9][0-9] sing-box', field: '*', reason: исходящий UDP-сокет sing-box на случайном порту ядра 32768-60999}
- {section: ports, name: 'udp *:[45][0-9][0-9][0-9][0-9] sing-box', field: '*', reason: исходящий UDP-сокет sing-box на случайном порту ядра 32768-60999}
- {section: ports, name: 'udp *:60[0-9][0-9][0-9] sing-box', field: '*', reason: исходящий UDP-сокет sing-box на случайном порту ядра 32768-60999}
- {section: ports, name: 'udp *:3[2-9][0-9][0-9][0-9] systemd-timesyn', field: '*', reason: исходящий UDP-сокет опроса NTP на случайном порту ядра 32768-60999}
- {section: ports, name: 'udp *:[45][0-9][0-9][0-9][0-9] systemd-timesyn', field: '*', reason: исходящий UDP-сокет опроса NTP на случайном порту ядра 32768-60999}
- {section: ports, name: 'udp *:60[0-9][0-9][0-9] systemd-timesyn', field: '*', reason: исходящий UDP-сокет опроса NTP на случайном порту ядра 32768-60999}
- {section: units, name: 'var-lib-docker-rootfs-overlayfs-*.mount', field: '*', reason: точка монтирования контейнера с его случайным идентификатором}
- {section: units, name: 'vpn2-ci-warm.service', field: '*', reason: разовый юнит прогрева стенда CI - не продукт}
- {section: units, name: 'systemd-fsckd.service', field: '*', reason: служба проверки дисков при загрузке - systemd выгружает её через полминуты простоя}
- {section: containers, name: 'anysda-vpn2', field: image, reason: образ панели собирается из исходников коммита}
- {section: containers, name: 'anysda-vpn2', field: image_id, reason: образ панели собирается из исходников коммита}
- {section: containers, name: 'anysda-tgbot', field: image, reason: образ бота собирается из исходников коммита}
- {section: containers, name: 'anysda-tgbot', field: image_id, reason: образ бота собирается из исходников коммита}
- {section: containers, name: 'vpn2-emergency', field: image, reason: образ аварийного канала собирается из исходников коммита}
- {section: containers, name: 'vpn2-emergency', field: image_id, reason: образ аварийного канала собирается из исходников коммита}
