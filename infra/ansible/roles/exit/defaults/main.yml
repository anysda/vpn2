---
exit_infra: "{{ lookup('ansible.builtin.env', 'VPN2_INFRA') }}"
exit_tmp: /tmp/anysda
exit_manifest: "{{ lookup('ansible.builtin.env', 'VPN2_RELEASE_MANIFEST') | default('/tmp/anysda/release-manifest.json', true) }}"
exit_development: "{{ lookup('ansible.builtin.env', 'VPN2_DEVELOPMENT') == 'true' }}"
exit_wheel: "{{ lookup('ansible.builtin.env', 'VPN2_WHEEL') }}"

# Шаги узла идут системным python прямо из колеса этого деплоя: venv экзита
# обновляет только первая стадия, а эту запускают и отдельно.
exit_host:
  - /usr/bin/env
  - "PYTHONPATH={{ exit_tmp }}/{{ exit_wheel | basename }}"
  - /usr/bin/python3
  - -B
  - -m
  - vpn2.cli.host

# Библиотеки и шаблон, которые шаги роли читают на узле из exit_tmp.
exit_libs:
  - "{{ exit_infra }}/lib/entry-resources.sh"
  - "{{ exit_infra }}/lib/entry_resources.py"
  - "{{ exit_infra }}/lib/release.py"
  - "{{ exit_infra }}/lib/install-sing-box.sh"
  - "{{ exit_infra }}/lib/warp-watchdog.py"
  - "{{ exit_infra }}/configs/sing-box-server.json.tpl"
  - "{{ exit_wheel }}"

# Окружение узла из config.yaml: его читают шаги пакета vpn2.
exit_env:
  HOST_TAG: "{{ inventory_hostname }}"
  PUB_IP: "{{ lookup('ansible.builtin.env', 'PUB_IP') }}"
  HY2_DIRECT_PORT: "{{ lookup('ansible.builtin.env', 'HY2_DIRECT_PORT') }}"
  HY2_WARP_PORT: "{{ lookup('ansible.builtin.env', 'HY2_WARP_PORT') }}"
  HY2_MGMT_PORT: "{{ lookup('ansible.builtin.env', 'HY2_MGMT_PORT') }}"
  HY2_UP_MBPS: "{{ lookup('ansible.builtin.env', 'HY2_UP_MBPS') }}"
  HY2_DOWN_MBPS: "{{ lookup('ansible.builtin.env', 'HY2_DOWN_MBPS') }}"
  REALITY_SNI: "{{ lookup('ansible.builtin.env', 'REALITY_SNI') }}"
  REALITY_PORT: "{{ lookup('ansible.builtin.env', 'REALITY_PORT') }}"
  HY2_HOP_ENABLED: "{{ lookup('ansible.builtin.env', 'HY2_HOP_ENABLED') }}"
  HY2_HOP_DIRECT: "{{ lookup('ansible.builtin.env', 'HY2_HOP_DIRECT') }}"
  HY2_HOP_WARP: "{{ lookup('ansible.builtin.env', 'HY2_HOP_WARP') }}"
  HY2_HOP_MGMT: "{{ lookup('ansible.builtin.env', 'HY2_HOP_MGMT') }}"

exit_wgcf_version: '2.3.1'
# Версию wgcf не печатает (ни `version`, ни `--version`): сверка по sha256 релиза.
exit_wgcf_sha256: 4fb7a136aa470ece11d17949c7db07b040ec9c604742dc8680bcf1889f85d0c8
exit_wgcf_url: >-
  https://github.com/ViRb3/wgcf/releases/download/v{{ exit_wgcf_version }}/wgcf_{{ exit_wgcf_version }}_linux_amd64

# Без ports.hy2_hop в config.yaml окружение диапазонов не несёт: умолчания те
# же, что в пакете vpn2 (exitnode.HOP_DEFAULTS) и на стороне entry.
exit_hop_enabled: "{{ lookup('ansible.builtin.env', 'HY2_HOP_ENABLED') | default('1', true) == '1' }}"
exit_hop_direct: "{{ lookup('ansible.builtin.env', 'HY2_HOP_DIRECT') | default('20000-24999', true) }}"
exit_hop_warp: "{{ lookup('ansible.builtin.env', 'HY2_HOP_WARP') | default('25000-29999', true) }}"
exit_hop_mgmt: "{{ lookup('ansible.builtin.env', 'HY2_HOP_MGMT') | default('30000-30999', true) }}"
exit_reality_port: "{{ lookup('ansible.builtin.env', 'REALITY_PORT') | default('4443', true) }}"

# Порты hy2 открывает и роль base; здесь - порты своего экзита из config.yaml.
# clash-api слушает 127.0.0.1 и наружу не открывается. Пустая группа снимает
# правила отключённой смены портов.
exit_ufw:
  - {comment: hysteria2 direct, rules: ["{{ lookup('ansible.builtin.env', 'HY2_DIRECT_PORT') }}/udp"]}
  - {comment: hysteria2 warp, rules: ["{{ lookup('ansible.builtin.env', 'HY2_WARP_PORT') }}/udp"]}
  - comment: hysteria2 mgmt
    aliases: [hysteria2 mgmt (monitoring)]
    rules: ["{{ lookup('ansible.builtin.env', 'HY2_MGMT_PORT') }}/udp"]
  - {comment: vless reality, rules: ["{{ exit_reality_port }}/tcp"]}
  - comment: hysteria2 hop direct
    rules: "{{ [exit_hop_direct | replace('-', ':') ~ '/udp'] if exit_hop_enabled else [] }}"
  - comment: hysteria2 hop warp
    rules: "{{ [exit_hop_warp | replace('-', ':') ~ '/udp'] if exit_hop_enabled else [] }}"
  - comment: hysteria2 hop mgmt
    rules: "{{ [exit_hop_mgmt | replace('-', ':') ~ '/udp'] if exit_hop_enabled else [] }}"

# Отпечаток sing-box: бинарник, юнит, конфиг, TLS и sysctl (буферы сокетов).
exit_sing_box_inputs:
  - /usr/local/bin/sing-box
  - /etc/systemd/system/sing-box.service
  - /etc/sing-box/config.json
  - /etc/sing-box/tls.crt
  - /etc/sing-box/tls.key
  - /etc/sysctl.d/99-anysda.conf
