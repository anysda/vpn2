---
# Хост панели: Caddy перед контейнером и таймер, который выгружает сертификат
# и следит за его сроком. Caddyfile и запуск таймера ведёт шаг службы.
- name: Caddy закреплённой версии
  ansible.builtin.command:
    argv: "{{ containers_bash + [containers_caddy_step, containers_tmp] }}"
  environment: "{{ containers_env }}"
  vars:
    containers_caddy_step: |
      source "$0/anysda-svc.sh"
      before=$(caddy version 2>/dev/null || true)
      caddy_install
      [[ "$(caddy version)" == "$before" ]] || echo changed=1
  register: containers_caddy
  changed_when: "'changed=1' in containers_caddy.stdout"

- name: Каталог библиотеки TLS
  ansible.builtin.file:
    path: "{{ containers_tls_lib | dirname }}"
    state: directory
    mode: '0755'

- name: Библиотека TLS
  ansible.builtin.copy:
    src: "{{ containers_infra }}/lib/vpn2_tls.py"
    dest: "{{ containers_tls_lib }}"
    mode: '0755'

- name: Юниты срока сертификата
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ containers_units }}/{{ item }}"
    mode: '0644'
  loop: [vpn2-tls.service, vpn2-tls.timer]
  register: containers_tls_units

- name: Ресурсы юнита срока сертификата
  ansible.builtin.command:
    argv:
      - /bin/bash
      - --norc
      - -euo
      - pipefail
      - -c
      - 'source "$0/entry-resources.sh"; entry_unit_resources "$1"; echo "changed=$ENTRY_DROPIN_CHANGED"'
      - "{{ containers_tmp }}"
      - vpn2-tls
  environment:
    ENTRY_RESOURCE_OVERRIDES: "{{ lookup('ansible.builtin.env', 'ENTRY_RESOURCE_OVERRIDES') }}"
  register: containers_tls_resources
  changed_when: "'changed=1' in containers_tls_resources.stdout"

- name: Юниты перечитаны  # noqa: no-handler
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: containers_tls_units is changed or containers_tls_resources is changed
