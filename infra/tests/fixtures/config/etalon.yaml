# Шаблон стенда CI: метки @...@ подставляет ci-stand.sh, пароль бэкапа тестовый.
entry:
  host: @ENTRY_HOST@
exits:
  - tag: @EXIT_TAG@
    host: root@@EXIT_HOST@
admin:
  user: anysda
  ssh_pubkey: "@ADMIN_KEY@"
panel:
  image: @PANEL_IMAGE@
backup:
  enabled: true
  backend: local
  passphrase: "stand-etalon"
  retention: 10
  schedule: off
  local:
    dir: /var/backups/anysda-vpn2
secrets:
  admin_password: "@ADMIN_PASSWORD@"
