---
# IKEv2/IPsec на strongSwan (swanctl): сервер по сертификату, клиент по EAP-MSCHAPv2.
# Учётные записи устройств - /etc/swanctl/conf.d/anysda-clients.conf панели, трафик через xfrm0 в TPROXY.
- name: Пакеты strongSwan
  ansible.builtin.apt:
    name: "{{ ikev2_packages }}"
    state: present
    lock_timeout: 1200
  register: ikev2_apt
  until: ikev2_apt is succeeded
  retries: 3
  delay: 10

# Второй charon рядом со starter дрался бы за 500/4500.
- name: Пакета charon-systemd нет
  ansible.builtin.apt:
    name: charon-systemd
    state: absent
    purge: true
    lock_timeout: 1200

# le-sync кладёт leaf Caddy в x509, цепочку в x509ca; start-scripts грузят swanctl при старте charon.
- name: Раскладка сертификата Caddy, загрузка swanctl при старте и счётчики
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - {src: anysda-ikev2-le-sync.sh, dest: /usr/local/sbin/anysda-ikev2-le-sync.sh, mode: '0755'}
    - {src: anysda-swanctl-load.conf, dest: /etc/strongswan.d/anysda-swanctl-load.conf}
    - {src: anysda-ikev2-sync.py, dest: /usr/local/sbin/anysda-ikev2-sync.py, mode: '0755'}
    - {src: anysda-ikev2-sync.service, dest: /etc/systemd/system/anysda-ikev2-sync.service}
    - {src: anysda-ikev2-sync.timer, dest: /etc/systemd/system/anysda-ikev2-sync.timer}
    - {src: anysda-ikev2-cert-sync.timer, dest: /etc/systemd/system/anysda-ikev2-cert-sync.timer}

- name: Служба strongswan-starter включена
  ansible.builtin.systemd_service:
    name: strongswan-starter
    enabled: true

- name: Ресурсы charon и счётчиков
  ansible.builtin.include_role:
    name: resources
  vars:
    resources_units: [strongswan-starter, anysda-ikev2-sync]

# Режим, сертификаты, конфиг, рестарт charon при смене входов, загрузка creds/pools/conns - под замком.
- name: Сертификаты, конфиг swanctl и загрузка в charon
  ansible.builtin.command:
    argv: >-
      {{ ikev2_host + ['ikev2-server', '--entry-host', ikev2_entry_host, '--public-host', ikev2_public_host,
         '--panel-domain', ikev2_panel_domain, '--subnet', ikev2_subnet, '--dns', ikev2_dns] }}
  environment: "{{ ikev2_env }}"
  register: ikev2_step
  changed_when: "'vpn2: changed' in ikev2_step.stdout"

- name: Порты IKE и DNS клиентов в ufw
  ansible.builtin.command:
    argv: "{{ ikev2_host + ['ufw', '--only-rules', ikev2_ufw | to_json] }}"
  environment: "{{ ikev2_env }}"
  register: ikev2_step
  changed_when: "'vpn2: changed' in ikev2_step.stdout"

# Loose RPF: policy-routing IPsec иначе режется reverse-path filter.
- name: Пересылка пакетов и мягкий rp_filter
  ansible.builtin.command:
    argv: [sysctl, -w, net.ipv4.ip_forward=1, net.ipv4.conf.all.rp_filter=2, net.ipv4.conf.default.rp_filter=2]
  changed_when: false

- name: Внешний интерфейс по маршруту по умолчанию
  ansible.builtin.command:
    cmd: ip -4 -o route show default
  register: ikev2_route
  changed_when: false
  failed_when: "' dev ' not in ikev2_route.stdout"

- name: Маршрутизация xfrm0
  ansible.builtin.include_role:
    name: wireguard
    tasks_from: routing
  vars:
    wireguard_routing: {unit: anysda-ikev2-routing, iface: xfrm0, chain: ANYSDA_IKEV2_TPROXY, mss: 1360,
                        after: strongswan-starter.service, routes: "{{ ikev2_subnets }}", v6_reject: true,
                        xfrm_dev: "{{ ikev2_route.stdout.split(' dev ')[1].split()[0] }}", subnet6: "{{ ikev2_subnet6 }}"}

- name: Таймер счётчиков IKEv2 включён
  ansible.builtin.systemd_service:
    name: anysda-ikev2-sync.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Первый проход счётчиков IKEv2
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: systemctl start anysda-ikev2-sync.service
  changed_when: false
  failed_when: false

# Домен, для которого ждём сертификат Caddy, шаг сервера записал в отметку.
- name: Домен сертификата Caddy
  ansible.builtin.slurp:
    src: /etc/anysda/ikev2-domain
  register: ikev2_domain

# Путь-юнит ставится и до появления каталога Caddy; таймер страхует пропущенные события и отказ charon.
- name: Слежение за сертификатом Caddy
  when: ikev2_le_domain | length > 0
  vars:
    ikev2_le_cert: "{{ ikev2_caddy_certs }}/{{ ikev2_le_domain }}/{{ ikev2_le_domain }}.crt"
    ikev2_le_key: "{{ ikev2_caddy_certs }}/{{ ikev2_le_domain }}/{{ ikev2_le_domain }}.key"
  block:
    - name: Ресурсы anysda-ikev2-cert-sync
      ansible.builtin.include_role:
        name: resources
      vars:
        resources_units: [anysda-ikev2-cert-sync]

    - name: Юниты anysda-ikev2-cert-sync
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: '0644'
      loop: [anysda-ikev2-cert-sync.service, anysda-ikev2-cert-sync.path]

    - name: Слежение и таймер включены
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop: [anysda-ikev2-cert-sync.path, anysda-ikev2-cert-sync.timer]

- name: Без домена слежение за сертификатом выключено
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: systemctl disable --now anysda-ikev2-cert-sync.path anysda-ikev2-cert-sync.timer
  changed_when: false
  failed_when: false
  when: ikev2_le_domain | length == 0

- name: Без домена отпечаток применённого сертификата Caddy убран
  ansible.builtin.file:
    path: /etc/anysda/ikev2-cert.sha256
    state: absent
  when: ikev2_le_domain | length == 0
