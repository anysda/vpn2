---
exit_infra: "{{ vpn2_env.VPN2_INFRA | default('') }}"
exit_tmp: /tmp/anysda
exit_manifest: "{{ vpn2_env.VPN2_RELEASE_MANIFEST | default('/tmp/anysda/release-manifest.json', true) }}"
exit_development: "{{ vpn2_env.VPN2_DEVELOPMENT | default('') == 'true' }}"
exit_wheel: "{{ vpn2_env.VPN2_WHEEL | default('') }}"

# Шаги узла идут системным python прямо из колеса этого деплоя: venv экзита
# обновляет только первая стадия, а эту запускают и отдельно.
exit_host:
  - /usr/bin/env
  - "PYTHONPATH={{ exit_tmp }}/{{ exit_wheel | basename }}"
  - /usr/bin/python3
  - -B
  - -m
  - vpn2.cli.host

# Библиотеки и шаблон, которые шаги роли читают на узле из exit_tmp.
exit_libs:
  - "{{ exit_infra }}/lib/entry-resources.sh"
  - "{{ exit_infra }}/lib/entry_resources.py"
  - "{{ exit_infra }}/lib/install-sing-box.sh"
  - "{{ exit_infra }}/configs/sing-box-server.json.tpl"
  - "{{ exit_wheel }}"

# Окружение узла из config.yaml: его читают шаги пакета vpn2.
exit_env:
  HOST_TAG: "{{ inventory_hostname }}"
  PUB_IP: "{{ vpn2_env.PUB_IP | default('') }}"
  HY2_DIRECT_PORT: "{{ vpn2_env.HY2_DIRECT_PORT | default('') }}"
  HY2_WARP_PORT: "{{ vpn2_env.HY2_WARP_PORT | default('') }}"
  HY2_MGMT_PORT: "{{ vpn2_env.HY2_MGMT_PORT | default('') }}"
  HY2_UP_MBPS: "{{ vpn2_env.HY2_UP_MBPS | default('') }}"
  HY2_DOWN_MBPS: "{{ vpn2_env.HY2_DOWN_MBPS | default('') }}"
  REALITY_SNI: "{{ vpn2_env.REALITY_SNI | default('') }}"
  REALITY_PORT: "{{ vpn2_env.REALITY_PORT | default('') }}"
  HY2_HOP_ENABLED: "{{ vpn2_env.HY2_HOP_ENABLED | default('') }}"
  HY2_HOP_DIRECT: "{{ vpn2_env.HY2_HOP_DIRECT | default('') }}"
  HY2_HOP_WARP: "{{ vpn2_env.HY2_HOP_WARP | default('') }}"
  HY2_HOP_MGMT: "{{ vpn2_env.HY2_HOP_MGMT | default('') }}"

# Сторож WARP живёт в пакете vpn2: venv экзита ставит первая стадия.
exit_vpn2: /opt/vpn2/venv/bin/vpn2

exit_wgcf_version: '2.3.1'
# Версию wgcf не печатает (ни `version`, ни `--version`): сверка по sha256 релиза.
exit_wgcf_sha256: 4fb7a136aa470ece11d17949c7db07b040ec9c604742dc8680bcf1889f85d0c8
exit_wgcf_url: >-
  https://github.com/ViRb3/wgcf/releases/download/v{{ exit_wgcf_version }}/wgcf_{{ exit_wgcf_version }}_linux_amd64

# Без ports.hy2_hop в config.yaml окружение диапазонов не несёт: умолчания те
# же, что в пакете vpn2 (exitnode.HOP_DEFAULTS) и на стороне entry.
exit_hop_enabled: "{{ vpn2_env.HY2_HOP_ENABLED | default('1', true) == '1' }}"
exit_hop_direct: "{{ vpn2_env.HY2_HOP_DIRECT | default('20000-24999', true) }}"
exit_hop_warp: "{{ vpn2_env.HY2_HOP_WARP | default('25000-29999', true) }}"
exit_hop_mgmt: "{{ vpn2_env.HY2_HOP_MGMT | default('30000-30999', true) }}"
exit_reality_port: "{{ vpn2_env.REALITY_PORT | default('4443', true) }}"

# Порты hy2 открывает и роль base; здесь - порты своего экзита из config.yaml.
# clash-api слушает 127.0.0.1 и наружу не открывается. Пустая группа снимает
# правила отключённой смены портов.
exit_ufw:
  - {comment: hysteria2 direct, rules: ["{{ vpn2_env.HY2_DIRECT_PORT | default('') }}/udp"]}
  - {comment: hysteria2 warp, rules: ["{{ vpn2_env.HY2_WARP_PORT | default('') }}/udp"]}
  - comment: hysteria2 mgmt
    aliases: [hysteria2 mgmt (monitoring)]
    rules: ["{{ vpn2_env.HY2_MGMT_PORT | default('') }}/udp"]
  - {comment: vless reality, rules: ["{{ exit_reality_port }}/tcp"]}
  - comment: hysteria2 hop direct
    rules: "{{ [exit_hop_direct | replace('-', ':') ~ '/udp'] if exit_hop_enabled else [] }}"
  - comment: hysteria2 hop warp
    rules: "{{ [exit_hop_warp | replace('-', ':') ~ '/udp'] if exit_hop_enabled else [] }}"
  - comment: hysteria2 hop mgmt
    rules: "{{ [exit_hop_mgmt | replace('-', ':') ~ '/udp'] if exit_hop_enabled else [] }}"

# Отпечаток sing-box: бинарник, юнит, конфиг, TLS и sysctl (буферы сокетов).
exit_sing_box_inputs:
  - /usr/local/bin/sing-box
  - /etc/systemd/system/sing-box.service
  - /etc/sing-box/config.json
  - /etc/sing-box/tls.crt
  - /etc/sing-box/tls.key
  - /etc/sysctl.d/99-anysda.conf
