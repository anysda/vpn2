---
# sing-box на entry: трафик клиентов, заведённый в TPROXY :7898, расходится по
# наборам geoip/geosite в туннели Hysteria2 до экзитов.
- name: Каталоги роутера
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - {path: /etc/anysda}
    - {path: /etc/sing-box}
    - {path: /var/lib/sing-box}
    - {path: "{{ router_rule_set_dir }}"}
    - {path: "{{ router_tmp }}/router"}
    - {path: "{{ router_certs }}", mode: '0700'}

- name: Установщик sing-box
  ansible.builtin.copy:
    src: "{{ router_infra }}/lib/install-sing-box.sh"
    dest: "{{ router_tmp }}/router/install-sing-box.sh"
    mode: '0755'
  changed_when: false

- name: Бинарник sing-box
  ansible.builtin.command:
    argv: ["{{ router_tmp }}/router/install-sing-box.sh"]
  environment:
    PATH: "{{ router_path }}"
    VPN2_RELEASE_MANIFEST: "{{ vpn2_env.VPN2_RELEASE_MANIFEST | default('') }}"
    VPN2_DEVELOPMENT: "{{ vpn2_env.VPN2_DEVELOPMENT | default('') }}"
  register: router_binary
  changed_when: "'уже установлен' not in router_binary.stdout"

- name: Наборы правил geoip и geosite
  ansible.builtin.include_tasks: rule-sets.yml

# Клиентам VPN до адресов самого entry открыты только публичные порты. Набор
# пишется и перед каждым стартом sing-box (ExecStartPre юнита).
- name: Набор адресов entry
  ansible.builtin.command:
    argv: ["{{ router_vpn2 }}", router, entry-addrs]
  changed_when: false

- name: Конфиг роутера по экзитам
  ansible.builtin.include_tasks: exits.yml

- name: Юниты роутера
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/systemd/system/
    mode: '0644'
  loop: [sing-box.service, anysda-apply-routes.service, anysda-apply-routes.path]

- name: Ресурсы юнитов роутера
  ansible.builtin.include_role:
    name: resources
  vars:
    resources_units: [sing-box, anysda-apply-routes]

# route_localnet нужен TPROXY клиентов (--on-ip 127.0.0.1).
- name: Sysctl роутера
  ansible.builtin.copy:
    content: "net.ipv4.conf.all.route_localnet=1\n"
    dest: /etc/sysctl.d/99-anysda-vpn.conf
    mode: '0644'
  register: router_sysctl

- name: Sysctl роутера применён  # noqa: no-handler
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-anysda-vpn.conf
  when: router_sysctl is changed
  changed_when: true

# Пустые файлы, чтобы наблюдателю было за чем следить до первой правки в панели.
- name: Файлы ручных маршрутов панели
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "/etc/anysda/{{ item.name }}"
    force: false
    mode: '0644'
  loop:
    - {name: manual-routes.json, content: "[]\n"}
    - {name: client-prefs.json, content: "{}\n"}

- name: Роутер и наблюдатель ручных маршрутов включены
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    enabled: true
    state: "{{ item.state | default(omit) }}"
    daemon_reload: true
  loop:
    - {name: sing-box}
    - {name: anysda-apply-routes.path, state: started}

# config.json = база + ручные маршруты панели; перезапуск один, шагом ниже.
- name: Конфиг роутера с маршрутами панели
  ansible.builtin.command:
    argv: ["{{ router_vpn2 }}", router, apply-routes, --no-restart]
  register: router_apply
  changed_when: "'config.json собран' in router_apply.stdout"

# Перезапуск рвёт соединения клиентов: только при смене того, что читает sing-box.
- name: Роутер запущен с текущими входами
  ansible.builtin.command:
    argv: >-
      {{ [router_vpn2, 'host', 'restart-if-changed', '--record', '/var/lib/sing-box/applied.sha256', 'sing-box',
          router_sing_box, '/etc/systemd/system/sing-box.service', '/etc/sing-box/config.json']
         + router_exits | map('regex_replace', '^(.*)$', router_certs ~ '/\1.pem') | list
         + ['/etc/sysctl.d/99-anysda.conf'] }}
  register: router_restart
  changed_when: "'vpn2: changed' in router_restart.stdout"

# verify идёт сразу после стадии и ходит в clash-api.
- name: Порт clash-api открыт
  ansible.builtin.wait_for:
    host: "{{ vpn2_env.MGMT_IP | default('10.99.0.1', true) }}"
    port: 9090
    timeout: 10
  when: "'vpn2: changed' in router_restart.stdout"
