---
# sshd -t требует каталог privsep, а apt при обновлении openssh его удаляет:
# до перезапуска ssh.service вернуть его некому.
- name: Каталог privsep sshd
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: '0755'

# Вход по паролю закрывается всегда. Ключ оркестратора доказан входом этого же плея; ключ человека
# на entry - его строкой в authorized_keys: иначе после переустановки entry на неё не зайти.
- name: Ключ человека лежит на entry
  ansible.builtin.command: cat /root/.ssh/authorized_keys
  register: base_sshd_keys
  changed_when: false
  failed_when: >-
    base_sshd_keys.rc != 0 or not ((base_host_keys | trim) or (base_admin_key and
    (base_admin_key.split() | first) ~ ' ' ~ (base_admin_key.split()[1] | default('')) in base_sshd_keys.stdout))
  when: base_entry

# Невалидный конфиг на место не ложится: проверка идёт до записи. Файл 00-* читается раньше
# 50-cloud-init.conf образа, а у sshd побеждает первое значение.
- name: Парольный вход и вход root
  ansible.builtin.copy:
    content: |
      # anysda-vpn — set by infra/scripts/00-bootstrap.sh
      PasswordAuthentication no
      PermitRootLogin prohibit-password
      KbdInteractiveAuthentication no
    dest: /etc/ssh/sshd_config.d/00-anysda.conf
    mode: '0644'
    validate: sshd -t -f %s
  register: base_sshd_dropin

- name: Те же строки основного конфига sshd
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: '^#?{{ item.key }}.*$'
    replace: '{{ item.key }} {{ item.value }}'
    validate: sshd -t -f %s
  loop:
    - {key: PasswordAuthentication, value: 'no'}
    - {key: PermitRootLogin, value: prohibit-password}
    - {key: ChallengeResponseAuthentication, value: 'no'}
    - {key: KbdInteractiveAuthentication, value: 'no'}
  register: base_sshd_main

# OpenSSH 9.8+ штрафует адрес на 90 с за оборванный вход, и несколько неудачных
# входов деплоя запирают его. Старый sshd директивы не знает и с ней падает.
- name: Директивы действующего sshd
  ansible.builtin.command:
    cmd: sshd -T
  register: base_sshd_dump
  changed_when: false
  failed_when: false

- name: Штрафы адресам за оборванный вход выключены
  ansible.builtin.copy:
    content: "PerSourcePenalties no\n"
    dest: /etc/ssh/sshd_config.d/99-anysda-no-penalties.conf
    mode: '0644'
    validate: sshd -t -f %s
  when: "'persourcepenalties ' in base_sshd_dump.stdout | lower"
  register: base_sshd_penalties

- name: Служба ssh работает
  ansible.builtin.systemd_service:
    name: ssh
    state: started

- name: Служба ssh перечитала конфиг  # noqa: no-handler
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: systemctl reload-or-restart ssh
  when: base_sshd_dropin is changed or base_sshd_main is changed or base_sshd_penalties is changed
  changed_when: true

# Действующие значения, а не файл: drop-in образа или Match могли их перебить.
- name: Вход по паролю закрыт в действующем sshd
  ansible.builtin.command:
    cmd: sshd -T
  register: base_sshd_now
  changed_when: false
  failed_when: >-
    base_sshd_now.rc != 0 or 'passwordauthentication no' not in base_sshd_now.stdout_lines
    or 'kbdinteractiveauthentication no' not in base_sshd_now.stdout_lines
