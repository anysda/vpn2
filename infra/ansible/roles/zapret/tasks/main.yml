---
# YouTube с адреса entry через DPI-десинк zapret2/nfqws2. Роль идёт до роутера:
# сначала готов путь десинка, потом sing-box начинает на него отправлять.
- name: Десинк выключен - развёрнутое снято
  ansible.builtin.include_tasks: off.yml
  vars:
    zapret_off: "{{ zapret_all_off }}"
  when: zapret_route != 'zapret'

- name: Десинк YouTube
  ansible.builtin.import_tasks: desync.yml
  when: zapret_route == 'zapret'
