name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S error
      - name: мёртвые переменные и функции
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -i SC2034,SC2317,SC2329
      - name: проверка загрузки AWS CLI
        run: python3 infra/tests/test_aws_cli.py
      - name: зависимости Debian и Ubuntu
        run: bash infra/tests/debian-compat.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: мастер на Python из Debian 12
        run: bash infra/tests/setup-compat.sh

  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ruff
        run: git ls-files -z '*.py' | xargs -0 pipx run --spec ruff==0.13.3 ruff check --isolated --select E9,F,ARG,ERA
      - name: vulture
        run: git ls-files -z '*.py' | xargs -0 pipx run --spec vulture==2.14 vulture --min-confidence 0
      - name: config2env на config.example.yaml
        run: |
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          cp config.example.yaml "$d/config.yaml"
          sed -i 's/^  passphrase: ""/  passphrase: ci pass/' "$d/config.yaml"
          python3 infra/lib/config2env.py "$d"
          test -s "$d/infra/envs/all.env"

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sing-box: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: зависимости инфраструктуры
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq strongswan-pki libstrongswan-standard-plugins wireguard-tools openvpn apache2-utils nftables iptables iproute2 qrencode zbar-tools
          python3 -m pip install PyYAML==6.0.3
      - name: регрессии инфраструктуры без sing-box
        if: ${{ !matrix.sing-box }}
        run: python3 infra/tests/run_parallel.py
      - name: регрессии развёртывания и маршрутов sing-box
        if: matrix.sing-box
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          version=$(sed -n "s/^readonly SB_VER='\([^']*\)'/\1/p" infra/lib/install-sing-box.sh)
          test -n "$version"
          checksum=$(sed -n "s/^readonly SB_SHA256_AMD64='\([^']*\)'/\1/p" infra/lib/install-sing-box.sh)
          test -n "$checksum"
          # releases/download бывает 504, тогда тот же файл берётся через API релизов
          python3 infra/tests/release_fetch.py SagerNet/sing-box "v${version}" \
            "sing-box-${version}-linux-amd64.tar.gz" "$d/sing-box.tar.gz" --sha256 "$checksum"
          printf '%s  %s\n' "$checksum" "$d/sing-box.tar.gz" | sha256sum --check --status
          tar -xzf "$d/sing-box.tar.gz" -C "$d"
          export SING_BOX_BIN="$d/sing-box-${version}-linux-amd64/sing-box"
          export RUN_NETNS_TESTS=1
          "$SING_BOX_BIN" version
          python3 infra/tests/run_parallel.py

  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: telegram/requirements.txt
      - name: регрессии Telegram-бота
        timeout-minutes: 10
        run: |
          # zbarimg раскодирует PNG QR бота (test_qr_size.py).
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zbar-tools
          python3 -m pip install -r telegram/requirements.txt
          python3 -m unittest discover -s telegram/tests -v

  # Сохраняем прежний общий статус python: он зелёный только после всех
  # наборов, в том числе обеих веток матрицы infra (важно для required checks).
  python:
    needs: [python-lint, infra, telegram]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: все проверки Python прошли
        env:
          LINT_RESULT: ${{ needs.python-lint.result }}
          INFRA_RESULT: ${{ needs.infra.result }}
          BOT_RESULT: ${{ needs.telegram.result }}
        run: test "$LINT_RESULT,$INFRA_RESULT,$BOT_RESULT" = success,success,success

  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: SQLite WAL и полный цикл backup/restore
        # Копия и restore проверяют wg0.conf настоящим wg во временном netns, как
        # root на узле: нужны iproute2 и права на netns (меньше этих трёх не хватает).
        run: |
          docker run --rm -e VPN2_BACKUP_TEST=1 -v "$PWD:/src:ro" \
            --cap-add NET_ADMIN --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            debian:13 sh -ec '
            timeout 300 apt-get update -qq
            timeout 300 apt-get install -y -qq --no-install-recommends python3 sqlite3 age expect curl git wireguard-tools openssl iproute2
            python3 /src/infra/tests/backup-restore.py /src
            python3 /src/infra/tests/backup-clone-path.py /src
          '

  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: статическая аварийная панель и инструкция
        run: pnpm emergency:build
      # Плагин nuxt в knip читает .vue через vue/compiler-sfc; под pnpm vue не
      # лежит в корне node_modules, без NODE_PATH knip молча считает все
      # компоненты и composables мёртвыми.
      - name: knip
        env:
          NODE_PATH: ${{ github.workspace }}/app/node_modules/.pnpm/node_modules
        run: |
          pnpm dlx knip@6.39.0
          pnpm dlx knip@6.39.0 --production --exclude dependencies,unlisted,binaries

  backup-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: перенос ключей VPN на чистый хост и совместимость старых архивов
        run: |
          docker build -t vpn2-backup-test infra/tests
          docker run --rm -v "$PWD:/repo:ro" vpn2-backup-test

  # Выбор по путям один раз: шарды и QR без зависимостей панели пропускаются.
  panel-e2e-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: изменения зависимостей панели
        id: paths
        working-directory: app
        run: |
          selected=$(python3 ../infra/lib/e2e_paths.py --github)
          echo "run=$selected" >> "$GITHUB_OUTPUT"

  # Набор делится на задания по весам run-shards.py (каждый spec ровно в одном),
  # внутри задания - те же 4 панели запускателя.
  panel-e2e-shard:
    needs: panel-e2e-paths
    if: needs.panel-e2e-paths.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - name: сборка панели один раз для всех шардов
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: vpn2-panel:e2e
          cache-from: type=gha,scope=checks-panel
          cache-to: type=gha,mode=max,scope=checks-panel
      - name: загрузка браузерного образа
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          docker pull "mcr.microsoft.com/playwright:v${version}-noble"
      - name: spec-файлы шарда
        env:
          PART: ${{ matrix.part }}
          PARTS: ${{ strategy.job-total }}
        run: |
          python3 - > "$RUNNER_TEMP/specs.txt" <<'EOF'
          import importlib.util, json, os, re, subprocess, sys
          spec = importlib.util.spec_from_file_location('run_shards', 'e2e/run-shards.py')
          run_shards = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(run_shards)
          # Тот же список, что у запускателя без аргументов: Playwright --list.
          listing = json.loads(subprocess.check_output(
              ['node_modules/.bin/playwright', 'test', '--list', '--reporter=json'], text=True,
              env={**os.environ, 'E2E_ADMIN_PASSWORD': 'listing-only'}))
          files = sorted({suite['file'] for suite in listing['suites']})
          weights = json.loads(open('e2e/shard-weights.json').read())
          groups = run_shards.assign_files(files, int(os.environ['PARTS']), weights)
          mine = groups[int(os.environ['PART']) - 1]
          if not mine:
              sys.exit('shard has no specs')
          print(f'part {os.environ["PART"]}/{os.environ["PARTS"]}: {len(mine)} of {len(files)} specs',
                file=sys.stderr)
          print('\n'.join(f'e2e/{re.escape(file)}$' for file in mine))
          EOF
      - name: сквозные тесты на собранном образе при смене сети хоста
        env:
          E2E_IP: sudo -n ip
          E2E_SKIP_BUILD: '1'
          E2E_SHARDS: '4'
        run: |
          mapfile -t specs < "$RUNNER_TEMP/specs.txt"
          python3 e2e/with-network-churn.py bash e2e/run-local.sh "${specs[@]}"
      - name: отчёт и трейсы
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.part }}
          path: |
            app/playwright-report
            app/test-results
          retention-days: 14

  # Худший конфиг (вход 45.x, сплит) и панель без сплита, аварийка hy2 и бот:
  # qrencode рисует PNG аварийки, zbarimg раскодирует PNG.
  panel-e2e-qr:
    needs: panel-e2e-paths
    if: needs.panel-e2e-paths.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - name: сборка панели
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: vpn2-panel:e2e
          cache-from: type=gha,scope=checks-panel
      - name: загрузка браузерного образа
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          docker pull "mcr.microsoft.com/playwright:v${version}-noble"
      - name: qrencode и zbarimg для размера QR
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qrencode zbar-tools
      - name: размер QR на худшем конфиге
        timeout-minutes: 10
        env:
          E2E_SKIP_BUILD: '1'
          E2E_BASE_IMAGE: vpn2-panel:e2e
        run: bash e2e/qr-size.sh
      - name: отчёт и трейсы
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-qr
          path: |
            app/playwright-report
            app/test-results
          retention-days: 14

  # Прежнее имя для required checks: зелёное, когда прошли все шарды и QR
  # или e2e не требуется.
  panel-e2e:
    needs: [panel-e2e-paths, panel-e2e-shard, panel-e2e-qr]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: все шарды e2e прошли
        env:
          RUN: ${{ needs.panel-e2e-paths.outputs.run }}
          PATHS_RESULT: ${{ needs.panel-e2e-paths.result }}
          SHARD_RESULT: ${{ needs.panel-e2e-shard.result }}
          QR_RESULT: ${{ needs.panel-e2e-qr.result }}
        run: |
          if [ "$PATHS_RESULT" = success ] && [ "$RUN" = false ]; then
            echo 'panel-e2e skipped — no panel dependencies changed'
            exit 0
          fi
          test "$PATHS_RESULT,$SHARD_RESULT,$QR_RESULT" = success,success,success
