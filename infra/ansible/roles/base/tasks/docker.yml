---
- name: Команда docker
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: base_docker

- name: Установка Docker
  when: not base_docker.stat.exists
  block:
    # Источник тот же, что у подготовки деплоя и ролей containers и emergency.
    - name: Общие функции узла
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../lib/anysda-svc.sh"
        dest: "{{ base_tmp }}/anysda-svc.sh"
        mode: '0644'
      changed_when: false

    - name: Источник Docker
      ansible.builtin.shell: |
        source {{ base_tmp }}/anysda-svc.sh
        docker_apt_source
      args: {executable: /bin/bash}
      register: base_docker_source
      until: base_docker_source is succeeded
      retries: 3
      delay: 10
      changed_when: true

    # Без рекомендуемых: rootless-extras, buildx и compose из пакетов узлу не
    # нужны, плагин compose ставит роль containers из выпуска.
    - name: Пакеты Docker
      ansible.builtin.apt:
        name: "{{ base_packages_docker }}"
        state: present
        update_cache: true
        install_recommends: false
        lock_timeout: 1200
      environment:
        NEEDRESTART_MODE: a
      register: base_apt
      until: base_apt is succeeded
      retries: 3
      delay: 10
