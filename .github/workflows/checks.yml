name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S error
      - name: мёртвые переменные и функции
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -i SC2034,SC2317,SC2329
      - name: проверка загрузки AWS CLI
        run: python3 infra/tests/test_aws_cli.py
      - name: зависимости Debian и Ubuntu
        run: bash infra/tests/debian-compat.sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: мастер на Python из Debian 12
        run: bash infra/tests/setup-compat.sh

  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: ruff
        run: git ls-files -z '*.py' | xargs -0 pipx run --spec ruff==0.17.4 ruff check --isolated --select E9,F,ARG,ERA
      - name: vulture
        run: git ls-files -z '*.py' | xargs -0 pipx run --spec vulture==2.16 vulture --min-confidence 0
      - name: config2env на config.example.yaml
        run: |
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          cp config.example.yaml "$d/config.yaml"
          sed -i 's/^  passphrase: ""/  passphrase: ci pass/' "$d/config.yaml"
          python3 infra/lib/config2env.py "$d"
          test -s "$d/infra/envs/all.env"

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sing-box: [false, true]
        # Доля набора на задание: одна часть целиком дольше 10 минут.
        part: [1, 2, 3]
    env:
      SHARD: ${{ matrix.part }}/3
      MANIFEST: /tmp/infra-manifest.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: зависимости инфраструктуры
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq strongswan-pki libstrongswan-standard-plugins wireguard-tools openvpn apache2-utils nftables iptables iproute2 qrencode zbar-tools
          python3 -m pip install PyYAML==6.0.3
      # Тесты панели качают Caddy при импорте в каждой части; releases/download
      # молчит до таймаута по 120 с, API релизов отдаёт тот же файл сразу.
      - name: Caddy для тестов панели
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/^CADDY_VER='\([^']*\)'/\1/p" infra/lib/anysda-svc.sh)
          test -n "$version"
          name="caddy_${version}_linux_amd64.tar.gz"
          d=$(mktemp -d)
          gh release download "v$version" -R caddyserver/caddy -D "$d" -p "$name" -p "caddy_${version}_checksums.txt"
          grep " $name\$" "$d/caddy_${version}_checksums.txt" | sed "s| $name\$| $d/$name|" | sha512sum --check --status
          cache="$HOME/.cache/vpn2-tests/caddy-$version"
          mkdir -p "$cache"
          tar -xzf "$d/$name" -C "$cache" caddy
          "$cache/caddy" version
      - name: регрессии инфраструктуры без sing-box
        if: ${{ !matrix.sing-box }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 infra/tests/run_parallel.py --shard "$SHARD" --manifest "$MANIFEST"
      - name: регрессии развёртывания и маршрутов sing-box
        if: matrix.sing-box
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          version=$(sed -n "s/^readonly SB_VER='\([^']*\)'/\1/p" infra/lib/install-sing-box.sh)
          test -n "$version"
          checksum=$(sed -n "s/^readonly SB_SHA256_AMD64='\([^']*\)'/\1/p" infra/lib/install-sing-box.sh)
          test -n "$checksum"
          # releases/download бывает 504, тогда тот же файл берётся через API релизов
          python3 infra/tests/release_fetch.py SagerNet/sing-box "v${version}" \
            "sing-box-${version}-linux-amd64.tar.gz" "$d/sing-box.tar.gz" --sha256 "$checksum"
          printf '%s  %s\n' "$checksum" "$d/sing-box.tar.gz" | sha256sum --check --status
          tar -xzf "$d/sing-box.tar.gz" -C "$d"
          export SING_BOX_BIN="$d/sing-box-${version}-linux-amd64/sing-box"
          export RUN_NETNS_TESTS=1
          "$SING_BOX_BIN" version
          python3 infra/tests/run_parallel.py --shard "$SHARD" --manifest "$MANIFEST"
      - uses: actions/upload-artifact@v7
        with:
          name: infra-manifest-${{ matrix.sing-box }}-${{ matrix.part }}
          path: ${{ env.MANIFEST }}
          retention-days: 1

  # Части infra вместе прогнали ровно найденный набор, без пропусков и повторов.
  infra-sum:
    needs: infra
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: infra-manifest-*
          path: ${{ runner.temp }}/manifests
      - name: сумма тестов по частям infra
        env:
          DIR: ${{ runner.temp }}/manifests
        run: |
          for variant in false true; do
            python3 infra/tests/run_parallel.py --check-manifests "$DIR"/infra-manifest-"$variant"-*/infra-manifest.json
          done

  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: telegram/requirements.txt
      - name: регрессии Telegram-бота
        timeout-minutes: 10
        run: |
          # zbarimg раскодирует PNG QR бота (test_qr_size.py).
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zbar-tools
          python3 -m pip install -r telegram/requirements.txt
          python3 -m unittest discover -s telegram/tests -v

  # Сохраняем прежний общий статус python: он зелёный только после всех
  # наборов, в том числе обеих веток матрицы infra (важно для required checks).
  python:
    needs: [python-lint, infra, infra-sum, telegram]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: все проверки Python прошли
        env:
          LINT_RESULT: ${{ needs.python-lint.result }}
          INFRA_RESULT: ${{ needs.infra.result }}
          INFRA_SUM_RESULT: ${{ needs.infra-sum.result }}
          BOT_RESULT: ${{ needs.telegram.result }}
        run: test "$LINT_RESULT,$INFRA_RESULT,$INFRA_SUM_RESULT,$BOT_RESULT" = success,success,success,success

  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: SQLite WAL и полный цикл backup/restore
        # Копия и restore проверяют wg0.conf настоящим wg во временном netns, как
        # root на узле: нужны iproute2 и права на netns (меньше этих трёх не хватает).
        run: |
          docker run --rm -e VPN2_BACKUP_TEST=1 -v "$PWD:/src:ro" \
            --cap-add NET_ADMIN --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            debian:13 sh -ec '
            timeout 300 apt-get update -qq
            timeout 300 apt-get install -y -qq --no-install-recommends python3 sqlite3 age expect curl git wireguard-tools openssl iproute2
            python3 /src/infra/tests/backup-restore.py /src
            python3 /src/infra/tests/backup-clone-path.py /src
          '

  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: статическая аварийная панель и инструкция
        run: pnpm emergency:build
      # Плагин nuxt в knip читает .vue через vue/compiler-sfc; под pnpm vue не
      # лежит в корне node_modules, без NODE_PATH knip молча считает все
      # компоненты и composables мёртвыми.
      - name: knip
        env:
          NODE_PATH: ${{ github.workspace }}/app/node_modules/.pnpm/node_modules
        run: |
          pnpm dlx knip@6.44.2
          pnpm dlx knip@6.44.2 --production --exclude dependencies,unlisted,binaries

  backup-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: перенос ключей VPN на чистый хост и совместимость старых архивов
        run: |
          docker build -t vpn2-backup-test infra/tests
          docker run --rm -v "$PWD:/repo:ro" vpn2-backup-test

  # Выбор по путям - первым шагом каждого задания, без отдельного задания перед
  # ними: шарды и QR стартуют вместе с остальными проверками, а без зависимостей
  # панели проходят пустыми.
  # Набор делится по весам run-shards.py сразу на все панели всех заданий
  # (E2E_PART), в задании 4 панели запускателя; тяжёлые spec с весами по
  # тестам делятся по тестам. Каждое задание сверяет, что прогнало ровно свою
  # долю общего разбиения, вместе - каждый тест ровно один раз.
  panel-e2e-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      run: ${{ steps.paths.outputs.run }}
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: изменения зависимостей панели
        id: paths
        run: |
          selected=$(python3 ../infra/lib/e2e_paths.py --github)
          echo "run=$selected" >> "$GITHUB_OUTPUT"
      - if: steps.paths.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - if: steps.paths.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - if: steps.paths.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: загрузка браузерного образа, в фоне на время сборки панели
        if: steps.paths.outputs.run == 'true'
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          nohup docker pull -q "mcr.microsoft.com/playwright:v${version}-noble" > "$RUNNER_TEMP/browser-pull.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/browser-pull.pid"
      - if: steps.paths.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - name: сборка панели
        if: steps.paths.outputs.run == 'true'
        uses: docker/build-push-action@v7
        with:
          context: app
          load: true
          tags: vpn2-panel:e2e
          # Кэш пишет только panel-e2e-qr: запись из пяти шардов разом шла ~55 с.
          cache-from: type=gha,scope=checks-panel
      - name: браузерный образ загружен
        if: steps.paths.outputs.run == 'true'
        timeout-minutes: 5
        run: |
          pid=$(cat "$RUNNER_TEMP/browser-pull.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          version=$(node -p 'require("@playwright/test/package.json").version')
          docker image inspect "mcr.microsoft.com/playwright:v${version}-noble" >/dev/null \
            || { cat "$RUNNER_TEMP/browser-pull.log"; exit 1; }
      - name: сквозные тесты на собранном образе при смене сети хоста
        if: steps.paths.outputs.run == 'true'
        env:
          E2E_IP: sudo -n ip
          E2E_SKIP_BUILD: '1'
          E2E_SKIP_IMAGE_CHECKS: '1'
          E2E_SHARDS: '4'
          E2E_PART: ${{ matrix.part }}/${{ strategy.job-total }}
        run: python3 e2e/with-network-churn.py bash e2e/run-local.sh
      - name: отчёт и трейсы
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.part }}
          path: |
            app/playwright-report
            app/test-results
          retention-days: 14

  # Худший конфиг (вход 45.x, сплит) и панель без сплита, аварийка hy2 и бот:
  # qrencode рисует PNG аварийки, zbarimg раскодирует PNG. Здесь же один раз
  # проверки образа без браузера (e2e/image-checks.sh) и запись кэша сборки
  # панели: задание короче шардов, запись не удлиняет e2e.
  panel-e2e-qr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      run: ${{ steps.paths.outputs.run }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: изменения зависимостей панели
        id: paths
        run: |
          selected=$(python3 ../infra/lib/e2e_paths.py --github)
          echo "run=$selected" >> "$GITHUB_OUTPUT"
      - if: steps.paths.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - if: steps.paths.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - if: steps.paths.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: загрузка браузерного образа, в фоне на время сборки панели
        if: steps.paths.outputs.run == 'true'
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          nohup docker pull -q "mcr.microsoft.com/playwright:v${version}-noble" > "$RUNNER_TEMP/browser-pull.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/browser-pull.pid"
      - name: qrencode и zbarimg для размера QR
        if: steps.paths.outputs.run == 'true'
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qrencode zbar-tools
      - if: steps.paths.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - name: сборка панели
        if: steps.paths.outputs.run == 'true'
        uses: docker/build-push-action@v7
        with:
          context: app
          load: true
          tags: vpn2-panel:e2e
          cache-from: type=gha,scope=checks-panel
          cache-to: type=gha,mode=max,scope=checks-panel
      - name: браузерный образ загружен
        if: steps.paths.outputs.run == 'true'
        timeout-minutes: 5
        run: |
          pid=$(cat "$RUNNER_TEMP/browser-pull.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          version=$(node -p 'require("@playwright/test/package.json").version')
          docker image inspect "mcr.microsoft.com/playwright:v${version}-noble" >/dev/null \
            || { cat "$RUNNER_TEMP/browser-pull.log"; exit 1; }
      - name: размер QR на худшем конфиге
        if: steps.paths.outputs.run == 'true'
        timeout-minutes: 10
        env:
          E2E_SKIP_BUILD: '1'
          E2E_BASE_IMAGE: vpn2-panel:e2e
        run: bash e2e/qr-size.sh
      - name: проверки образа без браузера
        if: steps.paths.outputs.run == 'true'
        timeout-minutes: 5
        run: bash e2e/image-checks.sh vpn2-panel:qr
      - name: отчёт и трейсы
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-qr
          path: |
            app/playwright-report
            app/test-results
          retention-days: 14

  # Прежнее имя сводной проверки. Своего раннера на успехе не ждёт: при
  # зелёных шардах и QR пропущено (пропуск = зелёная проверка), очередь за
  # раннером на общем лимите аккаунта стоила до 3,5 мин. Красное, когда шард
  # или QR упали или отменены.
  panel-e2e:
    needs: [panel-e2e-shard, panel-e2e-qr]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: шард или QR не прошли
        env:
          SHARD_RESULT: ${{ needs.panel-e2e-shard.result }}
          QR_RESULT: ${{ needs.panel-e2e-qr.result }}
        run: |
          echo "panel-e2e-shard=$SHARD_RESULT panel-e2e-qr=$QR_RESULT"
          exit 1
