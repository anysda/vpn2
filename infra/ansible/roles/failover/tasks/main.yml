---
# Сторож активно опрашивает экзиты через clash-api и переключает группу
# foreign-best на живой экзит. Идёт после 20-ru-router: тот пишет секрет
# clash-api и поднимает sing-box.
- name: Файл сторожа прежних выпусков убран
  ansible.builtin.file:
    path: /usr/local/bin/anysda-failover-watchdog
    state: absent

# Ручные настройки сторожа в env-файле переживают передеплой.
- name: Env-файл сторожа
  ansible.builtin.command:
    argv: ["{{ failover_vpn2 }}", watchdog, failover-env]
  environment:
    MGMT_IP: "{{ vpn2_env.MGMT_IP | default('') }}"
    RESTART_AFTER_CHECKS: "{{ vpn2_env.RESTART_AFTER_CHECKS | default('') }}"
    RESTART_MIN_INTERVAL_S: "{{ vpn2_env.RESTART_MIN_INTERVAL_S | default('') }}"
  register: failover_env_step
  changed_when: "'changed=1' in failover_env_step.stdout"

# Сторож TPROXY раз в минуту проверяет то, без чего клиенты wg0, OpenVPN и
# IKEv2 молча теряют интернет, и чинит на месте.
- name: Сторожа и их юниты
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - {src: anysda-failover-watchdog.service, dest: /etc/systemd/system/, mode: '0644'}
    - {src: anysda-tproxy-watchdog.service, dest: /etc/systemd/system/, mode: '0644'}
    - {src: anysda-tproxy-watchdog.timer, dest: /etc/systemd/system/, mode: '0644'}
    - {src: anysda-tproxy-watchdog.sh, dest: /usr/local/sbin/anysda-tproxy-watchdog.sh, mode: '0755'}

- name: Ресурсы юнитов сторожей
  ansible.builtin.include_role:
    name: resources
  vars:
    resources_units: [anysda-failover-watchdog, anysda-tproxy-watchdog]

- name: Сторож экзитов включён
  ansible.builtin.systemd_service:
    name: anysda-failover-watchdog
    enabled: true
    daemon_reload: true

# Перезапуск только при смене входов службы: кода сторожа, юнита, env-файла.
- name: Сторож экзитов запущен с текущими входами
  ansible.builtin.command:
    argv: [/bin/bash, --norc, -euo, pipefail, -c, "{{ failover_restart_step }}", "{{ failover_tmp }}",
           "{{ failover_wheel_mark }}", /etc/systemd/system/anysda-failover-watchdog.service, "{{ failover_env }}"]
    vars:
      failover_restart_step: source "$0/anysda-svc.sh"; svc_restart_if_changed anysda-failover-watchdog "$@"; svc_settle 3
  environment:
    HOST_TAG: "{{ inventory_hostname }}"
  register: failover_restart
  changed_when: "'перезапущен' in failover_restart.stdout"

- name: Таймер сторожа TPROXY
  ansible.builtin.systemd_service:
    name: anysda-tproxy-watchdog.timer
    enabled: true
    state: started

- name: Отметка стадии
  ansible.builtin.copy:
    content: ''
    dest: /var/anysda/.stamps/21-failover-watchdog
    force: false
    mode: '0644'
