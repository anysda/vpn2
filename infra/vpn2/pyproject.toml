[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PyYAML"]

[project.scripts]
vpn2 = "vpn2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vpn2 = ["google-prefixes.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
