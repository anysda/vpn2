# anysda-vpn2 — конфигурация инфраструктуры
#
# 1. Запусти интерактивный мастер: ./setup.sh
#    (или скопируй этот файл и заполни вручную: cp config.example.yaml config.yaml)
# 2. ./deploy.sh   # зависимости, проверки и полный деплой
#
# chmod 600 — файл содержит пароли в открытом виде.

# Входная нода — WireGuard + OpenVPN серверы, sing-box роутер, веб-панель,
# AdGuard. Авторизация через root + пароль (sshpass).
entry:
  host: 1.2.3.4
  password: <root-password>
  # public_host: vpn.example.com   # опционально: адрес сервера в клиентских
  #                                # WG/OVPN-конфигах вместо IP; при смене IP
  #                                # entry хватит поменять A-запись; не задан -
  #                                # берётся panel.domain, без него IP entry
  # Домен — только IPv4 (A), без IPv6 (AAAA), иначе VPN на Linux может не заработать.

# Выходные ноды — Hysteria2 серверы. Минимум 1, рекомендуется 2+.
exits:
  - tag: us              # короткий тег: us / gb / nl / de / us2 / ...
    host: 5.6.7.8
    password: <root-password>

  - tag: gb
    host: 9.10.11.12
    password: <root-password>
    hy2_direct_port: 4443   # опционально — задай если хостер фильтрует UDP:443
                            # (verify_and_rotate_ports сделает это сам, но можно
                            # сразу прописать чтобы не пересобирать)
    # Обе скорости пустые/отсутствуют → BBR (дефолт). Обе заданы → Brutal
    # для direct и WARP; служебный hy2-mgmt остаётся на BBR. Сначала измерь
    # ёмкость пути хаб ↔ экзит; числа ниже только пример, не рекомендация.
    # Направления со стороны ЭКЗИТА: up = экзит → хаб, down = хаб → экзит.
    # hy2_up_mbps: 200
    # hy2_down_mbps: 100
    # Только для совместимости: deploy закрепляет сертификат экзита сам. С
    # флагом entry не проверяет сертификат, и подмену экзита на пути не видно.
    # hy2_insecure: true

# Учётка администратора веб-панели.
# password опционально: если пусто — будет сгенерирован 18-символьный пароль
# при первом деплое и записан в /etc/anysda/admin-password.txt на RU ноде.
admin:
  user: anysda
  # password: my-secret
  # ssh_pubkey опционально, но РЕКОМЕНДУЕТСЯ. Если задан — при деплое ключ
  # кладётся в /root/.ssh/authorized_keys на всех нодах и парольный вход по SSH
  # отключается на entry. На экзитах пароль отключается всегда, как только на
  # них лёг ключ оркестратора. Если пусто — парольный вход остаётся на entry
  # (VPN2-31: без ключа админа entry нельзя запирать, иначе после переустановки
  # на неё не зайти).
  # ssh_pubkey: "ssh-ed25519 AAAA... you@host"

# Домен для веб-панели (опционально).
# Без домена: HTTPS на публичном IP, Let's Encrypt shortlived (~6 дней),
# обновление через 5 суток; с доменом — окно за 7 дней до истечения.
# TCP 80 (ACME HTTP-01) и 443 должны быть доступны извне; HTTP/3 выключен.
# Первый выпуск не удался: HTTP до успешной повторной попытки.
# Ошибка ACME и срок сертификата — через настроенного Telegram-бота
# не чаще раза в 6 часов; после восстановления — «обновлено».
# Если задан — Caddy получит Let's Encrypt сертификат, панель доступна по
# HTTPS. A-запись домена должна указывать на IP entry-ноды. Без
# entry.public_host домен попадает и в клиентские WG/OVPN/IKEv2-конфиги;
# выданные раньше конфиги по IP продолжают работать.
# Hysteria2-туннели НЕ зависят от домена и остаются на self-signed TLS (IP).
# panel:
#   domain: vpn.example.com
#   image: ghcr.io/anysda/vpn2/panel:dev   # только ./deploy.sh --development
# Обычный ./deploy.sh берёт образы панели и бота по digest из манифеста
# сборки commit дерева, image из конфига при этом не используется.

# Образ Telegram-бота: так же, только для --development.
# tgbot:
#   image: ghcr.io/anysda/vpn2/tgbot:dev

# SSO через OIDC-провайдера (проверено на Authentik). Опционально, по умолчанию
# ВЫКЛЮЧЕНО — панель живёт на своём логине и пароле. Включается и в профиле
# панели, без передеплоя; этот блок только засевает настройки при первой
# установке, после сохранения в профиле он не применяется. Подробности и
# порядок подключения — docs/sso.md.
#
# ⚠️ Требует panel.domain: вход идёт по HTTPS, куки state/PKCE — Secure-only.
# ⚠️ allowed_subs обязателен. Панель НИКОГДА не заводит учётку из IdP: вход
#    пускается только к уже существующей и только по uuid из этого списка.
#    Пустой список = не войдёт никто (стадия падает заранее, а не молча).
# sso:
#   enabled: true
#   base_url: https://auth.example.com      # адрес IdP; discovery собирается как
#                                           # {base_url}/application/o/{app_slug}/.well-known/openid-configuration
#   app_slug: vpn2                          # slug приложения в Authentik
#   client_id: vpn2
#   client_secret: "<секрет OIDC-клиента>"
#   allowed_subs: "<uuid пользователя в IdP>"   # «<sub>» или «<sub>:<логин в панели>»,
#                                               # несколько — через запятую
#   auto_redirect: true                     # true — формы не видно вообще
#   password_login: true                    # пароль спрятан, но ЖИВ: /login?direct=1
#   label: Authentik
#   # discovery_url: https://…/.well-known/openid-configuration   # если IdP не Authentik

# Ресурсы entry рассчитываются на самой ноде при каждом прогоне 22/25/30/35:
# RAM из /proc/meminfo, свободный диск раздела /var/lib/vmsingle.
# 1/2/3 ГБ: лимиты памяти 0.5x/1x/2x от профиля 2 ГБ ниже; 4 ГБ+:
# штатная автоматика runtime без дополнительных лимитов. Допуск RAM 1/16
# на резерв ядра. Retention по RAM 1/3/5/7 суток, по диску максимум
# floor(свободно ГиБ)-1 суток, минимум 1. AdAway: от 3 ГБ RAM и 2 ГиБ
# свободного диска. Querylog: 50/100/500/1000 записей.
# Только раскомментированные поля перекрывают расчёт. Память в МиБ,
# 0 = штатная автоматика без лимита; querylog_size: 0 передаётся как есть.
# Docker swap запрещён при конечном лимите; AGH аналогично. Поля AGH,
# изменённые в UI, сохраняются; явные поля здесь имеют приоритет над UI.
# На старой установке без истории автоподбора сохраняются все существующие
# querylog/filters; явные поля ниже позволяют начать управлять ими из config.
# entry_resources:
#   panel_memory_mib: 384
#   panel_old_space_mib: 256
#   bot_memory_mib: 128
#   vm_memory_mib: 256
#   vm_cache_mib: 64
#   vm_query_mib: 16
#   vm_concurrent_requests: 4
#   agh_memory_mib: 256
#   agh_high_mib: 192
#   agh_go_mib: 160
#   retention_days: 3
#   adaway_enabled: false
#   querylog_size: 100

# Telegram-бот (опционально).
# Бот ставится при любом deploy. Без токена ждёт его из панели; токен из config
# включает бота, убранный из config - выключает (токен из панели остаётся).
# telegram:
#   bot_token: <telegram-bot-token>
#   chat_id: <telegram-chat-id>

# YouTube (опционально, по умолчанию ВЫКЛЮЧЕНО — YouTube едет через экзиты).
#
# Зачем включать: YouTube не показывает рекламу на российских IP. Через
# зарубежный экзит сайт видит иностранный адрес и начинает крутить рекламу —
# то есть VPN «чинит» доступ и ломает главное, ради чего его ставили семье.
# route: zapret выводит YouTube прямо с entry-ноды (РФ-адрес), а блокировку
# DPI обходит десинком TLS (nfqws2, стадия 19-yt-zapret собирается на entry).
# Побочный плюс — самый тяжёлый трафик перестаёт есть канал экзита.
#
# Что именно считается YouTube: geosite:youtube + список доменных суффиксов
# (googlevideo.com, ytimg, youtubei.googleapis.com и т.д.). Отбор для десинка
# идёт по SO_MARK, который sing-box ставит на эти соединения, — списки IP/CIDR
# вести не нужно, они протухают молча.
#
# ⚠️ Стадия 19 после развёртывания делает A/B-проверку (тот же хост по
#    помеченному пути и мимо него) и ВАЛИТ деплой, если обход не работает:
#    иначе стадия 20 увела бы YouTube на РФ-выход, где его режет DPI, и он
#    лёг бы у всех клиентов разом.
# youtube:
#   route: zapret       # off | zapret | direct
#                       #   zapret — РФ-выход + обход DPI (штатный режим)
#                       #   direct — РФ-выход без десинка (если DPI не режет)
#                       #   off    — как раньше, через экзиты
#   quic: block         # block | allow — QUIC (UDP/443) у YouTube. Десинк
#                       # проверен на TCP-TLS; блок заставляет плеер откатиться
#                       # на TCP сразу, а не ждать таймаута QUIC.
#   mark: 256           # SO_MARK. Менять только при конфликте с чужой меткой;
#                       # не должен пересекаться битами с 0x42 (TPROXY WG/OVPN)
#                       # и 0x40000000 (пакеты самого nfqws2).
#   offload: keep       # keep | off — TSO/GSO на WAN entry. Первое, что стоит
#                       # попробовать, если A/B-проверка не проходит.
#   window_scale: 1     # 0..14 | native. 1 — проверенный обход, потолок окна
#                       # 131070 байт. native сохраняет scale ядра и убирает
#                       # поправку nft; 8/9 — варианты для A/B. Начальное окно
#                       # тоже растёт: проверить проблемные видео до включения.
#                       # Масштаб нельзя вернуть после SYN. strategy ниже
#                       # полностью переопределяет этот выбор.
#   # strategy: "--lua-desync=..."      # переопределить стратегию nfqws2
#   #                                   # (подбирается blockcheck2.sh на entry;
#   #                                   # scale из wssize задаёт поправку окна
#   #                                   # в nft — см. README, раздел YouTube)
#   # zapret_ref: "6b6c63e3385fa73f8af3be4a69171e947f5a319d"   # bol-van/zapret2 v1.0.5.2
#   # domains: "youtube.com googlevideo.com ..."   # заменить список суффиксов

# Кастомные порты (опционально). Дефолты подходят для большинства настроек.
# ports:
#   hy2_direct: 443                                 # Hysteria2 прямой (entry → exit) — UDP/QUIC, 443 ок
#   hy2_warp: 8443                                  # Hysteria2 через Cloudflare WARP
#   hy2_mgmt: 8444                                  # Hysteria2 служебный (скрейп node_exporter из-за границы)
#   wireguard: 51820                                # входящий UDP; целое 1..65535
#   openvpn: 1194                                   # входящий UDP/TCP; целое 1..65535
# openvpn:
#   proto: udp       # udp | udp4 | udp6 | tcp | tcp4 | tcp6 |
#                    # tcp-server | tcp4-server | tcp6-server (TCP-синонимы)
# wireguard:
#   mtu: 1420        # 1280..9000; MTU клиента и MSS на сервере
#   split_local: true  # обход локальных сетей клиента для WG И OpenVPN;
#                      # false включает полный туннель
# После изменений: стадии 28-wireguard, 29-openvpn, 30-frontend на ru.
# Клиентам скачать конфиги заново; ключи перевыпускать не нужно.

# Бэкапы (в примере и мастере ВКЛЮЧЕНЫ с backend=local; без блока выключены).
# Архив включает: db.sqlite (через sqlite3 .backup), /etc/anysda/* (секреты
# панели и бота), WG server private key (/etc/wireguard/wg0.conf), OpenVPN
# CA + PKI (/etc/openvpn/server/pki/, server.conf, ccd/), IKEv2
# (/etc/strongswan/, /etc/swanctl/) + manifest.json
# с SHA-256 каждого компонента. Архив шифруется age (symmetric passphrase)
# на entry ДО записи на диск/выгрузки в S3 — plaintext .tar.gz никогда не
# покидает mktemp-dir и не остаётся в файловой системе.
#
# passphrase — единственный секрет. Потерял = бэкапы нечитаемы.
# ./setup.sh генерирует крепкий сам и пишет в config.yaml (chmod 600), как
# admin.password / root-пароли нод; на экран не выводится.
# При ручном заполнении config.yaml passphrase обязателен при enabled: true,
# иначе deploy остановится на проверке конфига.
# На компрометацию оркестратора — ротировать passphrase И re-encrypt
# существующие бэкапы (см. README §Backup & Disaster Recovery).
backup:
  enabled: true                # отключить — заменить true на false в этой строке
  backend: local               # local | s3
  passphrase: ""               # age symmetric passphrase; вручную — задать, ./setup.sh генерирует сам
  retention: 10                # keep last N; «последний успешный» защищён от удаления
  schedule: daily              # off | daily — с 02:00 по системной TZ entry, задержка до 5 мин
                               # (timedatectl), случайная задержка до 5 минут
  local:
    dir: /var/backups/anysda-vpn2

  # S3 — только если backend: s3. aws-cli ставится 26-backup, поддерживает любой
  # S3-совместимый endpoint: AWS, MinIO, Backblaze B2, Cloudflare R2, Yandex
  # Object Storage, Cloud.ru и т.д. Креды кладёт setup.sh, доставляет 26-backup
  # в /etc/anysda/backup.env (chmod 600), systemd читает через EnvironmentFile.
  # s3:
  #   endpoint: https://s3.eu-central-1.amazonaws.com
  #   bucket:   my-anysda-backups
  #   region:   eu-central-1     # ОБЯЗАТЕЛЕН для cloud.ru (ru-central-1),
  #                              # yandex (ru-central1), selectel (ru-1) и др.
  #                              # AWS — региона из endpoint (eu-central-1 и т.п.)
  #   access_key: ""
  #   secret_key: ""
