---
- name: Команда docker
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: base_docker

- name: Установка Docker
  when: not base_docker.stat.exists
  block:
    - name: Дистрибутив и архитектура узла
      ansible.builtin.setup:
        gather_subset: [min]

    - name: Каталог ключей apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Ключ источника Docker
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      register: base_docker_key
      until: base_docker_key is succeeded
      retries: 3
      delay: 10

    - name: Источник Docker
      ansible.builtin.copy:
        content: >
          deb [arch={{ base_docker_arch[ansible_facts.architecture] }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}
          {{ ansible_facts.distribution_release }} stable
        dest: /etc/apt/sources.list.d/docker.list
        mode: '0644'

    # Без рекомендуемых: rootless-extras, buildx и compose из пакетов узлу не
    # нужны, плагин compose ставит роль containers из выпуска.
    - name: Пакеты Docker
      ansible.builtin.apt:
        name: "{{ base_packages_docker }}"
        state: present
        update_cache: true
        install_recommends: false
        lock_timeout: 1200
      environment:
        NEEDRESTART_MODE: a
      register: base_apt
      until: base_apt is succeeded
      retries: 3
      delay: 10
