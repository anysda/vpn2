---
backup_infra: "{{ lookup('ansible.builtin.env', 'VPN2_INFRA') }}"
backup_tmp: /tmp/anysda
backup_venv: /opt/vpn2/venv
backup_vpn2: "{{ backup_venv }}/bin/vpn2"
backup_manifest: "{{ lookup('ansible.builtin.env', 'VPN2_RELEASE_MANIFEST') | default('/tmp/anysda/release-manifest.json', true) }}"
backup_development: "{{ lookup('ansible.builtin.env', 'VPN2_DEVELOPMENT') == 'true' }}"
# Клон, из которого идёт деплой: restore, backup и speedtest стоят вне клона
# и берут исходники по этой отметке.
backup_source_root: "{{ lookup('ansible.builtin.env', 'VPN2_SOURCE_ROOT') }}"

backup_enabled: "{{ lookup('ansible.builtin.env', 'BACKUP_ENABLED') == 'true' }}"
backup_backend: "{{ lookup('ansible.builtin.env', 'BACKUP_BACKEND') }}"
backup_local_dir: "{{ lookup('ansible.builtin.env', 'BACKUP_LOCAL_DIR') | default('/var/backups/anysda-vpn2', true) }}"
backup_retention: "{{ lookup('ansible.builtin.env', 'BACKUP_RETENTION') | default('10', true) }}"
backup_schedule: "{{ lookup('ansible.builtin.env', 'BACKUP_SCHEDULE') | default('off', true) }}"
backup_passphrase: "{{ lookup('ansible.builtin.env', 'BACKUP_PASSPHRASE') }}"
backup_s3:
  BACKUP_S3_ENDPOINT: "{{ lookup('ansible.builtin.env', 'BACKUP_S3_ENDPOINT') }}"
  BACKUP_S3_BUCKET: "{{ lookup('ansible.builtin.env', 'BACKUP_S3_BUCKET') }}"
  BACKUP_S3_ACCESS_KEY: "{{ lookup('ansible.builtin.env', 'BACKUP_S3_ACCESS_KEY') }}"
  BACKUP_S3_SECRET_KEY: "{{ lookup('ansible.builtin.env', 'BACKUP_S3_SECRET_KEY') }}"
backup_s3_region: "{{ lookup('ansible.builtin.env', 'BACKUP_S3_REGION') }}"

backup_packages: [age, expect, sqlite3]
backup_packages_s3: [unzip, curl, gnupg]
# Версия aws-cli v2 - из общего списка пинов; Ubuntu 24.04 убрала пакет awscli.
backup_aws_cli_version: "{{ (lookup('ansible.builtin.file', backup_infra ~ '/versions.yml') | from_yaml).aws_cli }}"
backup_aws_cli_url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-{{ backup_aws_cli_version }}.zip"
# Три команды на entry и то, что они берут с узла вне клона.
backup_commands: [anysda-backup.sh, anysda-restore.sh, anysda-backup-list.sh]
backup_node_lib:
  - lib/wg_conf.py
  - lib/anysda-svc.sh
  - ../app/shared/vpn-pools.json
