# Что законно добавляется к слепку первой установки до слепка повторного ./deploy.sh без изменений.
# Формат тот же, что у ignore.yml; сверка сценария «повторный деплой» берёт оба файла.

- {section: files, name: /var/lib/anysda-vpn2/db.sqlite, field: sha256, reason: панель между слепками работает и пишет в базу сама - события и проверка 99-verify; пересоздание контейнера ловят остальные поля}
- {section: files, name: /etc/anysda/exits-disabled.json, field: '*', reason: между слепками шаг стенда выключает и включает экзит - файл выключенных остаётся пустым списком}
- {section: files, name: /var/lib/vpn2-control/settings-disabled-exits.json, field: '*', reason: включение экзита из панели - запись control о применённой версии}
