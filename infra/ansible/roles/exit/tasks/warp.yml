---
# Сторож читает адрес пира WARP из конфига sing-box: placeholder на loopback
# значит, что WARP на узле нет, и сторож с таймером снимаются.
- name: Нужен ли сторож WARP
  ansible.builtin.command:
    argv: ["{{ exit_vpn2 }}", watchdog, warp, --enabled]
  register: exit_warp
  changed_when: false
  failed_when: false

- name: Сторож WARP и его таймер
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    mode: '0644'
  loop: [anysda-warp-watchdog.service, anysda-warp-watchdog.timer]
  when: exit_warp_enabled

# Состояние сторожа остаётся и без WARP: повторная установка не обнуляет лимиты перезапусков.
- name: Сторож WARP снят
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: [anysda-warp-watchdog.timer, anysda-warp-watchdog.service]
  failed_when: false
  when: not exit_warp_enabled

- name: Юниты сторожа WARP убраны
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: [/etc/systemd/system/anysda-warp-watchdog.timer, /etc/systemd/system/anysda-warp-watchdog.service]
  when: not exit_warp_enabled

- name: Файл сторожа прежних выпусков убран
  ansible.builtin.file:
    path: /usr/local/bin/anysda-warp-watchdog
    state: absent
