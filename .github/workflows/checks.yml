name: checks

on:
  push:
    branches-ignore: ['shots/**']
    tags: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: проверка shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -S error deploy.sh infra/deploy.sh setup.sh
      - name: мёртвые переменные и функции
        run: shellcheck -i SC2034,SC2317,SC2329 deploy.sh infra/deploy.sh setup.sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: мастер setup.sh на Python из Debian 12
        run: |
          python3 --version
          pip install --quiet pytest PyYAML
          PYTHONPATH=infra/vpn2/src python3 -m pytest infra/vpn2/tests/test_setup.py -p no:cacheprovider

  python-lint:
    name: линт Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: ruff
        run: git ls-files -z '*.py' | xargs -0 pipx run --spec ruff==0.17.4 ruff check --isolated --select E9,F,ARG,ERA
      - name: vulture
        run: git ls-files -z '*.py' | xargs -0 pipx run --spec vulture==2.16 vulture --min-confidence 0
      - run: pip install --quiet ./infra/vpn2
      - name: инвентарь на config.example.yaml
        run: |
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          cp config.example.yaml "$d/config.yaml"
          sed -i 's/^  passphrase: ""/  passphrase: ci pass/' "$d/config.yaml"
          export PYTHONPATH=infra/vpn2/src VPN2_CONFIG="$d/config.yaml" VPN2_STATE_DIR="$d/state"
          python3 -B infra/ansible/inventory.py --prepare
          python3 -B infra/ansible/inventory.py --env ru > "$d/ru.env"
          test -s "$d/ru.env"

  telegram:
    name: тесты бота
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: telegram/requirements.txt
      # zbarimg раскодирует PNG QR бота (test_qr_size.py).
      - name: zbarimg
        timeout-minutes: 5
        uses: ./.github/actions/apt-install
        with:
          packages: zbar-tools
      - name: регрессии Telegram-бота
        timeout-minutes: 10
        run: |
          python3 -m pip install -r telegram/requirements.txt
          # Модули в параллельных процессах; сумма тестов частей сверяется с найденной
          python3 infra/tests/run_parallel.py --dir telegram/tests
  backup-restore:
    name: 'бэкап: восстановление'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: образы для backup/restore и переноса ключей
        timeout-minutes: 5
        run: |
          docker build -q -t vpn2-backup-keys infra/tests &
          keys=$!
          docker build -q -t vpn2-backup-restore - <<'EOF'
          FROM debian:13
          RUN timeout 300 apt-get update -qq && timeout 300 apt-get install -y -qq --no-install-recommends \
            python3 python3-yaml sqlite3 age expect curl git wireguard-tools openssl iproute2
          EOF
          wait "$keys"
      - name: SQLite WAL, полный цикл backup/restore и перенос ключей на чистый хост
        # Копия и restore проверяют wg0.conf настоящим wg во временном netns, как
        # root на узле: нужны iproute2 и права на netns (меньше этих трёх не хватает).
        # Тесты пишут в пути узла, поэтому каждая доля идёт в своём контейнере.
        run: |
          out=$(mktemp -d)
          parts=4
          run() {
            docker run --rm -e VPN2_BACKUP_TEST=1 -e VPN2_BACKUP_SHARD="$1" -e VPN2_BACKUP_REPORT="/out/$2.json" \
              -v "$PWD:/src:ro" -v "$out:/out" \
              --cap-add NET_ADMIN --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
              vpn2-backup-restore python3 "/src/infra/tests/$3.py" /src > "$out/$2.log" 2>&1
          }
          pids=()
          for k in $(seq "$parts"); do
            run "$k/$parts" "backup-restore-$k" backup-restore &
            pids+=($!)
          done
          run 1/1 backup-clone-path backup-clone-path &
          pids+=($!)
          docker run --rm -v "$PWD:/repo:ro" vpn2-backup-keys > "$out/backup-keys.log" 2>&1 &
          pids+=($!)
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          for log in "$out"/*.log; do echo "===== $log"; cat "$log"; done
          python3 - "$out" "$parts" <<'EOF'
          import json, pathlib, sys
          reports = [json.loads(path.read_text()) for path in pathlib.Path(sys.argv[1]).glob('backup-restore-*.json')]
          shards = sorted(report['shard'] for report in reports)
          discovered = {report['discovered'] for report in reports}
          ran = sum(report['ran'] for report in reports)
          print(f'backup-restore parts: {shards}, tests={ran} of {sorted(discovered)}')
          sys.exit(shards != list(range(1, int(sys.argv[2]) + 1)) or len(discovered) != 1 or ran != discovered.pop())
          EOF
          exit "$failed"

  panel:
    name: линт панели
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: статическая аварийная панель и инструкция
        run: pnpm emergency:build
      # Плагин nuxt в knip читает .vue через vue/compiler-sfc; под pnpm vue не
      # лежит в корне node_modules, без NODE_PATH knip молча считает все
      # компоненты и composables мёртвыми.
      - name: knip
        env:
          NODE_PATH: ${{ github.workspace }}/app/node_modules/.pnpm/node_modules
        run: |
          pnpm dlx knip@6.44.2
          pnpm dlx knip@6.44.2 --production --exclude dependencies,unlisted,binaries

  panel-unit:
    name: unit-тесты панели
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: vitest
        run: pnpm test:unit

  # Выбор по путям - первым шагом каждого задания, без отдельного задания перед
  # ними: шарды и QR стартуют вместе с остальными проверками, а без зависимостей
  # панели проходят пустыми.
  # Набор делится по весам run-shards.py сразу на все панели всех заданий
  # (E2E_PART), в задании 4 панели запускателя; тяжёлые spec с весами по
  # тестам делятся по тестам. Каждое задание сверяет, что прогнало ровно свою
  # долю общего разбиения, вместе - каждый тест ровно один раз.
  panel-e2e-shard:
    name: 'e2e панели ${{ matrix.part }}/${{ strategy.job-total }}'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      run: ${{ steps.paths.outputs.run }}
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: изменения зависимостей панели
        id: paths
        run: |
          selected=$(python3 ../infra/tests/e2e_paths.py --github)
          echo "run=$selected" >> "$GITHUB_OUTPUT"
      # Образ панели и его vpn-слой собираются встроенным сборщиком docker в
      # фоне, пока ставятся pnpm, Node и зависимости: кэш gha на ветках полос
      # промахивался, а buildx с выгрузкой образа стоил ~65 с подряд.
      # run-local.sh пересобирает vpn-слой из локального кэша за секунды.
      - name: сборка образов панели в фоне
        if: steps.paths.outputs.run == 'true'
        run: |
          (
            rc=0
            docker build --progress=plain -t vpn2-panel:e2e . \
              && docker build --progress=plain --build-arg PANEL_IMAGE=vpn2-panel:e2e \
                -f e2e/Dockerfile.vpn -t vpn2-panel:e2e-vpn e2e || rc=$?
            echo "$rc" > "$RUNNER_TEMP/build.rc"
          ) > "$RUNNER_TEMP/build.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/build.pid"
      - if: steps.paths.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - if: steps.paths.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - if: steps.paths.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: загрузка браузерного образа, в фоне на время сборки панели
        if: steps.paths.outputs.run == 'true'
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          nohup docker pull -q "mcr.microsoft.com/playwright:v${version}-noble" > "$RUNNER_TEMP/browser-pull.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/browser-pull.pid"
      - name: сборка панели
        if: steps.paths.outputs.run == 'true'
        timeout-minutes: 10
        run: |
          pid=$(cat "$RUNNER_TEMP/build.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          cat "$RUNNER_TEMP/build.log"
          exit "$(cat "$RUNNER_TEMP/build.rc" 2>/dev/null || echo 1)"
      - name: браузерный образ загружен
        if: steps.paths.outputs.run == 'true'
        timeout-minutes: 5
        run: |
          pid=$(cat "$RUNNER_TEMP/browser-pull.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          version=$(node -p 'require("@playwright/test/package.json").version')
          docker image inspect "mcr.microsoft.com/playwright:v${version}-noble" >/dev/null \
            || { cat "$RUNNER_TEMP/browser-pull.log"; exit 1; }
      - name: сквозные тесты на собранном образе при смене сети хоста
        if: steps.paths.outputs.run == 'true'
        env:
          E2E_IP: sudo -n ip
          E2E_SKIP_BUILD: '1'
          E2E_SKIP_IMAGE_CHECKS: '1'
          E2E_SHARDS: '4'
          E2E_PART: ${{ matrix.part }}/${{ strategy.job-total }}
        run: python3 e2e/with-network-churn.py bash e2e/run-local.sh
      - name: отчёт и трейсы
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.part }}
          path: |
            app/playwright-report
            app/test-results
          retention-days: 14

  # Худший конфиг (вход 45.x, сплит) и панель без сплита, аварийка hy2 и бот:
  # qrencode рисует PNG аварийки, zbarimg раскодирует PNG. Здесь же один раз
  # проверки образа без браузера (e2e/image-checks.sh).
  panel-e2e-qr:
    name: e2e панели QR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      run: ${{ steps.paths.outputs.run }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: изменения зависимостей панели
        id: paths
        run: |
          selected=$(python3 ../infra/tests/e2e_paths.py --github)
          echo "run=$selected" >> "$GITHUB_OUTPUT"
      # Как в шардах: сборка в фоне без buildx; запись кэша gha mode=max
      # стоила здесь ~50 с.
      - name: сборка образов панели в фоне
        if: steps.paths.outputs.run == 'true'
        run: |
          (
            rc=0
            docker build --progress=plain -t vpn2-panel:e2e . || rc=$?
            echo "$rc" > "$RUNNER_TEMP/build.rc"
          ) > "$RUNNER_TEMP/build.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/build.pid"
      - if: steps.paths.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - if: steps.paths.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - if: steps.paths.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: загрузка браузерного образа, в фоне на время сборки панели
        if: steps.paths.outputs.run == 'true'
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          nohup docker pull -q "mcr.microsoft.com/playwright:v${version}-noble" > "$RUNNER_TEMP/browser-pull.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/browser-pull.pid"
      - name: qrencode и zbarimg для размера QR
        if: steps.paths.outputs.run == 'true'
        timeout-minutes: 5
        uses: ./.github/actions/apt-install
        with:
          packages: qrencode zbar-tools
      - name: сборка панели
        if: steps.paths.outputs.run == 'true'
        timeout-minutes: 10
        run: |
          pid=$(cat "$RUNNER_TEMP/build.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          cat "$RUNNER_TEMP/build.log"
          exit "$(cat "$RUNNER_TEMP/build.rc" 2>/dev/null || echo 1)"
      - name: браузерный образ загружен
        if: steps.paths.outputs.run == 'true'
        timeout-minutes: 5
        run: |
          pid=$(cat "$RUNNER_TEMP/browser-pull.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          version=$(node -p 'require("@playwright/test/package.json").version')
          docker image inspect "mcr.microsoft.com/playwright:v${version}-noble" >/dev/null \
            || { cat "$RUNNER_TEMP/browser-pull.log"; exit 1; }
      - name: размер QR на худшем конфиге
        if: steps.paths.outputs.run == 'true'
        timeout-minutes: 10
        env:
          E2E_SKIP_BUILD: '1'
          E2E_BASE_IMAGE: vpn2-panel:e2e
        run: bash e2e/qr-size.sh
      - name: проверки образа без браузера
        if: steps.paths.outputs.run == 'true'
        timeout-minutes: 5
        run: bash e2e/image-checks.sh vpn2-panel:qr
      - name: отчёт и трейсы
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-qr
          path: |
            app/playwright-report
            app/test-results
          retention-days: 14

  # Прежнее имя сводной проверки. Своего раннера на успехе не ждёт: при
  # зелёных шардах и QR пропущено (пропуск = зелёная проверка), очередь за
  # раннером на общем лимите аккаунта стоила до 3,5 мин. Красное, когда шард
  # или QR упали или отменены.
  panel-e2e:
    name: e2e панели итог
    needs: [panel-e2e-shard, panel-e2e-qr]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: шард или QR не прошли
        env:
          SHARD_RESULT: ${{ needs.panel-e2e-shard.result }}
          QR_RESULT: ${{ needs.panel-e2e-qr.result }}
        run: |
          echo "panel-e2e-shard=$SHARD_RESULT panel-e2e-qr=$QR_RESULT"
          exit 1
  vpn2-package:
    name: пакет vpn2 (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: openvpn, wireguard-tools, pki и qrencode для тестов пакета
        timeout-minutes: 5
        uses: ./.github/actions/apt-install
        with:
          packages: openvpn wireguard-tools strongswan-pki libstrongswan-standard-plugins qrencode
      - name: sing-box для самопроверки аварийки hy2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/^readonly SB_VER='\([^']*\)'/\1/p" infra/lib/install-sing-box.sh)
          checksum=$(sed -n "s/^readonly SB_SHA256_AMD64='\([^']*\)'/\1/p" infra/lib/install-sing-box.sh)
          test -n "$version" && test -n "$checksum"
          d="$RUNNER_TEMP/sing-box"
          mkdir -p "$d"
          python3 infra/tests/release_fetch.py SagerNet/sing-box "v${version}" \
            "sing-box-${version}-linux-amd64.tar.gz" "$d/sing-box.tar.gz" --sha256 "$checksum"
          tar -xzf "$d/sing-box.tar.gz" -C "$d" --strip-components=1
          "$d/sing-box" version
          echo "$d" >> "$GITHUB_PATH"
      # Тесты TLS и HTTPS панели гоняют Caddy той версии, что ставит деплой; releases/download
      # молчит до таймаута по 120 с, API релизов отдаёт тот же файл сразу.
      - name: Caddy для тестов панели
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/^CADDY_VER='\([^']*\)'/\1/p" infra/lib/anysda-svc.sh)
          test -n "$version"
          name="caddy_${version}_linux_amd64.tar.gz"
          d=$(mktemp -d)
          gh release download "v$version" -R caddyserver/caddy -D "$d" -p "$name" -p "caddy_${version}_checksums.txt"
          grep " $name\$" "$d/caddy_${version}_checksums.txt" | sed "s| $name\$| $d/$name|" | sha512sum --check --status
          cache="$HOME/.cache/vpn2-tests/caddy-$version"
          mkdir -p "$cache"
          tar -xzf "$d/$name" -C "$cache" caddy
          "$cache/caddy" version
      - run: pip install ./infra/vpn2 pytest pytest-xdist pytest-cov jinja2
      - run: vpn2 version
      - name: pytest
        env:
          # Покрытие - на одной версии Python.
          COVERAGE: ${{ matrix.python == '3.14' && '--cov --cov-config=infra/vpn2/tests/coverage.ini --cov-fail-under=72' || '' }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086
          python -m pytest infra/vpn2/tests -q -n auto --dist loadgroup -rs $COVERAGE | tee /tmp/pytest.log
          # Тест без openvpn, wg, Caddy или sudo пропускается: в CI это отказ, а не зелёный прогон.
          ! grep -E 'SKIPPED.*(needs |cannot be made here)' /tmp/pytest.log

  # Роли и то, что из них выходит: шаблоны рисует настоящий ansible, пробы в своём
  # сетевом пространстве гоняют sing-box. Две части набора infra/tests, каждая сверяет,
  # что прогнала ровно свою долю.
  ansible:
    name: 'роли ansible ${{ matrix.part }}/2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    env:
      ANSIBLE_CONFIG: infra/ansible/ansible.cfg
      ANSIBLE_COLLECTIONS_PATH: /tmp/collections
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: зависимости инфраструктуры
        timeout-minutes: 5
        uses: ./.github/actions/apt-install
        with:
          packages: strongswan-pki libstrongswan-standard-plugins wireguard-tools openvpn apache2-utils nftables iptables iproute2 qrencode zbar-tools
      - run: pip install -c infra/ansible/constraints.txt ansible-core PyYAML Jinja2
        timeout-minutes: 5
      - name: syntax-check и ansible-lint
        if: matrix.part == 1
        timeout-minutes: 5
        run: |
          pip install -c infra/ansible/constraints.txt ansible-lint==26.10.1
          ansible-galaxy collection install -r infra/ansible/requirements.yml -p /tmp/collections
          ansible-playbook -i localhost, --syntax-check infra/ansible/site.yml
          ansible-lint --profile production --offline --project-dir infra/ansible infra/ansible/site.yml infra/ansible/roles
      # Пробы в своём сетевом пространстве идут от root без сети: venv ansible тестов
      # строится заранее и для root, на системном python, как на узле деплоя.
      - name: ansible тестов
        timeout-minutes: 5
        run: |
          warm='import sys; sys.path.insert(0, "infra/tests"); import vpn_roles; vpn_roles.ansible_playbook()'
          /usr/bin/python3 -c "$warm"
          sudo -n /usr/bin/python3 -c "$warm"
          sudo -n bash -c '/root/.cache/vpn2-tests/ansible-*/bin/ansible-playbook --version'
      - name: регрессии ролей, маршрутов и sing-box
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          version=$(sed -n "s/^readonly SB_VER='\([^']*\)'/\1/p" infra/lib/install-sing-box.sh)
          test -n "$version"
          checksum=$(sed -n "s/^readonly SB_SHA256_AMD64='\([^']*\)'/\1/p" infra/lib/install-sing-box.sh)
          test -n "$checksum"
          # releases/download бывает 504, тогда тот же файл берётся через API релизов
          python3 infra/tests/release_fetch.py SagerNet/sing-box "v${version}" \
            "sing-box-${version}-linux-amd64.tar.gz" "$d/sing-box.tar.gz" --sha256 "$checksum"
          printf '%s  %s\n' "$checksum" "$d/sing-box.tar.gz" | sha256sum --check --status
          tar -xzf "$d/sing-box.tar.gz" -C "$d"
          export SING_BOX_BIN="$d/sing-box-${version}-linux-amd64/sing-box"
          export RUN_NETNS_TESTS=1
          "$SING_BOX_BIN" version
