---
- name: Ресурсы юнитов аварийки
  ansible.builtin.include_role:
    name: resources
  vars:
    resources_units: "{{ emergency_services }}"

- name: Службы аварийки включены
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    enabled: true
    daemon_reload: "{{ emergency_unit is changed }}"
  loop: "{{ emergency_services }}"

# Перезапуск только при смене входов службы: пакета, юнита с его drop-in,
# состава аварийки. Идущую аварию повторный деплой без правок не трогает.
- name: Службы аварийки идут с текущими входами
  ansible.builtin.command:
    argv: "{{ emergency_bash + [emergency_restart_step, emergency_tmp, item, emergency_package_mark, emergency_etc ~ '/agent.json'] }}"
  loop: "{{ emergency_services }}"
  environment: "{{ emergency_env }}"
  register: emergency_service_run
  changed_when: "'changed=1' in emergency_service_run.stdout"

# Копии пакета прежних выпусков рядом с аварийкой: службы уже идут из venv.
- name: Копии пакета прежних выпусков убраны
  ansible.builtin.file:
    path: "{{ emergency_home }}/{{ item }}"
    state: absent
  loop: [vpn2, vpn2_emergency]

# Docker нужен экзиту только на время деплоя, дальше его поднимает docker.socket
# по запросу. Службу запустил шаг статики этого же прогона, поэтому её
# остановка изменением не считается.
- name: Docker экзита остановлен до следующего деплоя
  ansible.builtin.command:
    argv: "{{ emergency_bash + [emergency_docker_idle] }}"
  vars:
    emergency_docker_idle: |
      systemctl disable --now docker.service containerd.service >/dev/null 2>&1
      systemctl enable --now docker.socket >/dev/null 2>&1
  when: not emergency_entry
  changed_when: false

# Слово image говорит проверке узла, что здесь ждут release.json и запасной Hysteria2.
- name: Отметка стадии
  ansible.builtin.copy:
    content: "image {{ emergency_image }}\n"
    dest: /var/anysda/.stamps/23-emergency
    mode: '0644'

# Verify узнаёт пройденную стадию по времени отметки: оно должно быть новее
# штампа 10-foreign и после повторного деплоя, когда образ прежний.
- name: Время отметки стадии
  ansible.builtin.file:
    path: /var/anysda/.stamps/23-emergency
    state: touch
    mode: '0644'
  changed_when: false
