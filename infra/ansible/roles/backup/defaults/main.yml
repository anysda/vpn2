---
backup_infra: "{{ vpn2_env.VPN2_INFRA | default('') }}"
backup_venv: /opt/vpn2/venv
backup_vpn2: "{{ backup_venv }}/bin/vpn2"
backup_manifest: "{{ vpn2_env.VPN2_RELEASE_MANIFEST | default('/tmp/anysda/release-manifest.json', true) }}"
backup_development: "{{ vpn2_env.VPN2_DEVELOPMENT | default('') == 'true' }}"
# Клон, из которого идёт деплой: restore, backup и speedtest стоят вне клона
# и берут исходники по этой отметке.
backup_source_root: "{{ vpn2_env.VPN2_SOURCE_ROOT | default('') }}"

backup_enabled: "{{ vpn2_env.BACKUP_ENABLED | default('') == 'true' }}"
backup_backend: "{{ vpn2_env.BACKUP_BACKEND | default('') }}"
backup_local_dir: "{{ vpn2_env.BACKUP_LOCAL_DIR | default('/var/backups/anysda-vpn2', true) }}"
backup_retention: "{{ vpn2_env.BACKUP_RETENTION | default('10', true) }}"
backup_schedule: "{{ vpn2_env.BACKUP_SCHEDULE | default('off', true) }}"
backup_passphrase: "{{ vpn2_env.BACKUP_PASSPHRASE | default('') }}"
backup_s3:
  BACKUP_S3_ENDPOINT: "{{ vpn2_env.BACKUP_S3_ENDPOINT | default('') }}"
  BACKUP_S3_BUCKET: "{{ vpn2_env.BACKUP_S3_BUCKET | default('') }}"
  BACKUP_S3_ACCESS_KEY: "{{ vpn2_env.BACKUP_S3_ACCESS_KEY | default('') }}"
  BACKUP_S3_SECRET_KEY: "{{ vpn2_env.BACKUP_S3_SECRET_KEY | default('') }}"
backup_s3_region: "{{ vpn2_env.BACKUP_S3_REGION | default('') }}"

backup_packages: [age, sqlite3]
backup_packages_s3: [rclone]
# Три команды на entry и то, что restore берёт с узла вне клона.
backup_commands:
  - {name: anysda-backup.sh, command: backup}
  - {name: anysda-restore.sh, command: restore}
  - {name: anysda-backup-list.sh, command: backup-list}
backup_node_lib: [lib/anysda-svc.sh, ../app/shared/vpn-pools.json]
