---
# AdGuard Home на entry: слушает 127.0.0.1 и служебный адрес, клиенты туннелей
# спрашивают его напрямую. Веб-интерфейс и API только на loopback, для панели.
# Второй экземпляр на 127.0.0.2 отвечает без фильтров.
- name: Команда vpn2
  ansible.builtin.stat:
    path: "{{ adguard_vpn2 }}"
  register: adguard_vpn2_stat
  failed_when: not (adguard_vpn2_stat.stat.executable | default(false))

- name: Бинарник AdGuard Home
  ansible.builtin.command:
    argv: "{{ adguard_step + ['binary'] }}"
  environment: "{{ adguard_env }}"
  register: adguard_binary
  changed_when: "'changed=1' in adguard_binary.stdout"

- name: Библиотека ресурсов
  ansible.builtin.copy:
    src: "{{ adguard_infra }}/lib/{{ item }}"
    dest: "{{ adguard_tmp }}/"
    mode: '0644'
  loop: [entry-resources.sh, entry_resources.py]
  changed_when: false

- name: Пулы адресов клиентов
  ansible.builtin.copy:
    src: "{{ adguard_infra }}/../app/shared/vpn-pools.json"
    dest: "{{ adguard_tmp }}/vpn-pools.json"
    mode: '0644'
  changed_when: false

# Живой конфиг целиком не перезаписывается: его правят в панели и сам AdGuard.
# Сменился - экземпляр останавливается до публикации и стартует шагом ниже.
- name: Учётная запись и конфиги AdGuard
  ansible.builtin.command:
    argv: "{{ adguard_step + ['config'] }}"
  environment: "{{ adguard_env }}"
  register: adguard_config
  changed_when: "'changed=1' in adguard_config.stdout"

# AdGuard создаёт DoH-сокеты локально, клиентский PREROUTING их не видит:
# TCP/443 до Cloudflare и Google уходит в redirect sing-box.
- name: Маршрут DoH через роутер
  ansible.builtin.copy:
    src: anysda-doh-routing
    dest: /usr/local/sbin/anysda-doh-routing
    mode: '0755'

- name: Юнит маршрута DoH
  ansible.builtin.copy:
    src: anysda-doh-routing.service
    dest: /etc/systemd/system/anysda-doh-routing.service
    mode: '0644'

- name: Ресурсы юнита маршрута DoH
  ansible.builtin.command:
    argv:
      - /bin/bash
      - --norc
      - -euo
      - pipefail
      - -c
      - 'source "$0/entry-resources.sh"; entry_unit_resources "$1"; echo "changed=$ENTRY_DROPIN_CHANGED"'
      - "{{ adguard_tmp }}"
      - anysda-doh-routing
  environment:
    ENTRY_RESOURCE_OVERRIDES: "{{ vpn2_env.ENTRY_RESOURCE_OVERRIDES | default('') }}"
  register: adguard_resources
  changed_when: "'changed=1' in adguard_resources.stdout"

- name: Лимиты памяти по ресурсам entry
  ansible.builtin.command:
    argv: "{{ adguard_step + ['limits'] }}"
  environment: "{{ adguard_env }}"
  register: adguard_limits_json
  changed_when: false

- name: Юниты AdGuard
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    mode: '0644'
  vars:
    adguard_limits: "{{ adguard_limits_json.stdout | from_json }}"
  loop: [adguardhome, adguardhome-unfiltered]

- name: Службы AdGuard включены
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop: [anysda-doh-routing, adguardhome, adguardhome-unfiltered]

# Правила возвращаются и после внешнего сброса firewall.
- name: Правила DoH применены
  ansible.builtin.command:
    argv: [/usr/local/sbin/anysda-doh-routing]
  changed_when: false

- name: Маршрут DoH запущен
  ansible.builtin.systemd_service:
    name: anysda-doh-routing
    state: started

- name: AdGuard запущен с текущими входами
  ansible.builtin.command:
    argv: "{{ adguard_step + ['restart'] }}"
  register: adguard_restart
  changed_when: "'changed=1' in adguard_restart.stdout"

- name: Правила ufw прежней mesh-сети убраны
  ansible.builtin.command:
    argv: "{{ adguard_step + ['legacy'] }}"
  environment: "{{ adguard_env }}"
  register: adguard_legacy
  changed_when: "'changed=1' in adguard_legacy.stdout"

- name: Отметка стадии
  ansible.builtin.copy:
    content: ''
    dest: /var/anysda/.stamps/22-adguard
    force: false
    mode: '0644'
