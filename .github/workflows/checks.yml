name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S error $(git ls-files '*.sh')
      - name: мёртвые переменные и функции
        run: shellcheck -i SC2034,SC2317,SC2329 $(git ls-files '*.sh')

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ruff
        run: pipx run --spec ruff==0.13.3 ruff check --isolated --select E9,F,ARG,ERA $(git ls-files '*.py')
      - name: vulture
        run: pipx run --spec vulture==2.14 vulture --min-confidence 0 $(git ls-files '*.py')
      - name: config2env на config.example.yaml
        run: |
          d=$(mktemp -d)
          cp config.example.yaml "$d/config.yaml"
          python3 infra/lib/config2env.py "$d"
          test -s "$d/infra/envs/all.env"

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm lint
      # Плагин nuxt в knip читает .vue через vue/compiler-sfc; под pnpm vue не
      # лежит в корне node_modules, без NODE_PATH knip молча считает все
      # компоненты и composables мёртвыми.
      - name: knip
        env:
          NODE_PATH: ${{ github.workspace }}/app/node_modules/.pnpm/node_modules
        run: |
          pnpm dlx knip@6.39.0
          pnpm dlx knip@6.39.0 --production --exclude dependencies,unlisted,binaries
