name: stand

# Деплой dev на стенд из двух ВМ внутри раннера (матрица Ubuntu 24.04 и 26.04)
# и 99-verify с настоящим трафиком WireGuard/OpenVPN/IKEv2, затем слепок
# хоста сверяется с эталоном из репы; рядом на своём стенде - обрыв UDP
# entry → экзит. Две задачи идут параллельно, прогон - до 5 минут.
# Запускается на dev и вручную, не на каждый PR.
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      stop_openvpn:
        description: 'Отрицательный контроль: остановить OpenVPN на entry перед проверкой'
        type: boolean
        default: false
      break_tcp_fallback:
        description: 'Отрицательный контроль: при обрыве UDP резать и запасной TCP до экзита'
        type: boolean
        default: false
      snapshot_reason:
        description: 'Пересъёмка эталона слепка: причина'
        type: string
        default: ''
      snapshot_corrupt:
        description: 'Положительный контроль: испортить файл на entry перед слепком'
        type: boolean
        default: false
      backup_fixture:
        description: 'Снять эталонный архив бэкапа в артефакт'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stand-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: стенд развёртывание Ubuntu ${{ matrix.os }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ['24.04', '26.04']
    env:
      STAND_OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Пакеты ВМ - через прокси apt на раннере; его каталог живёт между ранами.
      # До up: прокси поднимается до запуска ВМ, их прогрев идёт через него.
      - name: apt cache
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: /var/tmp/vpn2-apt-cache
          key: stand-apt-${{ matrix.os }}-${{ hashFiles('deploy.sh', 'infra/scripts/*.sh', 'infra/lib/*.sh') }}
          restore-keys: stand-apt-${{ matrix.os }}-

      # ВМ грузятся, пока собирается образ панели. STAND_OS sudo сам не передаёт.
      - name: up (фоном)
        run: sudo --preserve-env=STAND_OS infra/tools/ci-stand.sh up-bg

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      # Панель из этого же коммита. Кэш gha ветке виден только свой и main,
      # поэтому dev - через реестр (пишет images.yml): первая сборка ветки тёплая.
      - name: panel image
        uses: docker/build-push-action@v7
        with:
          context: app
          platforms: linux/amd64
          load: true
          tags: vpn2-stand/panel:${{ github.sha }}
          cache-from: |
            type=gha,scope=panel-stand
            type=gha,scope=checks-panel
            type=registry,ref=ghcr.io/${{ github.repository }}/panel:buildcache-dev
            type=gha,scope=panel
          cache-to: type=gha,mode=max,scope=panel-stand

      - name: up
        id: up
        run: sudo infra/tools/ci-stand.sh up-wait

      # Полный деплой сам кончается 99-verify всех узлов.
      - name: deploy
        run: sudo infra/tools/ci-stand.sh deploy vpn2-stand/panel:${{ github.sha }}

      # Отрицательный контроль: 99-verify при остановленном OpenVPN обязан упасть.
      - name: verify
        if: ${{ inputs.stop_openvpn && !cancelled() && steps.up.outcome == 'success' }}
        run: sudo infra/tools/ci-stand.sh verify --stop-openvpn

      # Положительный контроль: сверка слепка с эталоном после этого обязана упасть.
      - name: snapshot corrupt
        if: ${{ inputs.snapshot_corrupt }}
        run: sudo infra/tools/ci-stand.sh snapshot-corrupt

      # Слепки в stand-report: collect проверяет их на пароль стенда, а
      # артефакт отчёта их отдаёт.
      - name: snapshot
        run: sudo infra/tools/ci-stand.sh snapshot stand-report

      - name: venv
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q ./infra/vpn2

      # Оба узла сверяются всегда: красный шаг - если разошёлся хоть один
      # или эталона нет.
      - name: snapshot diff
        if: ${{ inputs.snapshot_reason == '' }}
        run: |
          rc=0
          for node in entry exit; do
            ref=infra/tests/fixtures/snapshot/ubuntu-$STAND_OS-$node.json.gz
            if [[ ! -f $ref ]]; then
              echo "эталона нет: $ref"
              rc=1
              continue
            fi
            "$RUNNER_TEMP/venv/bin/vpn2" snapshot diff --ignore infra/tests/fixtures/snapshot/ignore.yml \
              "$ref" "stand-report/snapshot-$node.json" || rc=1
          done
          exit "$rc"

      # Пересъёмка: сверки нет, слепки уходят артефактом под именами эталонов.
      # В репу CI их не коммитит. stand-report принадлежит root, поэтому
      # сжатое кладётся в свой каталог.
      - name: snapshot reference
        if: ${{ inputs.snapshot_reason != '' }}
        env:
          SNAPSHOT_REASON: ${{ inputs.snapshot_reason }}
        run: |
          echo "Пересъёмка эталона слепка Ubuntu $STAND_OS, причина: $SNAPSHOT_REASON"
          mkdir snapshot-ref
          for node in entry exit; do
            gzip -n -c "stand-report/snapshot-$node.json" > "snapshot-ref/ubuntu-$STAND_OS-$node.json.gz"
          done

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.snapshot_reason != '' }}
        with:
          name: snapshot-ubuntu-${{ matrix.os }}
          path: snapshot-ref/
          if-no-files-found: error

      # Сценарий 2 карточки: слепок до и после повторного ./deploy.sh одинаков.
      - name: повторный деплой
        run: sudo infra/tools/ci-stand.sh deploy-again stand-report

      - name: "повторный деплой: слепок тот же"
        run: |
          rc=0
          for node in entry exit; do
            "$RUNNER_TEMP/venv/bin/vpn2" snapshot diff --ignore infra/tests/fixtures/snapshot/ignore.yml \
              "stand-report/snapshot-$node.json" "stand-report/snapshot-again-$node.json" || rc=1
          done
          exit "$rc"

      # Сценарий 5 карточки. /health на паузе не проверяется до VPN2-794.
      - name: бот с поддельным токеном
        run: sudo infra/tools/ci-stand.sh bot-fake-token

      - name: эталонный архив бэкапа
        if: ${{ inputs.backup_fixture }}
        run: sudo infra/tools/ci-stand.sh backup-fixture backup-fixture && sudo chown -R "$USER" backup-fixture

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.backup_fixture }}
        with:
          name: backup-fixture-ubuntu-${{ matrix.os }}
          path: backup-fixture/
          if-no-files-found: error

      - name: collect
        if: always()
        run: sudo infra/tools/ci-stand.sh collect stand-report && sudo chown -R "$USER" stand-report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-report-ubuntu-${{ matrix.os }}
          path: stand-report/
          if-no-files-found: warn

      - name: down
        if: always()
        run: sudo infra/tools/ci-stand.sh down

      - name: apt cache save
        if: ${{ always() && steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /var/tmp/vpn2-apt-cache
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

  # Обрыв UDP entry → экзит: трафик уходит на запасной TCP без перезапуска
  # sing-box и возвращается на Hysteria2. Стенд только из нужных стадий.
  udp-cut:
    name: стенд обрыв UDP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Пакеты ВМ - через прокси apt на раннере; его каталог живёт между ранами.
      # Узлы обрыва - Ubuntu 26.04: кэш общий с развёртыванием 26.04.
      - name: apt cache
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: /var/tmp/vpn2-apt-cache
          key: stand-apt-26.04-${{ hashFiles('deploy.sh', 'infra/scripts/*.sh', 'infra/lib/*.sh') }}
          restore-keys: stand-apt-26.04-

      - name: up
        id: up
        run: sudo infra/tools/ci-stand.sh up

      - name: deploy
        run: sudo infra/tools/ci-stand.sh deploy-udp

      - name: udp-cut
        run: sudo infra/tools/ci-stand.sh udp-cut ${{ inputs.break_tcp_fallback && '--break-tcp-fallback' || '' }}

      - name: collect
        if: always()
        run: sudo infra/tools/ci-stand.sh collect stand-report && sudo chown -R "$USER" stand-report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: udp-cut-report
          path: stand-report/
          if-no-files-found: warn

      - name: down
        if: always()
        run: sudo infra/tools/ci-stand.sh down

      - name: apt cache save
        if: ${{ always() && steps.apt-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: /var/tmp/vpn2-apt-cache
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
