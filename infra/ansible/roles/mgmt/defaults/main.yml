---
mgmt_entry: "{{ inventory_hostname == 'ru' }}"
mgmt_infra: "{{ lookup('ansible.builtin.env', 'VPN2_INFRA') }}"
mgmt_tmp: /tmp/anysda
# Локальный служебный адрес entry: на него завязаны clash-api sing-box,
# AdGuard, панель и сторожа. Границу он не пересекает.
mgmt_ip: "{{ lookup('ansible.builtin.env', 'MGMT_IP') | default('10.99.0.1', true) }}"
mgmt_port: "{{ lookup('ansible.builtin.env', 'MGMT_PORT') | default('51900', true) }}"
