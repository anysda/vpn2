---
# Сервер OpenVPN на tun0: EC PKI (CA, сертификат сервера, tls-crypt). Панель
# выпускает и отзывает сертификаты клиентов этим CA и ведёт ccd.
- name: Каталог отметок стадий
  ansible.builtin.file:
    path: /var/anysda/.stamps
    state: directory
    mode: '0755'

- name: Протокол OpenVPN поддержан
  ansible.builtin.assert:
    that: openvpn_proto in openvpn_protocols
    fail_msg: "unsupported OpenVPN protocol: {{ openvpn_proto }}"
    quiet: true

- name: Пакеты openvpn и openssl
  ansible.builtin.apt:
    name: [openvpn, openssl]
    state: present
    lock_timeout: 1200
  register: openvpn_apt
  until: openvpn_apt is succeeded
  retries: 3
  delay: 10

# Комплект собирается в копии и подменяет прежний целиком; действующие ключи не перевыпускаются.
- name: Каталоги сервера и комплект PKI
  ansible.builtin.command:
    argv: "{{ openvpn_host + ['ovpn-pki'] }}"
  environment: "{{ openvpn_env }}"
  register: openvpn_step
  changed_when: "'vpn2: changed' in openvpn_step.stdout"

- name: Управление панели через службу
  ansible.builtin.stat:
    path: /etc/vpn2-control/api-managed
  register: openvpn_api_managed

- name: Конфиг server.conf
  ansible.builtin.template:
    src: server.conf.j2
    dest: "{{ openvpn_dir }}/server.conf"
    mode: '0644'

- name: Пересылка пакетов между интерфейсами
  ansible.builtin.command:
    cmd: sysctl -w net.ipv4.ip_forward=1
  changed_when: false

- name: Порт OpenVPN и DNS клиентов в ufw
  ansible.builtin.command:
    argv: "{{ openvpn_host + ['ufw', '--only-rules', openvpn_ufw | to_json] }}"
  environment: "{{ openvpn_env }}"
  register: openvpn_step
  changed_when: "'vpn2: changed' in openvpn_step.stdout"

- name: Служба openvpn-server@server включена
  ansible.builtin.systemd_service:
    name: openvpn-server@server
    enabled: true

- name: Ресурсы сервера OpenVPN
  ansible.builtin.include_role:
    name: resources
  vars:
    resources_units: [openvpn-server@server]

# Рестарт рвёт всех клиентов: только при смене конфига, сертификатов или бинарника.
- name: Сервер OpenVPN запущен с текущими входами
  ansible.builtin.command:
    argv: "{{ openvpn_host + ['ovpn-restart'] }}"
  environment: "{{ openvpn_env }}"
  register: openvpn_step
  changed_when: "'vpn2: changed' in openvpn_step.stdout"

# MSS 1340: путь с MTU 1440 минус оверхед OpenVPN; mssfix при DCO не работает.
- name: Маршрутизация tun0
  ansible.builtin.include_role:
    name: wireguard
    tasks_from: routing
  vars:
    routing: {unit: anysda-ovpn-routing, iface: tun0, chain: ANYSDA_OVPN_TPROXY, mss: 1340,
              after: openvpn-server@server.service}

- name: Отметка стадии
  ansible.builtin.copy:
    content: ''
    dest: /var/anysda/.stamps/29-openvpn
    force: false
    mode: '0644'
