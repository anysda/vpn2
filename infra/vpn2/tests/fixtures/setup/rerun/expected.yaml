# Keep this comment
entry:
  host: '192.0.2.1'
  password: 'new entry password' # entry credential
  public_host: 192.0.2.11 # public endpoint
exits:
  - tag: se
    host: '192.0.2.3'
    password: 'new exit password' # exit credential
    hy2_direct_port: 5443 # selected for this exit
admin:
  user: 'newadmin' # panel login
  password: 'new password'
  ssh_pubkey: ''
ports:
  hy2_direct: 4443 # keep this port
panel:
  domain: ''
  image: example/panel:pinned
sso:
  label: MyProvider
  allowed_subs: 'alice,bob'
backup:
  enabled: true
  retention: 42
  local:
    dir: /srv/archives # custom directory
  s3:
    bucket: saved-bucket
  backend: local
  passphrase: 'new backup password'
  schedule: 'off'

youtube:
  route: 'zapret'
  quic: allow
telegram:
  bot_token: ''
  chat_id: ''
  admin_username: ''

