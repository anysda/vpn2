name: images

on:
  push:
    branches: [dev, main]
    tags: ['v*']
    paths:
      - app/**
      - telegram/**
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: panel
            context: app
          - name: tgbot
            context: telegram
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          tags: smoke/${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}

      # Образ, который не стартует, в реестр не уезжает: нода стянет его при деплое.
      - name: smoke panel
        if: matrix.name == 'panel'
        run: |
          docker run -d --name smoke -p 51821:51821 smoke/panel
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:51821/api/version && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: smoke tgbot
        if: matrix.name == 'tgbot'
        run: >
          docker run --rm --entrypoint python smoke/tgbot -c
          "import ast, telegram, aiohttp, qrcode; ast.parse(open('bot.py').read())"

      - name: push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Digest в аннотации: логи прогона без токена закрыты, а аннотации
      # публичны — по ним сверяют то, что нода стянула, с тем, что собрали.
      - name: digest
        run: echo "::notice title=${{ matrix.name }}:${{ steps.meta.outputs.version }}::${{ steps.push.outputs.digest }}"
