---
- name: Каталоги состояния
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: [/var/anysda/.stamps, /etc/anysda, /var/lib/anysda, /etc/systemd/networkd.conf.d]

# Рабочий каталог стадий - не состояние узла: на экзите деплой стирает его
# после каждой стадии, и он живёт в /tmp до перезагрузки.
- name: Рабочий каталог стадий
  ansible.builtin.file:
    path: "{{ base_tmp }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  changed_when: false

- name: Колесо vpn2 экзита
  ansible.builtin.copy:
    src: "{{ base_wheel }}"
    dest: "{{ base_tmp }}/"
    mode: '0644'
  when: not base_entry
  changed_when: false

# Остановка юнита nftables иначе сносит таблицы ufw, маршрутизации, Docker и fail2ban.
- name: Каталог настроек юнита nftables
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    mode: '0755'

- name: Остановка юнита nftables не трогает чужие таблицы
  ansible.builtin.copy:
    src: 10-anysda-preserve.conf
    dest: /etc/systemd/system/nftables.service.d/10-anysda-preserve.conf
    mode: '0644'
  register: base_nft_dropin

- name: Systemd перечитал юнит nftables  # noqa: no-handler
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: base_nft_dropin is changed

- name: Конфиг nftables не сбрасывает чужие таблицы
  ansible.builtin.command:
    argv: "{{ base_host + ['nft-preserve'] }}"
  register: base_step
  changed_when: "'vpn2: changed' in base_step.stdout"

# esm-cache при каждом apt ходит к esm.ubuntu.com и виснет, когда тот недоступен,
# а apt через needrestart его ждёт. Узлу VPN кэш ESM не нужен.
- name: Маска esm-cache
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: systemctl mask --now esm-cache.service
    creates: /etc/systemd/system/esm-cache.service
  failed_when: false

- name: Swap узлу с памятью меньше 4 ГБ
  ansible.builtin.command:
    argv: "{{ base_host + ['swap', '--manifest', base_manifest, '--install-bytes', base_swap_install_bytes | string] }}"
  register: base_step
  changed_when: "'vpn2: changed' in base_step.stdout"

# Чужой apt (unattended-upgrades первого часа жизни VPS) держит замок dpkg:
# его ждём до 20 минут, сбой зеркала повторяем.
- name: Пакеты одним заходом apt
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 1200
  environment:
    NEEDRESTART_MODE: a
  register: base_apt
  until: base_apt is succeeded
  retries: 3
  delay: 10

- name: Docker из официального источника
  ansible.builtin.import_tasks: docker.yml
  when: base_entry

- name: Конфиг nftables из пакета не сбрасывает чужие таблицы
  ansible.builtin.command:
    argv: "{{ base_host + ['nft-preserve'] }}"
  register: base_step
  changed_when: "'vpn2: changed' in base_step.stdout"

- name: Docker включён
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  when: base_entry
  failed_when: false

- name: Venv vpn2 экзита из колеса
  ansible.builtin.command:
    argv: "{{ base_host + ['venv', base_tmp ~ '/' ~ (base_wheel | basename)] }}"
  when: not base_entry
  register: base_step
  changed_when: "'vpn2: changed' in base_step.stdout"

- name: Настройки ядра
  ansible.builtin.copy:
    src: 99-anysda.conf
    dest: /etc/sysctl.d/99-anysda.conf
    mode: '0644'
  register: base_sysctl

# Не обработчиком: оборванный плей оставил бы файл без применения.
- name: Настройки ядра применены  # noqa: no-handler
  ansible.builtin.command:
    cmd: sysctl --quiet --system
  when: base_sysctl is changed
  changed_when: true

# networkd при перезапуске сносит чужие ip rule и маршруты, в том числе
# fwmark 0x42 -> table 101, на которой держится TPROXY клиентов. Файл читается
# при следующем старте networkd, перезапускать его не нужно.
- name: Файлы очереди WAN, networkd и node_exporter
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - {src: anysda-fq, dest: /usr/local/sbin/anysda-fq, mode: '0755'}
    - {src: 60-anysda-foreign.conf, dest: /etc/systemd/networkd.conf.d/60-anysda-foreign.conf}
    - {src: node_exporter.service, dest: /etc/systemd/system/node_exporter.service}

- name: Юнит очереди WAN
  ansible.builtin.template:
    src: anysda-fq.service.j2
    dest: /etc/systemd/system/anysda-fq.service
    mode: '0644'

- name: Ресурсы юнитов
  ansible.builtin.include_role:
    name: resources
  vars:
    resources_units: [anysda-fq, node_exporter]

- name: Очередь WAN включена
  ansible.builtin.systemd_service:
    name: anysda-fq
    enabled: true
    state: started
    daemon_reload: true

- name: Очередь WAN выставлена
  ansible.builtin.command:
    argv: [/usr/local/sbin/anysda-fq, "{{ base_wan_qdisc }}"]
  register: base_step
  changed_when: "'->' in base_step.stdout"

- name: Ключи оркестратора и админа
  ansible.posix.authorized_key:
    user: root
    key: "{{ base_keys | join('\n') }}"
  when: base_keys | length > 0

# Ключ entry для ssh через служебный hy2-туннель. Опознаётся по комментарию:
# пересозданная entry вытесняет прежний ключ. Туннель отдаёт соединение sshd
# с 127.0.0.1, поэтому from= не пускает этот ключ с публичного адреса.
- name: Ключ entry для служебного туннеля
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    regexp: ' anysda-entry-mgmt$'
    line: 'from="127.0.0.1,::1" {{ base_entry_mgmt_key.splitlines() | first | trim }}'
    create: true
    mode: '0600'
  when: not base_entry and base_entry_mgmt_key | trim | length > 0

- name: Вход по ssh
  ansible.builtin.import_tasks: sshd.yml

- name: Фаервол ufw
  ansible.builtin.command:
    argv: "{{ base_host + ['ufw', base_ufw | to_json] }}"
  register: base_step
  changed_when: "'vpn2: changed' in base_step.stdout"

- name: Fail2ban и node_exporter
  ansible.builtin.import_tasks: services.yml

- name: Отметка стадии
  ansible.builtin.copy:
    content: ''
    dest: /var/anysda/.stamps/00-bootstrap
    force: false
    mode: '0644'
