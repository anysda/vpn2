---
# Аварийный Hysteria2 ждёт остановленным, порт закрыт. Обычный sing-box экзита
# эти шаги не трогают.
- name: Пользователь аварийного Hysteria2
  ansible.builtin.user:
    name: vpn2-hy2
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Каталог аварийного Hysteria2
  ansible.builtin.file:
    path: "{{ emergency_state }}/hy2"
    state: directory
    owner: vpn2-emergency
    group: vpn2-emergency
    mode: '0750'

# У юнита агента NoNewPrivileges, sudo там не работает; polkit спрашивает сам
# systemd по D-Bus и разрешает ровно эти действия над этими юнитами.
- name: Агент вправе запускать аварийный Hysteria2
  ansible.builtin.copy:
    src: 50-vpn2-emergency-hy2.rules
    dest: /etc/polkit-1/rules.d/50-vpn2-emergency-hy2.rules
    mode: '0644'

# При идущей аварии адрес и порт не меняются: их называют выданные профили.
# Команда пишет один и тот же файл настроек, вне аварии порт остаётся закрыт.
- name: Адрес и порт аварийного Hysteria2
  ansible.builtin.command:
    argv: "{{ emergency_bash + [emergency_hy2_step, emergency_vpn2, emergency_public_ip, emergency_hy2_port] }}"
  vars:
    emergency_hy2_step: |
      active=0
      systemctl is-active --quiet vpn2-emergency-hy2.service && active=1
      "$0" emergency hy2 endpoint "$1" "$2" "$active"
      [[ "$active" == 1 ]] || "$0" emergency hy2 close
  changed_when: false

- name: Порты аварийного входа и выпуска сертификата
  ansible.builtin.command:
    argv: [ufw, allow, "{{ item.port }}", comment, "{{ item.comment }}"]
  loop:
    - {port: "{{ emergency_hy2_port }}/udp", comment: emergency hysteria2}
    # Страницу отдаёт сам агент, и только во время аварии.
    - {port: 443/tcp, comment: vpn2 emergency panel}
    - {port: 80/tcp, comment: vpn2 exit ACME challenge}
  register: emergency_ufw_ports
  changed_when: "'Skipping' not in emergency_ufw_ports.stdout"

# Сертификат Let's Encrypt на IP экзита держится свежим в обычной работе, как у
# entry: короткий профиль, продление через 5 дней. Caddy здесь только клиент
# ACME: HTTP-01 на :80, сайт на loopback, 443 свободен для страницы аварийки.
# Без сертификата авария идёт на закреплённом самоподписанном.
- name: Caddy закреплённой версии
  ansible.builtin.command:
    argv: "{{ emergency_bash + [emergency_caddy_step, emergency_tmp, emergency_venv] }}"
  environment: "{{ emergency_env }}"
  vars:
    emergency_caddy_step: |
      source "$0/anysda-svc.sh"
      before=$(caddy version 2>/dev/null | cut -d' ' -f1 || true)
      # Пакет выпуска на узле лежит в venv.
      PATH="$1/bin:$PATH" caddy_install
      [[ "$(caddy version | cut -d' ' -f1)" == "$before" ]] || echo changed=1
  register: emergency_caddy
  changed_when: "'changed=1' in emergency_caddy.stdout"

- name: Библиотека TLS прошлых выпусков снята - её работу делает vpn2 tls
  ansible.builtin.file: {path: /usr/local/lib/vpn2, state: absent}

# Таймер стоит, пока настройки и сниппеты Caddy переписываются; последний шаг
# запускает его снова. Пара «остановил - запустил» изменением не считается.
- name: Таймер TLS на паузе
  ansible.builtin.command:
    argv: "{{ emergency_bash + ['systemctl stop vpn2-tls.timer vpn2-tls.service 2>/dev/null || true'] }}"
  changed_when: false

- name: Юниты аварийного Hysteria2 и выгрузки сертификата
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ emergency_units }}/{{ item }}"
    mode: '0644'
  loop: [vpn2-emergency-hy2.service, vpn2-emergency-hy2-probe.service, vpn2-tls.service, vpn2-tls.timer]
  register: emergency_exit_units

- name: Ресурсы юнита выгрузки сертификата
  ansible.builtin.include_role:
    name: resources
  vars:
    resources_units: [vpn2-tls]

- name: Юниты экзита перечитаны  # noqa: no-handler
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: emergency_exit_units is changed or emergency_unit is changed

- name: Настройки TLS и сниппеты Caddy
  ansible.builtin.command:
    argv:
      - "{{ emergency_vpn2 }}"
      - tls
      - --prepare
      - --role
      - exit
      - --host
      - "{{ emergency_public_ip }}"
      - --config
      - /etc/vpn2/tls/config.json
      - --caddy-dir
      - /etc/caddy
      - --output-dir
      - /etc/vpn2/tls/ip
      - --storage
      - /var/lib/caddy/.local/share/caddy
      - --cert-group
      - vpn2-emergency
      - --acme-url
      - "{{ emergency_tls_acme_url }}"
      - --acme-root
      - "{{ emergency_tls_acme_root }}"
  changed_when: false

- name: Caddy идёт с текущими настройками
  ansible.builtin.command:
    argv: "{{ emergency_bash + [emergency_caddy_restart, emergency_tmp] }}"
  environment: "{{ emergency_env }}"
  vars:
    emergency_caddy_restart: |
      source "$0/anysda-svc.sh"
      caddy validate --config /etc/caddy/Caddyfile >/dev/null
      svc_restart_if_changed caddy /usr/bin/caddy /usr/lib/systemd/system/caddy.service \
        /etc/caddy/Caddyfile /etc/caddy/vpn2-tls.conf
      echo "changed=$SVC_RESTARTED"
  register: emergency_caddy_run
  changed_when: "'changed=1' in emergency_caddy_run.stdout"

- name: Caddy включён
  ansible.builtin.systemd_service:
    name: caddy.service
    enabled: true

- name: Первый сертификат на IP
  ansible.builtin.command:
    argv:
      - "{{ emergency_vpn2 }}"
      - tls
      - --initial
      - --config
      - /etc/vpn2/tls/config.json
      - --wait
      - "{{ emergency_tls_wait }}"
  changed_when: false

- name: Таймер TLS идёт
  ansible.builtin.command:
    argv: [systemctl, enable, --now, vpn2-tls.timer]
  changed_when: false

# Пара аварийного входа заранее: общая на IP или самоподписанная; при идущей
# выдаче шаг её не трогает.
- name: Сертификат страницы аварийки
  ansible.builtin.command:
    argv: [runuser, -u, vpn2-emergency, --, "{{ emergency_vpn2 }}", emergency, hy2, tls-pair, "{{ emergency_public_ip }}"]
  changed_when: false
